name: NoMoreExcuse
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
packages:
  NoMoreExcuseCore:
    path: Packages/NoMoreExcuseCore
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
targets:
  NoMoreExcuse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NoMoreExcuse
        excludes:
          - Info.plist
    dependencies:
      - package: NoMoreExcuseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammedhassan.nomoreexcuse
        PRODUCT_NAME: No More Excuse
        INFOPLIST_FILE: NoMoreExcuse/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets: []
