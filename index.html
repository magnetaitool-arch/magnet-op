function triggerWebhook(type, payload){
  try {
    const cfg = JSON.parse(store.get(CFG_KEY)||'{}');
    const url = (cfg.webhooks||{})[type];
    if(!url) return; // silently no-op when not configured
    fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({type, payload, at:nowISO()}) }).catch(()=>{});
  } catch(e){ /* never throw */ }
}

/* ============================ AUTO-BACKUP ============================ */
/* Strong storage: keep rolling JSON snapshots inside localStorage AND optionally
   auto-download a file. Snapshots survive even if the main record is corrupted,
   and give you point-in-time restore. Settings let you also export to a file. */
const BK_KEY = 'tia_agency_os_backups';     // rolling in-browser snapshots
const BK_META = 'tia_agency_os_backup_meta'; // {lastAt, autoDownload, intervalH}
const BK_MAX = 7;                            // keep last 7 snapshots

function getBackupMeta(){ try { return JSON.parse(store.get(BK_META)||'null') || {autoDownload:false,intervalH:24,lastAt:0}; } catch(e){ return {autoDownload:false,intervalH:24,lastAt:0}; } }
function setBackupMeta(m){ store.set(BK_META, JSON.stringify(m)); }
function listSnapshots(){ try { return JSON.parse(store.get(BK_KEY)||'[]'); } catch(e){ return []; } }

function makeSnapshot(db, reason){
  const snaps = listSnapshots();
  const entry = { at:nowISO(), reason:reason||'auto', size:0, data:db };
  try { entry.size = JSON.stringify(db).length; } catch(e){}
  snaps.unshift(entry);
  const trimmed = snaps.slice(0, BK_MAX);
  try { store.set(BK_KEY, JSON.stringify(trimmed)); }
  catch(e){ // storage full -> drop oldest until it fits
    while(trimmed.length>1){ trimmed.pop(); try { store.set(BK_KEY, JSON.stringify(trimmed)); break; } catch(_){} }
  }
  const meta = getBackupMeta(); meta.lastAt = Date.now(); setBackupMeta(meta);
  return entry;
}

function downloadJSON(db, label){
  try {
    const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'magnet-os-'+(label||'backup')+'-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
  } catch(e){}
}

/* Called on app start: snapshot, and auto-download if due (interval elapsed). */
function runAutoBackup(db){
  makeSnapshot(db, 'session-start');
  const meta = getBackupMeta();
  if(meta.autoDownload){
    const dueMs = (meta.intervalH||24)*3600*1000;
    const last = meta.lastDownloadAt||0;
    if(Date.now()-last >= dueMs){
      downloadJSON(db, 'auto');
      meta.lastDownloadAt = Date.now(); setBackupMeta(meta);
    }
  }
}

// showProPopup(type, context) — renders a dark toast with lime accent; auto-dismiss 4s.
function showProPopup(type, context){
  try {
    const prefs=getPopupPrefs(); if(!prefs.enabled) return;
    const lib=POPUP_LIB[type]; if(!lib) return;
    const msg=(lib[prefs.tone]||lib.Professional);
    let host=document.getElementById('tia-toasts');
    if(!host){ host=document.createElement('div'); host.id='tia-toasts'; document.body.appendChild(host); }
    host.className='toast-host '+({'Top Right':'tr','Bottom Right':'br','Bottom Center':'bc'}[prefs.position]||'tr');
    const negTypes=['taskOverdue','requestRejected','invoiceOverdue','syncFailed'];
    const el=document.createElement('div'); el.className='pro-toast'+(negTypes.includes(type)?' neg':'');
    el.innerHTML='<div class="pt-bar"></div><div class="pt-body"><div class="pt-title"></div><div class="pt-msg"></div>'+(context?'<div class="pt-ctx"></div>':'')+'</div>';
    el.querySelector('.pt-title').textContent=lib.title;
    el.querySelector('.pt-msg').textContent=msg;
    if(context) el.querySelector('.pt-ctx').textContent=context;
    host.appendChild(el);
    requestAnimationFrame(()=>el.classList.add('in'));
    setTimeout(()=>{ el.classList.remove('in'); setTimeout(()=>el.remove(),300); }, 4000);
  } catch(e){ /* never throw */ }
}

/* ============================ DATA HEALTH CHECKER ============================ */
function runDataHealth(db){
  db=db||{}; const warns=[];
  const add=(severity,label,count,route)=>{ if(count>0) warns.push({severity,label,count,route}); };
  add('warn','Clients without a project manager',(db.clients||[]).filter(c=>!c.projectManagerId&&!c.ownerId&&!c.accountManagerId).length,'clients');
  add('warn','Projects without tasks',(db.projects||[]).filter(p=>!(db.tasks||[]).some(t=>t.projectId===p.id)).length,'projects');
  add('warn','Tasks without an assignee',(db.tasks||[]).filter(t=>!t.assignedTo).length,'tasks');
  add('neg','Deliverables without client/project',(db.deliverables||[]).filter(d=>!d.clientId||!d.projectId).length,'deliverables');
  add('neg','Invoices without a client',(db.invoices||[]).filter(i=>!i.clientId).length,'invoices');
  add('warn','Clients with missing assets',(db.clients||[]).filter(c=>(db.clientAssets||[]).some(a=>a.clientId===c.id&&a.accessStatus==='Missing')).length,'clientAssets');
  add('warn','Overdue tasks',(db.tasks||[]).filter(t=>t.dueDate&&new Date(t.dueDate)<new Date(todayISO())&&!['Done','Delivered','Approved','Cancelled'].includes(t.status)).length,'tasks');
  add('neg','Overdue invoices',(db.invoices||[]).filter(i=>{ const bal=(Number(i.amount)||0)*(1+(Number(i.tax)||0)/100)-(db.payments||[]).filter(p=>p.invoiceId===i.id).reduce((s,p)=>s+(+p.amount||0),0); return bal>0&&i.dueDate&&new Date(i.dueDate)<new Date(todayISO()); }).length,'invoices');
  add('warn','Employees without a role',(db.employees||[]).filter(e=>!e.role&&!e.jobTitle).length,'employees');
  let missingIds=0; COLLECTIONS.forEach(c=>(db[c]||[]).forEach(r=>{ if(!r||!r.id) missingIds++; }));
  add('neg','Records with missing IDs',missingIds,'settings');
  return warns;
}

/* ============================================================================
   CLOUD LAYER — Supabase compatibility with the simple records table.

   CURRENT SCHEMA (run supabase-schema.sql):
     create table records ( id text primary key, coll text, data jsonb,
                             updated_at timestamptz default now() );
   We store each app record as one row: { id, coll, data:{...record} }.

   FUTURE PROPER SCHEMA (optional, see supabase-schema-future.sql): one real
   table per collection with typed columns + foreign keys + RLS by auth.uid().
   This app reads/writes only with the ANON PUBLIC KEY — never the service role.
   ============================================================================ */
const getCfg = () => { try { return JSON.parse(store.get(CFG_KEY)||'null'); } catch(e){ return null; } };
const setCfg = (c) => c ? store.set(CFG_KEY, JSON.stringify(c)) : store.del(CFG_KEY);
const cfgComplete = (c) => !!(c && c.url && c.key);

function _headers(cfg, extra){
  // Legacy anon/service keys are JWTs (start with "eyJ") and go in the Authorization
  // header. The newer publishable keys (sb_publishable_...) are NOT JWTs — sending
  // them as a Bearer token makes PostgREST try (and fail) to decode a JWT, which
  // breaks anon access. For those, the apikey header alone authenticates as `anon`.
  var h = { apikey:cfg.key, 'Content-Type':'application/json' };
  if(/^eyJ/.test(cfg.key||'')) h.Authorization = 'Bearer '+cfg.key;
  return Object.assign(h, extra||{});
}
function _rest(cfg, path){ return cfg.url.replace(/\/$/,'') + '/rest/v1/' + path; }

/* ---- Accounts/auth via the service-role `accounts` Edge Function. Password
   hashes stay on the server and never reach the browser. A short-lived HMAC token
   (issued on login) authorizes account writes. Every call falls back to the legacy
   anon path if the function is unreachable, so an outage never blocks login. ---- */
const ACCT_TOKEN_KEY = 'tia_acct_token';
function _acctUrl(cfg){ return (cfg.url||'').replace(/\/$/,'') + '/functions/v1/accounts'; }
function getAcctToken(){ try{ return store.get(ACCT_TOKEN_KEY) || sessionStorage.getItem(ACCT_TOKEN_KEY) || ''; }catch(e){ return ''; } }
function setAcctToken(t, remember){ try{ if(!t){ store.del(ACCT_TOKEN_KEY); try{sessionStorage.removeItem(ACCT_TOKEN_KEY);}catch(e){} return; } if(remember){ store.set(ACCT_TOKEN_KEY, t); try{sessionStorage.removeItem(ACCT_TOKEN_KEY);}catch(e){} } else { try{sessionStorage.setItem(ACCT_TOKEN_KEY, t);}catch(e){} store.del(ACCT_TOKEN_KEY); } }catch(e){} }
async function acctApi(cfg, action, payload){
  const res = await fetch(_acctUrl(cfg), { method:'POST', headers:{ apikey:cfg.key, 'Content-Type':'application/json' }, body: JSON.stringify(Object.assign({action}, payload||{})) });
  if(res.status===404) throw new Error('accounts function not deployed');
  return await res.json();
}

async function cloudPing(cfg){
  if(!cfgComplete(cfg)) throw new Error('Supabase URL and anon key required');
  const res = await fetch(_rest(cfg,'records?select=id&limit=1'), { headers:_headers(cfg) });
  if(!res.ok) throw new Error('Connection failed ('+res.status+'). Did you run the SQL setup?');
  return true;
}
async function cloudLoadAll(cfg){
  const res = await fetch(_rest(cfg,'records?select=*'), { headers:_headers(cfg) });
  if(!res.ok) throw new Error('Load failed ('+res.status+')');
  const rows = await res.json(); const db = {};
  COLLECTIONS.forEach(c=>db[c]=[]);
  rows.forEach(r=>{ if(!db[r.coll]) db[r.coll]=[]; db[r.coll].push(Object.assign({id:r.id}, r.data||{})); });
  return db;
}
// Diagnostics — run  __moDiag()  in the browser console to see why sync may be off.
window.__moDiag = async function(){
  const cfg = getCfg(); const out = {
    realtime: !!window.__rtOn,
    pollCount: window.__moPollN||0,
    lastSyncSecAgo: window.__moLastSync? Math.round((Date.now()-window.__moLastSync)/1000) : 'never',
    serviceWorker: (navigator.serviceWorker && navigator.serviceWorker.controller) ? navigator.serviceWorker.controller.scriptURL : 'none',
    cfg: cfg&&cfg.url ? cfg.url : 'MISSING',
  };
  try { const t0=Date.now(); const r=await fetch((cfg.url||'').replace(/\/$/,'')+'/rest/v1/records?select=id&limit=1',{headers:{apikey:cfg.key}}); out.liveFetch = r.ok ? ('OK '+(Date.now()-t0)+'ms') : ('FAIL '+r.status); } catch(e){ out.liveFetch = 'ERROR '+((e&&e.message)||e); }
  try { out.caches = window.caches ? (await caches.keys()) : 'n/a'; } catch(e){ out.caches='err'; }
  console.log('%cMagnet OS diagnostics','font-weight:bold;font-size:13px;color:#5b7d00', out); return out;
};
// Load a single collection (used by the live-chat / notifications poller so we
// don't pull the whole database every few seconds).
async function cloudLoadColl(cfg, coll){
  if(!cfgComplete(cfg)) return null;
  const res = await fetch(_rest(cfg,'records?select=id,data&coll=eq.'+encodeURIComponent(coll)), { headers:_headers(cfg) });
  if(!res.ok) return null;
  const rows = await res.json();
  return rows.map(r=>Object.assign({id:r.id}, r.data||{}));
}
// Merge a single collection (local + cloud) keeping the newest record per id.
function mergeColl(localArr, cloudArr){
  const ts=r=> Date.parse((r&&(r.updatedAt||r.createdAt))||0)||0;
  const map={}; (localArr||[]).forEach(r=>{ if(r&&r.id) map[r.id]=r; });
  (cloudArr||[]).forEach(r=>{ if(r&&r.id){ const cur=map[r.id]; if(!cur||ts(r)>=ts(cur)) map[r.id]=r; } });
  // Drop tombstoned (deleted) records so a delete propagates and never resurrects.
  return Object.values(map).filter(r=>!r._del);
}
// Order-independent equality of two record arrays by id + updatedAt. Lets the
// sync loops SKIP re-rendering (return the same state reference) when a poll
// brings back data that hasn't actually changed — the root fix for UI lag.
function collSame(a, b){
  a=a||[]; b=b||[]; if(a.length!==b.length) return false;
  const m=Object.create(null);
  for(let i=0;i<a.length;i++){ const r=a[i]; if(r&&r.id) m[r.id]=(r.updatedAt||r.createdAt||''); }
  for(let i=0;i<b.length;i++){ const r=b[i]; if(!r||!r.id) continue; if(!(r.id in m) || m[r.id]!==(r.updatedAt||r.createdAt||'')) return false; }
  return true;
}

/* ---- Email. The live site runs on Vercel, so the primary endpoint is the
   Vercel function /api/send-email (the netlify path only works on Netlify and is
   kept as a fallback). The function holds the secret API key server-side; the
   browser only posts the message. Returns {ok,id} or throws a readable error. -- */
async function sendEmail(payload){ // { to, subject, html?, text? }
  const body = JSON.stringify(payload||{});
  const endpoints = ['/api/send-email', '/.netlify/functions/send-email'];
  let lastErr = 'Email failed';
  for(const ep of endpoints){
    let res;
    try { res = await fetch(ep, { method:'POST', headers:{'Content-Type':'application/json'}, body }); }
    catch(e){ lastErr = String((e&&e.message)||e); continue; }
    // 404 means this host doesn't expose that endpoint (e.g. /api on Netlify or
    // /.netlify on Vercel) — try the next one rather than failing.
    if(res.status===404){ lastErr = 'Email endpoint not found ('+ep+')'; continue; }
    let data={}; try{ data=await res.json(); }catch(e){}
    if(!res.ok) throw new Error((data&&data.error) || ('Email failed ('+res.status+')'));
    return data;
  }
  throw new Error(lastErr);
}
window.sendEmail = sendEmail;
/* Safe merge: combine local + cloud per record id, keeping the newest by
   updatedAt (falls back to createdAt). Prevents a teammate's edit, or an
   offline local change, from being silently overwritten on sync. Deletions
   are intentionally NOT inferred here (a missing record on one side is kept),
   so nothing is ever lost by a sync; use explicit Delete to remove. */
function mergeDB(local, cloud){
  const out={}; local=local||{}; cloud=cloud||{};
  const ts=r=> Date.parse((r&&(r.updatedAt||r.createdAt))||0)||0;
  COLLECTIONS.forEach(coll=>{
    const map={};
    (local[coll]||[]).forEach(r=>{ if(r&&r.id) map[r.id]=r; });
    (cloud[coll]||[]).forEach(r=>{ if(r&&r.id){ const cur=map[r.id]; if(!cur || ts(r)>=ts(cur)) map[r.id]=r; } });
    out[coll]=Object.values(map).filter(r=>!r._del); // drop tombstoned (deleted) records
  });
  return out;
}
async function cloudUpsert(cfg, coll, rec){
  if(!cfgComplete(cfg) || !rec || !rec.id) return;
  try {
    const res = await fetch(_rest(cfg,'records?on_conflict=id'),
      { method:'POST', headers:_headers(cfg,{Prefer:'resolution=merge-duplicates,return=minimal'}),
        body: JSON.stringify([{ id:rec.id, coll, data:rec }]) });
    if(!res.ok) syncQueuePush({ type:'upsert', coll, rec });      // server rejected -> retry later
  } catch(e){ syncQueuePush({ type:'upsert', coll, rec }); }      // offline -> durable queue, retry later
}
async function cloudDelete(cfg, id){
  if(!cfgComplete(cfg) || !id) return;
  try {
    const res = await fetch(_rest(cfg,'records?id=eq.'+encodeURIComponent(id)), { method:'DELETE', headers:_headers(cfg) });
    if(!res.ok) syncQueuePush({ type:'delete', id });
  } catch(e){ syncQueuePush({ type:'delete', id }); }
}
async function cloudPushAll(cfg, db){
  if(!cfgComplete(cfg)) return;
  const rows=[]; COLLECTIONS.forEach(coll=>(db[coll]||[]).forEach(r=>r&&r.id&&rows.push({id:r.id,coll,data:r})));
  // chunk to keep payloads reasonable
  for(let i=0;i<rows.length;i+=200){
    try { await fetch(_rest(cfg,'records?on_conflict=id'),
      { method:'POST', headers:_headers(cfg,{Prefer:'resolution=merge-duplicates,return=minimal'}),
        body: JSON.stringify(rows.slice(i,i+200)) }); } catch(e){}
  }
}

/* ---- Durable offline sync queue (additive). Failed cloud writes no longer
   vanish until the next bulk push: they are queued in localStorage and retried
   automatically (on the browser 'online' event, every 30s while pending, and on
   startup). Records are already saved locally BEFORE the cloud write, and the
   cloud merge keeps the newest copy per id, so draining can never overwrite a
   newer cloud record with a stale one being resurrected: the queued write is
   simply upserted and the usual merge-by-updatedAt rules apply on next load.
   Diagnostics: window.__syncQueue.{size,list,drain}. A small non-React chip
   shows the pending count (click = retry now). ---- */
const SYNC_QUEUE_KEY = 'tia_sync_queue';
function syncQueueLoad(){ try { const l=JSON.parse(store.get(SYNC_QUEUE_KEY)||'[]'); return Array.isArray(l)?l:[]; } catch(e){ return []; } }
function syncQueueSave(list){ try { store.set(SYNC_QUEUE_KEY, JSON.stringify(list.slice(-500))); } catch(e){} syncQueueChip(); }
function syncQueuePush(item){
  try {
    const list=syncQueueLoad();
    const keyOf=(x)=> x.type+':'+(x.id || (x.rec&&x.rec.id) || '');
    const k=keyOf(item); const i=list.findIndex(x=>keyOf(x)===k);
    item.queuedAt=nowISO(); item.tries=(i>=0?(list[i].tries||0):0);
    if(i>=0) list[i]=item; else list.push(item);       // newest write per record wins in the queue
    syncQueueSave(list);
  } catch(e){}
}
let _sqDraining=false;
async function syncQueueDrain(){
  if(_sqDraining) return; _sqDraining=true;
  try {
    const cfg=getCfg(); if(!cfgComplete(cfg)) return;
    const list=syncQueueLoad(); if(!list.length) return;
    const keep=[];
    for(const item of list){
      let ok=false;
      try {
        if(item.type==='upsert' && item.rec && item.rec.id){
          const res=await fetch(_rest(cfg,'records?on_conflict=id'),
            { method:'POST', headers:_headers(cfg,{Prefer:'resolution=merge-duplicates,return=minimal'}),
              body: JSON.stringify([{ id:item.rec.id, coll:item.coll, data:item.rec }]) });
          ok=res.ok;
        } else if(item.type==='delete' && item.id){
          const res=await fetch(_rest(cfg,'records?id=eq.'+encodeURIComponent(item.id)), { method:'DELETE', headers:_headers(cfg) });
          ok=res.ok;
        } else { ok=true; } // unknown/corrupt item -> drop rather than retry forever
      } catch(e){ ok=false; }
      if(!ok){ item.tries=(item.tries||0)+1; keep.push(item); }
    }
    syncQueueSave(keep);
    if(!keep.length) window.__moLastSync=Date.now();
  } finally { _sqDraining=false; }
}
function syncQueueChip(){
  try {
    const n=syncQueueLoad().length;
    let el=document.getElementById('sync-pending-chip');
    if(!n){ if(el) el.remove(); return; }
    if(!el){
      el=document.createElement('div'); el.id='sync-pending-chip';
      el.style.cssText='position:fixed;left:14px;bottom:14px;z-index:9999;background:#151713;color:#c8f31e;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 13px;font:600 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.06em;box-shadow:0 8px 24px -12px rgba(0,0,0,.85);cursor:pointer;user-select:none';
      el.title='Pending cloud writes. They retry automatically; click to retry now.';
      el.onclick=function(){ syncQueueDrain(); };
      document.body.appendChild(el);
    }
    el.textContent='SYNC PENDING: '+n;
  } catch(e){}
}
window.__syncQueue = { size:()=>syncQueueLoad().length, list:syncQueueLoad, drain:syncQueueDrain };
try {
  window.addEventListener('online', function(){ syncQueueDrain(); });          // network came back
  window.addEventListener('focus', function(){ if(syncQueueLoad().length) syncQueueDrain(); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && syncQueueLoad().length) syncQueueDrain(); });
  setInterval(function(){ if(syncQueueLoad().length) syncQueueDrain(); }, 8000); // backup retry every 8s
  setTimeout(function(){ syncQueueChip(); if(syncQueueLoad().length) syncQueueDrain(); }, 2500);
} catch(e){}

/* ===== crm-auth.js ===== */
/* ============================================================================
   AUTH & USER ACCOUNTS — frontend/localStorage simulation.
   PRODUCTION NOTE: real authentication and password recovery MUST be handled by
   a backend (Supabase / Firebase / custom API). This module is structured so the
   storage + hashing functions can be swapped for real backend calls later:
     - hashPassword()  -> server-side hashing / provider sign-up
     - authLogin()     -> provider signInWithPassword
     - userStore CRUD  -> a `users` table with RLS
   Data keys are namespaced and never touch existing CRM data (tia_agency_os_v2).
   ============================================================================ */
const AUTH_KEYS = { users:'tia_users', current:'tia_current_user', session:'tia_session', perms:'tia_permissions', settings:'tia_auth_settings' };

/* ---- password hashing — salted PBKDF2-SHA-256 (Web Crypto).
   Format: "pbkdf2$<iterations>$<saltB64>$<hashB64>". Salting + 150k iterations
   makes the hashes resistant to rainbow tables / GPU cracking even though they
   live in the shared records table. verifyPassword() still accepts the OLD
   unsalted "sha256:"/"fallback:" hashes so existing accounts keep working; they
   are transparently re-hashed to PBKDF2 on the next successful login. ---- */
const PBKDF2_ITERS = 150000;
function _b64(bytes){ const a=new Uint8Array(bytes); let s=''; for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }
function _fromB64(str){ const bin=atob(String(str||'')); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
async function _pbkdf2Bits(pw, salt, iters){
  const key = await window.crypto.subtle.importKey('raw', new TextEncoder().encode(pw), {name:'PBKDF2'}, false, ['deriveBits']);
  return await window.crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:iters, hash:'SHA-256'}, key, 256);
}
// Reproduces the legacy hash exactly so old stored hashes still verify.
async function _legacyHash(pw){
  pw = String(pw==null?'':pw);
  try {
    if(window.crypto && window.crypto.subtle){
      const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      return 'sha256:'+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  } catch(e){}
  let h=0; for(let i=0;i<pw.length;i++){ h=((h<<5)-h+pw.charCodeAt(i))|0; }
  return 'fallback:'+(h>>>0).toString(16);
}
function isLegacyHash(hash){ return /^(sha256|fallback):/.test(String(hash||'')); }
async function hashPassword(pw){
  pw = String(pw==null?'':pw);
  try {
    if(window.crypto && window.crypto.subtle && window.crypto.getRandomValues){
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const bits = await _pbkdf2Bits(pw, salt, PBKDF2_ITERS);
      return 'pbkdf2$'+PBKDF2_ITERS+'$'+_b64(salt)+'$'+_b64(bits);
    }
  } catch(e){}
  return _legacyHash(pw); // very old browsers without SubtleCrypto
}
async function verifyPassword(pw, hash){
  hash = String(hash||'');
  if(hash.indexOf('pbkdf2$')===0){
    try {
      const parts = hash.split('$'); // ['pbkdf2', iters, saltB64, hashB64]
      const bits = await _pbkdf2Bits(String(pw==null?'':pw), _fromB64(parts[2]), parseInt(parts[1],10)||PBKDF2_ITERS);
      return _b64(bits) === parts[3];
    } catch(e){ return false; }
  }
  return (await _legacyHash(pw)) === hash; // legacy compatibility
}

/* ---- user store (localStorage) ---- */
function loadUsers(){ try { return JSON.parse(store.get(AUTH_KEYS.users)||'[]'); } catch(e){ return []; } }
function saveUsers(list){ store.set(AUTH_KEYS.users, JSON.stringify(list)); try { cloudPushUsers(list); } catch(e){} }

/* ---- shared team accounts: sync through the cloud `records` table (coll='_accounts')
   so an account created on one device can sign in from any device. Uses the same
   anon key + REST helpers as the data layer (_rest/_headers/getCfg/cfgComplete in
   crm-cloud.js). SECURITY: password hashes (SHA-256) live in the shared table,
   readable by anyone with the anon key — acceptable for an internal team tool,
   matching the app's existing "team access" model. Lock down with Supabase Auth
   later if you need stricter isolation. ---- */
async function cloudPushUsers(list){
  const cfg=getCfg(); if(!cfgComplete(cfg)) return;
  list = list || loadUsers(); if(!list.length) return;
  try { const r=await acctApi(cfg,'save',{ token:getAcctToken(), users:list }); if(r && (r.ok || r.error==='unauthorized')) return; }
  catch(e){ /* function unreachable -> legacy anon fallback */ }
  try {
    const rows = list.map(u=>({ id:'acct-'+u.id, coll:'_accounts', data:u }));
    await fetch(_rest(cfg,'records?on_conflict=id'),
      { method:'POST', headers:_headers(cfg,{Prefer:'resolution=merge-duplicates,return=minimal'}), body: JSON.stringify(rows) });
  } catch(e){}
}
async function cloudDeleteUser(id){
  const cfg=getCfg(); if(!cfgComplete(cfg)||!id) return;
  try { const r=await acctApi(cfg,'delete',{ token:getAcctToken(), id }); if(r && (r.ok || r.error==='unauthorized')) return; }
  catch(e){}
  try { await fetch(_rest(cfg,'records?id=eq.'+encodeURIComponent('acct-'+id)), { method:'DELETE', headers:_headers(cfg) }); } catch(e){}
}
async function cloudPullUsers(){
  const cfg=getCfg(); if(!cfgComplete(cfg)) return null;
  // Preferred: sanitized roster from the Edge Function (no password hashes).
  try { const r=await acctApi(cfg,'list',{ token:getAcctToken() }); if(r && r.ok && Array.isArray(r.users)) return r.users.filter(u=>u&&u.id); }
  catch(e){ /* fall back to anon read (works only while _accounts is anon-readable) */ }
  try {
    const res=await fetch(_rest(cfg,'records?select=data&coll=eq._accounts'), { headers:_headers(cfg) });
    if(!res.ok) return null;
    const rows=await res.json();
    return rows.map(r=>r.data).filter(u=>u&&u.id);
  } catch(e){ return null; }
}
// Pull shared accounts and merge into the local store (cloud is authoritative).
// Saves WITHOUT re-pushing to avoid a sync loop.
async function syncUsersFromCloud(){
  const cloud=await cloudPullUsers(); if(!cloud) return loadUsers();
  const byId={}; loadUsers().forEach(u=>byId[u.id]=u); cloud.forEach(u=>byId[u.id]=u);
  const merged=Object.values(byId);
  store.set(AUTH_KEYS.users, JSON.stringify(merged));
  return merged;
}
function getAuthSettings(){ try { return Object.assign({ defaultPasswordWarning:true }, JSON.parse(store.get(AUTH_KEYS.settings)||'{}')); } catch(e){ return { defaultPasswordWarning:true }; } }
function setAuthSettings(p){ store.set(AUTH_KEYS.settings, JSON.stringify(Object.assign(getAuthSettings(),p))); }

// Create the default Owner on first run (password admin123).
async function ensureDefaultOwner(){
  // Merge any shared cloud accounts with whatever is local (non-destructive: a
  // temporary cloud outage must never wipe local accounts). A new device joining
  // the team picks up everyone; a device that created accounts offline pushes them up.
  const cloud = await cloudPullUsers().catch(()=>null);
  const local = loadUsers();
  if((cloud && cloud.length) || local.length){
    const byId={}; local.forEach(u=>{ if(u&&u.id) byId[u.id]=u; });
    (cloud||[]).forEach(u=>{ if(u&&u.id) byId[u.id]=u; }); // cloud authoritative on conflicts
    const merged=Object.values(byId);
    store.set(AUTH_KEYS.users, JSON.stringify(merged));
    if(merged.length > (cloud?cloud.length:0)) cloudPushUsers(merged).catch(()=>{}); // sync local-only accounts up
    return merged;
  }
  const owner = {
    id:'usr-owner', fullName:'System Owner', username:'owner', email:'owner@tiaos.local', phone:'',
    jobTitle:'Owner', role:'Owner', status:'Active', passwordHash: await hashPassword('admin123'),
    assignedClients:[], assignedTasks:[], dataScope:'all', createdAt:nowISO(), lastLogin:'', isDefaultPassword:true,
  };
  saveUsers([owner]); setAuthSettings({ defaultPasswordWarning:true });
  return [owner];
}

/* ---- session ---- */
function getSessionUser(){
  try {

/* ---- login (returns {ok, user, token?} or {ok:false, reason}) ---- */
async function authLogin(identifier, password){
  const cfg=getCfg();
  // PRIMARY: server-side verification via the accounts Edge Function. The password
  // hash is verified on the server and never sent to the browser.
  if(cfgComplete(cfg)){
    try {
      const r = await acctApi(cfg,'login',{ identifier, password });
      if(r && typeof r.ok==='boolean'){
        if(!r.ok) return { ok:false, reason:r.reason||'invalid' };
        // cache the (hash-free) user locally so the app has the roster offline
        try { const list=loadUsers(); const i=list.findIndex(u=>u.id===r.user.id); if(i>=0) list[i]=Object.assign({},list[i],r.user); else list.push(r.user); store.set(AUTH_KEYS.users, JSON.stringify(list)); } catch(e){}
        return { ok:true, user:r.user, token:r.token };
      }
    } catch(e){ /* function unreachable -> fall through to legacy local verification */ }
  }
  // FALLBACK (Edge Function unreachable): legacy local/anon verification.
  await syncUsersFromCloud().catch(()=>{});
  const users = loadUsers();
  const id=(identifier||'').trim().toLowerCase();
  const user = users.find(u=>(u.email||'').toLowerCase()===id || (u.username||'').toLowerCase()===id);
  if(!user) return { ok:false, reason:'invalid' };
  if(user.status!=='Active') return { ok:false, reason:'inactive' };
  if(!(await verifyPassword(password, user.passwordHash))) return { ok:false, reason:'invalid' };
  if(isLegacyHash(user.passwordHash)){ try { user.passwordHash = await hashPassword(password); } catch(e){} }
  user.lastLogin = nowISO();
  saveUsers(users.map(u=>u.id===user.id?user:u));
  return { ok:true, user };
}

/* ---- user management helpers ---- */
const activeOwners = (users)=> users.filter(u=>u.role==='Owner' && u.status==='Active');
function validatePassword(pw, confirm){
  if(!pw || pw.length<6) return 'Password must be at least 6 characters.';
  if(pw!==confirm) return 'Password and confirmation do not match.';
  return null;
}

window.AUTH = { AUTH_KEYS, hashPassword, verifyPassword, loadUsers, saveUsers, ensureDefaultOwner, getSessionUser, setSessionUser, clearSessionUser, authLogin, getAuthSettings, setAuthSettings, activeOwners, validatePassword, cloudPushUsers, cloudDeleteUser, cloudPullUsers, syncUsersFromCloud };

function loadDB(){

  // If connected to a cloud, START EMPTY and let cloudLoadAll fill it with the REAL
  // data — NEVER seed demo records over a live cloud. (Auto-seeding on a fresh
  // browser was creating phantom demo employees/clients that "came back" on every
  // cache clear.) Only a truly local/no-cloud setup gets the demo seed.
  try { const cfg=getCfg(); if(cfg && cfg.url && cfg.key){ const empty={}; COLLECTIONS.forEach(c=>empty[c]=[]); return empty; } } catch(e){}
  const s = seed(); store.set(KEY, JSON.stringify(s)); return s;
}

/* ====================== LIGHTWEIGHT CHART PRIMITIVES (SVG) ====================== */
const reduceMotion = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } };
// Count-up animated number
function CountUp({ value, format, dur=900 }){
  const [n,setN]=useState(reduceMotion()?value:0);
  useEffect(()=>{ if(reduceMotion()){ setN(value); return; }
    let raf, start; const from=0, to=Number(value)||0;
    const tick=(ts)=>{ if(!start) start=ts; const p=Math.min(1,(ts-start)/dur); setN(Math.round((from+(to-from)*(1-Math.pow(1-p,3)))*100)/100); if(p<1) raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick); return ()=>cancelAnimationFrame(raf);
  },[value]);
  return html`<span>${format?format(n):n}</span>`;
}
// Animated KPI card with trend + optional progress
function AnimatedKPI({ label, value, format, icon, sub, trend, progress, accent }){
  return html`<div class="kpi kpi-anim">
    <div class="k-top"><div class="k-ic" style=${accent?{color:accent}:null}>${React.createElement(Icon[icon]||Icon.command)}</div>
      ${trend!=null&&html`<span class="k-trend ${trend>=0?'up':'down'}">${trend>=0?'▲':'▼'} ${Math.abs(trend)}%</span>`}</div>
    <div class="k-lab">${label}</div>
    <div class="k-val" style=${{marginTop:6}}><${CountUp} value=${value} format=${format}/></div>
    ${sub&&html`<div class="k-foot">${sub}</div>`}
    ${progress!=null&&html`<div class="k-bar"><i style=${{width:Math.min(100,progress)+'%',background:accent||'var(--lime)'}}></i></div>`}
  </div>`;
}
// Donut / pie
function DonutChart({ data, size=150, thickness=20, centerLabel, centerValue }){
  const total=data.reduce((s,d)=>s+(d.value||0),0)||1;
  const r=(size-thickness)/2, c=size/2, circ=2*Math.PI*r; let off=0;
  return html`<div class="chart-donut" style=${{width:size,height:size}}>
    <svg viewBox=${`0 0 ${size} ${size}`} width=${size} height=${size}>
      ${data.map((d,i)=>{ const frac=(d.value||0)/total; const len=frac*circ; const el=html`<circle key=${i} cx=${c} cy=${c} r=${r} fill="none"
        stroke=${d.color} stroke-width=${thickness} stroke-dasharray=${`${len} ${circ-len}`} stroke-dashoffset=${-off}
        transform=${`rotate(-90 ${c} ${c})`} class="donut-seg"/>`; off+=len; return el; })}
    </svg>
    ${(centerValue!=null)&&html`<div class="donut-center"><b>${centerValue}</b>${centerLabel&&html`<span>${centerLabel}</span>`}</div>`}
  </div>`;
}
// Legend
function ChartLegend({ data, fmt }){
  return html`<div class="chart-legend">${data.map((d,i)=>html`<div class="cl-item" key=${i}>
    <span class="cl-dot" style=${{background:d.color}}></span><span class="cl-lab">${d.label}</span><b>${fmt?fmt(d.value):d.value}</b></div>`)}</div>`;
}
// Vertical bars
function BarChart({ data, height=160, fmt }){
  const max=Math.max(1,...data.map(d=>d.value||0));
  return html`<div class="chart-bars" style=${{height}}>${data.map((d,i)=>html`<div class="cb-col" key=${i} title=${d.label+': '+(d.value||0)}>
    <div class="cb-bar" style=${{height:((d.value||0)/max*100)+'%',background:d.color||'var(--lime)'}}></div>
    <div class="cb-val">${fmt?fmt(d.value):(d.value||0)}</div>
    <div class="cb-lab">${d.label}</div></div>`)}</div>`;
}
// Horizontal bars
function HBarChart({ data, fmt }){
  const max=Math.max(1,...data.map(d=>d.value||0));
  return html`<div class="chart-hbars">${data.map((d,i)=>html`<div class="hb-row" key=${i}>
    <span class="hb-lab">${d.label}</span>
    <div class="hb-track"><i style=${{width:((d.value||0)/max*100)+'%',background:d.color||'var(--lime)'}}></i></div>
    <b class="hb-val">${fmt?fmt(d.value):(d.value||0)}</b></div>`)}</div>`;
}
// Line / area (months)
function LineChart({ series, height=170, fmt }){
  // series: [{label, color, points:[n,...]}], all same length; xLabels optional on first
  const all=series.flatMap(s=>s.points); const max=Math.max(1,...all); const min=Math.min(0,...all);
  const W=320,H=height,pad=8; const n=Math.max(1,(series[0]?.points.length||1)-1);
  const x=i=>pad+(i/n)*(W-2*pad); const y=v=>H-pad-((v-min)/(max-min||1))*(H-2*pad);
  return html`<svg class="chart-line" viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" style=${{width:'100%',height}}>
    ${series.map((s,si)=>{ const pts=s.points.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
      const area=`${pad},${H-pad} ${pts} ${W-pad},${H-pad}`;
      return html`<g key=${si}>
        <polygon points=${area} fill=${s.color} opacity="0.08"/>
        <polyline points=${pts} fill="none" stroke=${s.color} stroke-width="2" class="line-path"/>
      </g>`; })}
  </svg>`;
}

window.__charts = { CountUp, AnimatedKPI, DonutChart, ChartLegend, BarChart, HBarChart, LineChart, reduceMotion };


function Modal({ title, onClose, children, wide }) {
  useEffect(()=>{ const h=e=>e.key==='Escape'&&onClose(); window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h); },[]);
  return html`<div class="ovl" onClick=${onClose}>
    <div class="modal ${wide?'wide':''}" onClick=${e=>e.stopPropagation()}>
      <div class="modal-h"><h3>${title}</h3>
        <button class="icon-btn" onClick=${onClose}><span style=${{fontSize:18,lineHeight:1}}>×</span></button></div>
      <div class="modal-b">${children}</div>
    </div></div>`;
}

function Field({ f, value, onChange, db, rec }) {
  const set = v => onChange(f.k, v);
  if(f.type==='select'){ const _opts=(value && (f.opts||[]).indexOf(value)<0) ? [value, ...(f.opts||[])] : (f.opts||[]); // keep an existing off-list value visible (e.g. an older role name)
    return html`<label class="fld"><span>${f.label}</span>
    <select value=${value||''} onChange=${e=>set(e.target.value)}><option value="">—</option>
      ${_opts.map(o=>html`<option value=${o} key=${o}>${o}</option>`)}</select></label>`; }
  if(f.type==='ref'){ const opts=(db[f.coll]||[]).filter(r=> f.filterBy?f.filterBy(r,rec||{},db):true);
    return html`<label class="fld"><span>${f.label}</span>
    <select value=${value||''} onChange=${e=>set(e.target.value)}><option value="">—</option>
      ${opts.map(r=>html`<option value=${r.id} key=${r.id}>${r.fullName||r.brandName||r.projectName||r.name||r.title||r.invoiceNumber||r.id}</option>`)}</select></label>`; }
  if(f.type==='textarea') return html`<label class="fld full"><span>${f.label}</span>
    <textarea rows="3" value=${value||''} onChange=${e=>set(e.target.value)}></textarea></label>`;
  if(f.type==='multiref'){
    const arr = Array.isArray(value)?value : (value?[value]:[]);
    const opts = (db[f.coll]||[]).filter(r=> f.filter?f.filter(r):true);
    const labelOf = r => r.fullName||r.brandName||r.projectName||r.name||r.title||r.id;
    const toggle = id => { const s=new Set(arr); s.has(id)?s.delete(id):s.add(id); set([...s]); };
    return html`<label class="fld full"><span>${f.label}</span>
      <div class="multiref">
        ${arr.length?html`<div class="mr-chips">${arr.map(id=>{ const r=(db[f.coll]||[]).find(x=>x.id===id);
          return html`<span class="mr-chip" key=${id}>${r?labelOf(r):id}<button type="button" onClick=${()=>toggle(id)}>×</button></span>`; })}</div>`:''}
        <div class="mr-list">${opts.map(r=>html`<label class="mr-opt ${arr.includes(r.id)?'on':''}" key=${r.id}>
          <input type="checkbox" checked=${arr.includes(r.id)} onChange=${()=>toggle(r.id)}/><span>${labelOf(r)}</span></label>`)}
        ${opts.length===0?html`<div class="muted" style=${{fontSize:12,padding:6}}>—</div>`:''}</div>
      </div></label>`;
  }
  if(f.type==='multi'){ // multi-select from a fixed option list (stores an array of strings)
    const arr = Array.isArray(value)?value : (value?[value]:[]);
    const opts = f.opts||[];
    const toggle = v => { const s=new Set(arr); s.has(v)?s.delete(v):s.add(v); set([...s]); };
    return html`<label class="fld full"><span>${f.label}</span>
      <div class="multiref">
        ${arr.length?html`<div class="mr-chips">${arr.map(v=>html`<span class="mr-chip" key=${v}>${v}<button type="button" onClick=${()=>toggle(v)}>×</button></span>`)}</div>`:''}
        <div class="mr-list">${opts.map(v=>html`<label class="mr-opt ${arr.includes(v)?'on':''}" key=${v}>
          <input type="checkbox" checked=${arr.includes(v)} onChange=${()=>toggle(v)}/><span>${v}</span></label>`)}
        ${opts.length===0?html`<div class="muted" style=${{fontSize:12,padding:6}}>—</div>`:''}</div>
      </div></label>`;
  }
  if(f.type==='checkbox') return html`<label class="fld" style=${{flexDirection:'row',alignItems:'center',gap:9}}>
    <input type="checkbox" checked=${!!value} onChange=${e=>set(e.target.checked)} style=${{width:16,height:16,accentColor:'var(--lime)'}}/>
    <span style=${{textTransform:'none',letterSpacing:0,fontSize:13,color:'var(--ink-2)'}}>${f.label}</span></label>`;
  return html`<label class="fld ${f.full?'full':''}"><span>${f.label}${isUrl(value)?html` · <${Ln} href=${value}>${'فتح ↗'}<//>`:''}</span>
    <input type=${f.type||'text'} value=${value==null?'':value}
      onChange=${e=>{ const v=e.target.value; set(f.type==='number' ? (v===''?'':Number(v)) : v); }} /></label>`;
}
function RecordForm({ schema, initial, db, onSave, onClose, role }) {
  const [rec, setRec] = useState(initial||{});
  const [err, setErr] = useState('');
  const [step, setStep] = useState(0);
  const set = (k,v)=>setRec(r=>({...r,[k]:v}));
  const ar = getAppSettings().language==='ar';
  // hide admin-only / finance-only fields when the role isn't allowed
  const allowed = (schema||[]).filter(f=>{
    if(f.admin && !(role==='Admin')) return false;
    if(f.finance && !(role==='Admin'||role==='Accountant')) return false;
    return true;
  });
  const COLLAPSE = new Set(['Advanced','More','متقدّم']);
  const GL = {Basic:'الأساسي',Contact:'التواصل',Contract:'العقد',Account:'الحساب',Plan:'الخطة الشهرية (كام في الشهر)',Links:'الروابط',Advanced:'تفاصيل إضافية (اختياري)',Notes:'ملاحظات',Business:'بيانات',Other:'أخرى',Work:'الشغل',Compensation:'الرواتب',Performance:'الأداء',Access:'الدخول',Documents:'مستندات',Asset:'الأصل',Meeting:'الاجتماع'};
  const gl = (g)=> ar ? (GL[g]||g) : g;
  const hasGroups = allowed.some(f=>f.group);
  // build ordered groups
  const groups=[]; const seen={};
  allowed.forEach(f=>{ const g=f.group||'Other'; if(!seen[g]){seen[g]=[];groups.push(g);} seen[g].push(f); });
  const ess=groups.filter(g=>!COLLAPSE.has(g)); const adv=groups.filter(g=>COLLAPSE.has(g));
  const renderGroup=(g)=>html`<div key=${g} style=${{marginBottom:6}}>
    <div class="eyebrow" style=${{margin:'2px 0 12px'}}>${gl(g)}</div>
    <div class="form-grid">${seen[g].map(f=>html`<${Field} key=${f.k} f=${f} value=${rec[f.k]} onChange=${set} db=${db} rec=${rec}/>`)}</div></div>`;
  const isMissing=(f)=> f.req && (rec[f.k]===undefined||rec[f.k]===null||rec[f.k]===''||(Array.isArray(rec[f.k])&&rec[f.k].length===0));
  const missingIn=(gnames)=> allowed.filter(f=>gnames.includes(f.group||'Other') && isMissing(f));
  const allMissing=()=> allowed.filter(isMissing);
  const reqLbl=(m)=> (ar?'محتاج تملأ: ':'Required: ')+m.map(f=>f.label).join('، ');
  // MULTI-STEP when there are 3+ essential groups: one step per group + an optional
  // "More details" step for the collapsed advanced fields.
  const multi = hasGroups && ess.length>=3;
  if(multi){
    const steps=[...ess.map(g=>({key:g,groups:[g],label:gl(g)})), ...(adv.length?[{key:'__more',groups:adv,label:(ar?'تفاصيل إضافية':'More')}]:[])];
    const cur=steps[Math.min(step,steps.length-1)];
    const doSave=()=>{ const m=allMissing(); if(m.length){ setErr(reqLbl(m)); const idx=steps.findIndex(s=>s.groups.some(g=>m.some(f=>(f.group||'Other')===g))); if(idx>=0)setStep(idx); return; } onSave(rec); };
    const next=()=>{ const m=missingIn(cur.groups); if(m.length){ setErr(reqLbl(m)); return; } setErr(''); setStep(s=>Math.min(s+1,steps.length-1)); };
    const back=()=>{ setErr(''); setStep(s=>Math.max(s-1,0)); };
    const pct=Math.round(((step+1)/steps.length)*100);
    return html`<div>
      <div class="stepper">${steps.map((s,i)=>html`<div key=${s.key} class="step ${i===step?'on':''} ${i<step?'done':''}" onClick=${()=>i<step&&setStep(i)}>
        <span class="step-dot">${i<step?'✓':(i+1)}</span><span class="step-lab">${s.label}</span></div>`)}</div>
      <div class="step-prog"><i style=${{width:pct+'%'}}></i></div>
      <div style=${{maxHeight:'50vh',overflowY:'auto',paddingRight:4,marginTop:14}}>${cur.groups.map(renderGroup)}</div>
      ${err&&html`<div class="neg" style=${{fontSize:12,marginTop:10}}>${err}</div>`}
      <div class="form-foot" style=${{alignItems:'center'}}>
        <button class="btn btn-ghost" onClick=${onClose}>${ar?'إلغاء':'Cancel'}</button>
        <div style=${{flex:1}}></div>
        <span class="muted mono" style=${{fontSize:11}}>${(ar?'خطوة ':'Step ')+(step+1)+' / '+steps.length}</span>
        ${step>0&&html`<button class="btn btn-ghost" onClick=${back}>${ar?'رجوع':'Back'}</button>`}
        ${step<steps.length-1
          ? html`<button class="btn btn-pri" onClick=${next}>${ar?'التالي':'Next'}</button>`
          : html`<button class="btn btn-pri" onClick=${doSave}>${ar?'حفظ':'Save'}</button>`}
      </div></div>`;
  }
  // SINGLE-STEP (small forms) — unchanged behavior
  const save = ()=>{ const m=allMissing(); if(m.length){ setErr(reqLbl(m)); return; } onSave(rec); };
  const body = hasGroups
    ? html`<div>${ess.map(renderGroup)}${adv.length?html`<details style=${{marginTop:4}}><summary style=${{cursor:'pointer',fontSize:12,color:'var(--lime)',padding:'8px 0',listStyle:'none'}}>${ar?'▸ تفاصيل إضافية (اختياري)':'▸ More details (optional)'}</summary>${adv.map(renderGroup)}</details>`:''}</div>`
    : html`<div class="form-grid">${allowed.map(f=>html`<${Field} key=${f.k} f=${f} value=${rec[f.k]} onChange=${set} db=${db} rec=${rec}/>`)}</div>`;
  return html`<div>
    <div style=${{maxHeight:'60vh',overflowY:'auto',paddingRight:4}}>${body}</div>
    ${err&&html`<div class="neg" style=${{fontSize:12,marginTop:12}}>${err}</div>`}
    <div class="form-foot">
      <button class="btn btn-ghost" onClick=${onClose}>${ar?'إلغاء':'Cancel'}</button>
      <button class="btn btn-pri" onClick=${save}>${ar?'حفظ':'Save'}</button></div></div>`;
}

/* ---- Trello-style board: colored labels, due dates, checklists, and
   permission-gated drag. canMove=false makes the whole board read-only (no drag,
   no drop, drawer opens in view-only mode) so users without Edit permission for
   the section literally cannot change anything. ---- */
const BOARD_LABELS = [
  {id:'urgent',  name:'Urgent',       color:'#ff5d5d'},
  {id:'high',    name:'High',         color:'#ffa53d'},
  {id:'design',  name:'Design',       color:'#c4ff3d'},
  {id:'content', name:'Content',      color:'#3dd6ff'},
  {id:'review',  name:'Needs review', color:'#b78cff'},
  {id:'blocked', name:'Blocked',      color:'#ff4fd8'},
  {id:'ready',   name:'Ready',        color:'#46d369'},
];
const IS_TOUCH = (typeof window!=='undefined' && window.matchMedia) ? window.matchMedia('(pointer: coarse)').matches : false;
const cardTitle = (c)=> c.title||c.name||c.company||c.fullName||c.subject||'Untitled';
const fmtDay = (d)=>{ try { return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'}); } catch(e){ return d; } };
function CardMeta({ c }){
  const due=c.due, cl=c.checklist||[];
  const done=cl.filter(i=>i.done).length;
  const overdue = due && (new Date(due) < new Date(new Date().toDateString()));
  if(!due && !cl.length && !(c.desc&&String(c.desc).trim())) return '';
  return html`<div class="kmeta">
    ${due?html`<span class="kpill kdue ${overdue?'over':''}" style=${{display:'inline-flex',alignItems:'center',gap:4}}>${React.createElement(Icon.calendar)} ${fmtDay(due)}</span>`:''}
    ${cl.length?html`<span class="kpill kchk ${(done===cl.length&&done>0)?'all':''}" style=${{display:'inline-flex',alignItems:'center',gap:4}}>${React.createElement(Icon.check)} ${done}/${cl.length}</span>`:''}
    ${(c.desc&&String(c.desc).trim())?html`<span class="kpill" title="Has description">≡</span>`:''}
  </div>`;
}
function Kanban({ items, columns, field, render, onMove, onCard, canMove=true, onUpdate }) {
  const [drag,setDrag] = useState(null);
  const [over,setOver] = useState(null);
  const [open,setOpen] = useState(null);
  const openCard = open ? items.find(i=>i.id===open) : null;
  const tappable = !!(onUpdate||onCard);
  const canDrag = canMove && !IS_TOUCH; // touch devices can't HTML5-drag; tap a card to move instead
  const clickCard = (c,e)=>{ if(e.target.closest('button,a,input'))return; if(onUpdate) setOpen(c.id); else if(onCard) onCard(c); };
  return html`<div class="kwrap">
    ${tappable?html`<div class="khint">↔ Swipe for columns · tap a card to open & move it</div>`:''}
    <div class="kanban">${columns.map(col=>{
    const cards = items.filter(i=>i[field]===col);
    return html`<div class="kcol ${(over===col&&canDrag)?'kover':''}" key=${col}
        onDragOver=${e=>{ if(canDrag){ e.preventDefault(); if(over!==col) setOver(col); } }}
        onDragLeave=${()=>setOver(o=>o===col?null:o)}
        onDrop=${()=>{ if(canMove&&drag) onMove(drag,col); setDrag(null); setOver(null); }}>
      <div class="kcol-h"><span>${col}</span><span class="kcount">${cards.length}</span></div>
      <div class="kcol-b">${cards.map(c=>html`<div class="kcard ${canMove?'':'locked'} ${tappable?'tappable':''}" key=${c.id} draggable=${canDrag}
        onDragStart=${canDrag?(()=>setDrag(c.id)):null} onDragEnd=${()=>{ setDrag(null); setOver(null); }}
        onClick=${tappable?(e=>clickCard(c,e)):null}>
        ${(c.labels&&c.labels.length)?html`<div class="kcard-labels">${c.labels.map(lid=>{const L=BOARD_LABELS.find(x=>x.id===lid);return L?html`<span class="klabel" key=${lid} style=${{background:L.color}} title=${L.name}></span>`:'';})}</div>`:''}
        ${render(c)}
        <${CardMeta} c=${c}/>
      </div>`)}</div></div>`;
  })}
    ${(openCard&&onUpdate)?html`<${CardDrawer} card=${openCard} field=${field} columns=${columns} canEdit=${canMove} onClose=${()=>setOpen(null)} onUpdate=${onUpdate}/>`:''}</div>
  </div>`;
}
function CardDrawer({ card, field, columns, canEdit, onClose, onUpdate }){
  const [nt,setNt] = useState('');
  const cl = card.checklist||[];
  const done = cl.filter(i=>i.done).length;
  const set = (patch)=> onUpdate(card.id, patch);
  const toggleLabel = (id)=>{ if(!canEdit)return; const has=(card.labels||[]).includes(id); set({labels: has?(card.labels||[]).filter(x=>x!==id):[...(card.labels||[]),id]}); };
  const addItem = ()=>{ if(!canEdit||!nt.trim())return; set({checklist:[...cl,{id:'ck-'+Math.random().toString(36).slice(2,8),text:nt.trim(),done:false}]}); setNt(''); };
  const toggleItem = (id)=>{ if(!canEdit)return; set({checklist:cl.map(i=>i.id===id?{...i,done:!i.done}:i)}); };
  const delItem = (id)=>{ if(!canEdit)return; set({checklist:cl.filter(i=>i.id!==id)}); };
  return html`<div class="cdrawer-ov" onClick=${onClose}><div class="cdrawer" onClick=${e=>e.stopPropagation()}>
    <div class="cdrawer-h">
      <div><div class="muted" style=${{fontSize:11,textTransform:'uppercase',letterSpacing:'.05em'}}>${(field||'stage')} board</div>
        <h3 style=${{margin:'3px 0 0',fontSize:18,lineHeight:1.25}}>${cardTitle(card)}</h3></div>
      <button class="mini" onClick=${onClose}>×</button>
    </div>
    <div class="cdrawer-b">
      <div class="cd-sec"><label>Stage</label>
        <select class="inp" disabled=${!canEdit} value=${card[field]||''} onChange=${e=>set({[field]:e.target.value})}>
          ${columns.map(col=>html`<option key=${col} value=${col}>${col}</option>`)}
        </select></div>
      <div class="cd-sec"><label>Labels</label>
        <div class="cd-labels">${BOARD_LABELS.map(L=>{const on=(card.labels||[]).includes(L.id);return html`<button key=${L.id} class="cd-lab ${on?'on':''}" style=${{background:on?L.color:'transparent',borderColor:L.color,color:on?'#0a0a0a':L.color}} onClick=${()=>toggleLabel(L.id)} disabled=${!canEdit}>${L.name}</button>`;})}</div></div>
      <div class="cd-sec"><label>Due date</label>
        <input type="date" class="inp" disabled=${!canEdit} value=${card.due||''} onChange=${e=>set({due:e.target.value})}/></div>
      <div class="cd-sec"><label>Description</label>
        <textarea class="inp" rows=${3} disabled=${!canEdit} value=${card.desc||''} onChange=${e=>set({desc:e.target.value})} placeholder="Add more detail…"></textarea></div>
      <div class="cd-sec"><label>Checklist ${cl.length?html`<span class="muted">· ${done}/${cl.length}</span>`:''}</label>
        ${cl.length?html`<div class="cd-prog"><div class="cd-prog-i" style=${{width:(cl.length?Math.round(done/cl.length*100):0)+'%'}}></div></div>`:''}
        <div class="cd-checks">${cl.map(i=>html`<div class="cd-check" key=${i.id}>
          <input type="checkbox" checked=${i.done} disabled=${!canEdit} onChange=${()=>toggleItem(i.id)}/>
          <span class=${i.done?'done':''}>${i.text}</span>
          ${canEdit?html`<button class="cd-x" onClick=${()=>delItem(i.id)}>×</button>`:''}
        </div>`)}</div>
        ${canEdit?html`<div class="cd-add"><input class="inp" placeholder="Add an item…" value=${nt} onChange=${e=>setNt(e.target.value)} onKeyDown=${e=>{ if(e.key==='Enter') addItem(); }}/><button class="mini pri" onClick=${addItem}>Add</button></div>`:''}</div>
      ${!canEdit?html`<div class="cd-ro" style=${{display:'flex',alignItems:'center',gap:6}}>${React.createElement(Icon.lock)} Read-only — you don't have edit permission for this board.</div>`:''}
    </div>
  </div></div>`;
}

function ArcadeView({ ctx }){
  const [active,setActive]=useState(-1);
  const [score,setScore]=useState(0);
  const [time,setTime]=useState(30);
  const [playing,setPlaying]=useState(false);
  const tRef=useRef(null);
  const start=()=>{ setScore(0); setTime(30); setPlaying(true); setActive(Math.floor(Math.random()*9)); };
  useEffect(()=>{
    if(!playing) return;
    tRef.current=setInterval(()=>setTime(t=>t-1), 1000);
    return ()=>clearInterval(tRef.current);
  },[playing]);
  useEffect(()=>{
    if(playing && time<=0){
      clearInterval(tRef.current); setPlaying(false); setActive(-1);
      const id='arc-'+ctx.user.id;
      const prev=(ctx.db.gameScores||[]).find(g=>g.id===id);
      const best=Math.max(score, (prev&&prev.score)||0);
      ctx.upsertRecord('gameScores',{ id, userId:ctx.user.id, name:ctx.user.name, game:'reaction', score:best, last:score, createdAt:nowISO() });
    }
  },[time,playing]); // eslint-disable-line
  const hit=(i)=>{ if(!playing||i!==active) return; setScore(s=>s+1); let n=Math.floor(Math.random()*9); if(n===i)n=(n+1)%9; setActive(n); };
  const best=(ctx.db.gameScores||[]).find(g=>g.id==='arc-'+ctx.user.id);
  return html`<div class="view">
    <${Head} eyebrow="Break Room" title="Reaction Arcade" desc="Tap the lime square as fast as you can — 30 seconds. Beat your best!">
      ${!playing&&html`<button class="btn btn-pri" onClick=${start}>${React.createElement(Icon.bolt||Icon.spark||Icon.command)} ${score>0?'Play again':'Start'}</button>`}
    <//>
    <div class="arcade-top">
      <div class="arc-stat"><span>Score</span><b class="lime">${score}</b></div>
      <div class="arc-stat"><span>Time</span><b>${time}s</b></div>
      <div class="arc-stat"><span>Your best</span><b>${(best&&best.score)||0}</b></div>
    </div>
    <div class="arcade-grid ${playing?'live':''}">
      ${Array.from({length:9}).map((_,i)=>html`<button key=${i} class="arc-cell ${active===i?'on':''}" onClick=${()=>hit(i)}></button>`)}
    </div>
    ${!playing&&score>0&&html`<div class="arc-over">Final score: <b class="lime">${score}</b> — nice reflexes!</div>`}
  </div>`;
}

function NotificationCenterView({ ctx }){
  const { db, role, user } = ctx;
  const [tab,setTab]=useState('all');
  const byTime=(a,b)=>Date.parse(b.createdAt||0)-Date.parse(a.createdAt||0);
  const isMine=(n)=>(!n.userId||n.userId===user.id)&&(!n.role||n.role===role||aliasRole(n.role)===aliasRole(role));
  // Only ever show/act on notifications addressed to THIS user (or their role / broadcast).
  // Never expose or mark other people's personal notifications — same rule as the topbar bell.
  const base=[...(db.notifications||[])].filter(isMine).sort(byTime);
  const list = tab==='unread' ? base.filter(n=>!n.read) : base;
  const unreadCount=base.filter(n=>!n.read).length;
  const markAll=()=>base.forEach(n=>!n.read&&ctx.updateRecord('notifications',n.id,{read:true}));
  return html`<div class="view">
    <${Head} eyebrow="Operations" title="Notifications" desc="Everything happening across your team — live.">
      ${unreadCount>0&&html`<button class="btn btn-ghost" onClick=${markAll}>Mark all read</button>`}
    <//>
    <div class="seg" style=${{marginBottom:16}}>
      ${[['all','All'],['unread','Unread'+(unreadCount>0?(' ('+unreadCount+')'):'')],['mine','Mine']].map(([k,l])=>html`<button key=${k} class=${tab===k?'on':''} onClick=${()=>setTab(k)}>${l}</button>`)}
    </div>
    ${list.length===0?html`<${EmptyState} title="No notifications" text="You're all caught up." icon="bell"/>`:
    html`<div class="notif-list">${list.map(n=>html`<div class="notif-card ${n.read?'':'unread'}" key=${n.id}
        onClick=${()=>{ if(!n.read) ctx.updateRecord('notifications',n.id,{read:true}); if(n.entityType&&canView(n.entityType,role)) ctx.go(n.entityType); }}>
      <span class="nc-dot ${n.read?'':'on'}"></span>
      <div class="nc-body"><b>${n.title}</b><span>${n.message||''}</span><i>${fmtDateTime(n.createdAt)}${n.role?(' · '+n.role):''}</i></div>
      ${!n.read&&html`<button class="mini" onClick=${e=>{e.stopPropagation();ctx.updateRecord('notifications',n.id,{read:true});}}>Mark read</button>`}
    </div>`)}</div>`}
  </div>`;
}

// generic table view
function DataTable({ rows, cols, db, onEdit, onDelete, canEditFlag, extraActions, empty, loading, searchable }){
  const [q,setQ]=useState(''); const [sort,setSort]=useState({k:null,dir:1});
  rows=rows||[];
  const ar=getAppSettings().language==='ar';
  const sortVal=(r,c)=>{ if(!c) return ''; if(c.money||c.num) return +r[c.k]||0; if(c.date) return r[c.k]||''; if(c.ref) return (nameById(db[c.coll],r[c.k],c.f)||'').toString(); return (r[c.k]==null?'':r[c.k]).toString().toLowerCase(); };
  const rowText=(r)=> cols.map(c=> c.ref?nameById(db[c.coll],r[c.k],c.f):(c.render?'':r[c.k])).join(' ').toLowerCase()+' '+Object.values(r).filter(v=>typeof v==='string').join(' ').toLowerCase();
  const ql=q.trim().toLowerCase();
  let list = ql ? rows.filter(r=>rowText(r).includes(ql)) : rows;
  if(sort.k){ const c=cols.find(x=>x.k===sort.k); list=[...list].sort((a,b)=>{ const va=sortVal(a,c),vb=sortVal(b,c); return (typeof va==='number'&&typeof vb==='number'?(va-vb):String(va).localeCompare(String(vb)))*sort.dir; }); }
  const toggleSort=(c)=>{ if(c.render&&!c.k) return; setSort(s=> s.k===c.k ? (s.dir===1?{k:c.k,dir:-1}:{k:null,dir:1}) : {k:c.k,dir:1}); };
  const showSearch = searchable!==false && rows.length>8;
  const arrow=(k)=> sort.k===k ? (sort.dir===1?' ▲':' ▼') : '';
  // Skeleton while loading
  if(loading){ return html`<${Panel} pad=${false}><div style=${{padding:16}}>
    ${Array.from({length:6}).map((_,i)=>html`<div key=${i} class="flex" style=${{gap:16,padding:'10px 0',alignItems:'center'}}>
      ${cols.slice(0,Math.min(cols.length,5)).map((c,j)=>html`<span key=${j} class="sk sk-row" style=${{flex:j===0?2:1}}></span>`)}
    </div>`)}
  </div><//>`; }
  if(rows.length===0 && empty){ return html`<${Panel}><${EmptyState} ...${empty}/><//>`; }
  // data-label on each cell powers the mobile table-to-cards transform (CSS only).
  return html`<${Panel} pad=${false}>
    ${showSearch&&html`<div class="flex between center" style=${{padding:'10px 14px',borderBottom:'1px solid var(--line)',gap:10,flexWrap:'wrap'}}>
      <div class="search" style=${{width:260,maxWidth:'100%'}}>${React.createElement(Icon.search)}<input placeholder=${ar?'بحث…':'Search…'} value=${q} onInput=${e=>setQ(e.target.value)}/></div>
      <span class="muted mono" style=${{fontSize:11}}>${list.length}${list.length!==rows.length?(' / '+rows.length):''}</span>
    </div>`}
    <div class="tbl-wrap"><table class="tbl tbl-cards"><thead><tr>
      ${cols.map(c=>html`<th key=${c.k} class=${c.num?'right':''} onClick=${()=>toggleSort(c)} style=${{cursor:'pointer',userSelect:'none'}} title=${ar?'رتّب':'Sort'}>${c.label}${arrow(c.k)}</th>`)}
      ${(onEdit||onDelete||extraActions)&&html`<th></th>`}</tr></thead>
    <tbody>${list.map(r=>html`<tr key=${r.id}>
      ${cols.map(c=>html`<td key=${c.k} class=${c.num?'num':''} data-label=${c.label||''}>${
        c.render ? c.render(r,db) :
        c.money ? money(r[c.k]) :
        c.date ? fmtDate(r[c.k]) :
        c.tag ? html`<${Tag}>${r[c.k]||'—'}<//>` :
        c.ref ? nameById(db[c.coll], r[c.k], c.f) :
        isUrl(r[c.k]) ? html`<${Ln} href=${r[c.k]}/>` :
        (r[c.k]==null||r[c.k]===''?'—':r[c.k])
      }</td>`)}
      ${(onEdit||onDelete||extraActions)&&html`<td class="right cell-actions" data-label="Actions" style=${{whiteSpace:'nowrap'}}>
        ${extraActions&&extraActions(r)}
        ${onEdit&&canEditFlag&&html`<button class="mini" onClick=${()=>onEdit(r)}>Edit</button>`}
        ${onDelete&&canEditFlag&&html`<button class="mini" onClick=${()=>onDelete(r)}>Del</button>`}</td>`}
    </tr>`)}
    ${list.length===0&&html`<tr><td colspan=${cols.length+1} class="muted" style=${{padding:'28px',textAlign:'center'}}>${ql?(ar?'مفيش نتايج':'No matches'):(ar?'مفيش سجلات':'No records yet.')}</td></tr>`}
    </tbody></table></div><//>`;
}

];

const getFormSlug = ()=>{ try { const p=new URLSearchParams(location.search); return p.get('form')||''; } catch(e){ return ''; } };

const sbBase = (cfg)=> ((cfg&&cfg.url)||'https://jdylrthffifbhyrrhuqd.supabase.co').replace(/\/$/,'');
const sbKey  = (cfg)=> (cfg&&cfg.key)||'sb_publishable_6Qe2KdPIZ13Ij2wvkS12rA_k2ytZQLz';

function PublicForm({ slug, cfg }){
  const [state,setState] = useState('loading'); // loading | ready | notfound | done | error
  const [camp,setCamp] = useState(null);
  const [vals,setVals] = useState({});
  const [hp,setHp] = useState('');
  const [busy,setBusy] = useState(false);
  useEffect(()=>{
    fetch(sbBase(cfg)+'/rest/v1/records?coll=eq.campaigns&data->>slug=eq.'+encodeURIComponent(slug)+'&select=id,data', {headers:{apikey:sbKey(cfg)}})
      .then(r=>r.ok?r.json():Promise.reject()).then(rows=>{
        const c = rows&&rows[0]&&rows[0].data;
        if(c && (c.status==='Active'||!c.status)){ setCamp(c); setState('ready'); } else setState('notfound');
      }).catch(()=>setState('error'));
  },[slug]);
  const fields = camp ? CAMPAIGN_FIELD_CATALOG.filter(f=>f.always||(camp.fields||[]).includes(f.key)) : [];
  const submit = async (e)=>{
    if(e&&e.preventDefault) e.preventDefault();
    if(hp) { setState('done'); return; }
    if(!vals.name||!vals.name.trim()){ alert('Please enter your name.'); return; }
    setBusy(true);
    const id='lea-'+Math.random().toString(36).slice(2,10);
    const now=new Date().toISOString();
    const lead={ id, name:vals.name.trim(), source:'Campaign: '+(camp.name||slug), campaignId:camp.id, campaignName:camp.name||'', status:'New Lead', brand:camp.brand||'Magnet', createdAt:now, updatedAt:now };
    CAMPAIGN_FIELD_CATALOG.forEach(f=>{ const v=vals[f.key]; if(v!=null&&String(v).trim()!=='') lead[f.lead]=v; });
    const notif={ id:'nt-'+Math.random().toString(36).slice(2,10), userId:null, role:'Sales', title:'New campaign lead', message:(lead.name||'Someone')+(camp.name?(' · '+camp.name):''), entityType:'leads', entityId:id, read:false, createdAt:now };
    try {
      const res=await fetch(sbBase(cfg)+'/rest/v1/records?on_conflict=id', {method:'POST', headers:{apikey:sbKey(cfg),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify([{id,coll:'leads',data:lead},{id:notif.id,coll:'notifications',data:notif}])});
      if(!res.ok) throw new Error('write failed');
      setState('done');
    } catch(err){ setBusy(false); alert('Something went wrong. Please try again.'); }
  };
  const accent = (camp&&camp.accent) || '#C4FF3D';
  return html`<div class="pf-wrap"><div class="pf-card">
    <div class="pf-logo-frame"><img src="magnet-logo.png" alt="Magnet" onError=${e=>{e.target.parentNode.style.display='none';}}/></div>
    ${state==='loading'?html`<div class="pf-msg">Loading…</div>`:''}
    ${state==='notfound'?html`<div class="pf-msg"><h2>Form not available</h2><p>This form doesn't exist or is paused.</p></div>`:''}
    ${state==='error'?html`<div class="pf-msg"><h2>Connection error</h2><p>Please refresh and try again.</p></div>`:''}
    ${state==='done'?html`<div class="pf-msg pf-done"><div class="pf-check" style=${{background:accent}}>✓</div><h2>Thank you!</h2><p>We've received your details and will be in touch soon.</p></div>`:''}
    ${state==='ready'?html`<form onSubmit=${submit}>
      <div class="pf-head"><div class="pf-eyebrow">LET'S CONNECT</div><h1>${camp.headline||camp.name||'Tell us about your project'}</h1><p>${camp.subtext||'The more details you share, the better we can help.'}</p></div>
      <div class="pf-fields">
        ${fields.map(f=>html`<label class="pf-fld" key=${f.key}>
          <span>${f.label}${f.always?' *':''}</span>
          ${f.type==='textarea'
            ? html`<textarea rows=${3} value=${vals[f.key]||''} onInput=${e=>setVals(v=>({...v,[f.key]:e.target.value}))}></textarea>`
            : html`<input type=${f.type} value=${vals[f.key]||''} onInput=${e=>setVals(v=>({...v,[f.key]:e.target.value}))}/>`}
        </label>`)}
        <input class="pf-hp" tabindex="-1" autocomplete="off" value=${hp} onInput=${e=>setHp(e.target.value)} aria-hidden="true"/>
      </div>
      <button class="pf-submit" type="submit" disabled=${busy} style=${{background:accent}}>${busy?'Sending…':((camp.buttonText||'Submit inquiry')+' →')}</button>
      <div class="pf-trust" style=${{display:'inline-flex',alignItems:'center',gap:6}}>${React.createElement(Icon.lock)} We respect your privacy — no spam, ever. Our team replies within 24 hours.</div>
      <div class="pf-foot">Powered by <b>Magnet</b> · MADE TO MATTER</div>
    </form>`:''}
  </div></div>`;
}

function PublicVerify({ token, cfg }){
  const [state,setState] = useState('working'); // working | ok | notfound | error
  const [name,setName] = useState('');
  useEffect(()=>{ (async()=>{
    // PRIMARY: server-side verify (works when _accounts is locked to anon).
    try {
      const r=await acctApi(cfg,'verify',{ verifyToken:token });
      if(r && r.ok){ setName((r.user&&r.user.fullName)||''); setState('ok'); return; }
      if(r && r.ok===false){ setState('notfound'); return; }
    } catch(e){ /* function unreachable -> legacy anon fallback */ }
    try {
      const res=await fetch(sbBase(cfg)+'/rest/v1/records?coll=eq._accounts&data->>verifyToken=eq.'+encodeURIComponent(token)+'&select=id,data',{headers:{apikey:sbKey(cfg)}});
      if(!res.ok) throw new Error('lookup'); const rows=await res.json(); const row=rows&&rows[0];
      if(!row){ setState('notfound'); return; }
      const u=Object.assign({},row.data,{verified:true,verifyToken:null,verifiedAt:new Date().toISOString()});
      setName(u.fullName||'');
      const up=await fetch(sbBase(cfg)+'/rest/v1/records?on_conflict=id',{method:'POST',headers:{apikey:sbKey(cfg),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id:row.id,coll:'_accounts',data:u}])});
      if(!up.ok) throw new Error('write'); setState('ok');
    } catch(e){ setState('error'); }
  })(); },[token]);
  return html`<div class="pf-wrap"><div class="pf-card">
    <img class="pf-logo" src="magnet-logo.png" alt="Magnet" onError=${e=>{e.target.style.display='none';}}/>
    ${state==='working'?html`<div class="pf-msg">Verifying your email…</div>`:''}
    ${state==='ok'?html`<div class="pf-msg pf-done"><div class="pf-check" style=${{background:'#C4FF3D'}}>✓</div><h2>Email verified</h2><p>Thanks ${name||''}! Your account is now active — you can sign in.</p><a class="pf-submit" style=${{background:'#C4FF3D',display:'inline-block',textAlign:'center',textDecoration:'none',marginTop:8,maxWidth:200}} href=${location.pathname}>Go to login</a></div>`:''}
    ${state==='notfound'?html`<div class="pf-msg"><h2>Link not valid</h2><p>This verification link is invalid or was already used.</p></div>`:''}
    ${state==='error'?html`<div class="pf-msg"><h2>Something went wrong</h2><p>Please try the link again later.</p></div>`:''}
  </div></div>`;
}

function BriefField({ f, val, onChange, readOnly }){
  const set=v=>onChange(f.k,v);
  if(readOnly){
    const disp = Array.isArray(val)?val.join('، '):(f.type==='checkbox'?(val?'✓ موافق':'—'):(val||'—'));
    return html`<div class="brf-ro"><span class="brf-ro-l">${f.ar}</span><span class="brf-ro-v">${disp||'—'}</span></div>`;
  }
  if(f.type==='multi'){ const arr=Array.isArray(val)?val:[]; return html`<div class="brf-fld"><label>${f.ar} ${f.req?html`<b>*</b>`:''}<i>${f.en}</i></label>
    <div class="brf-chips">${f.options.map(o=>{const on=arr.includes(o);return html`<button type="button" key=${o} class="brf-chip ${on?'on':''}" onClick=${()=>set(on?arr.filter(x=>x!==o):[...arr,o])}>${o}</button>`;})}</div></div>`; }
  if(f.type==='select'){ return html`<div class="brf-fld"><label>${f.ar} ${f.req?html`<b>*</b>`:''}<i>${f.en}</i></label>
    <select value=${val||''} onChange=${e=>set(e.target.value)}><option value="">— اختار —</option>${f.options.map(o=>html`<option key=${o} value=${o}>${o}</option>`)}</select></div>`; }
  if(f.type==='checkbox'){ return html`<label class="brf-consent"><input type="checkbox" checked=${!!val} onChange=${e=>set(e.target.checked)}/><span>${f.ar} ${f.req?html`<b>*</b>`:''}</span></label>`; }
  if(f.type==='textarea'){ return html`<div class="brf-fld"><label>${f.ar} ${f.req?html`<b>*</b>`:''}<i>${f.en}</i></label><textarea rows=${3} value=${val||''} onInput=${e=>set(e.target.value)}></textarea></div>`; }
  return html`<div class="brf-fld"><label>${f.ar} ${f.req?html`<b>*</b>`:''}<i>${f.en}</i></label><input type=${f.type||'text'} value=${val||''} onInput=${e=>set(e.target.value)}/></div>`;
}

function PublicBrief({ token, cfg }){
  const [state,setState]=useState('loading');
  const [rec,setRec]=useState(null);
  const [vals,setVals]=useState({});
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  useEffect(()=>{ (async()=>{
    try{
      const res=await fetch(sbBase(cfg)+'/rest/v1/records?coll=eq.briefs&data->>token=eq.'+encodeURIComponent(token)+'&select=id,data',{headers:{apikey:sbKey(cfg)}});
      if(!res.ok) throw new Error(); const rows=await res.json(); const row=rows&&rows[0];
      if(!row){ setState('notfound'); return; }
      setRec(row); const b=row.data||{};
      let draft={}; try{ draft=JSON.parse(localStorage.getItem('magnet_brief_'+token)||'{}')||{}; }catch(_){}
      setVals(Object.assign({}, b.answers||{}, draft));
      if(b.status==='submitted'){ setState('submitted'); return; }
      setState('ready');
      if(b.status==='pending'){ const upd=Object.assign({},b,{status:'opened',openedAt:new Date().toISOString()});
        fetch(sbBase(cfg)+'/rest/v1/records?on_conflict=id',{method:'POST',headers:{apikey:sbKey(cfg),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id:row.id,coll:'briefs',data:upd}])}).catch(()=>{}); }
    }catch(e){ setState('error'); }
  })(); },[token]);
  const onChange=(k,v)=>{ setVals(p=>{ const n={...p,[k]:v}; try{ localStorage.setItem('magnet_brief_'+token, JSON.stringify(n)); }catch(_){} return n; }); };
  const reqKeys=briefReqKeys();
  const filled=reqKeys.filter(k=>{ const v=vals[k]; return Array.isArray(v)?v.length>0:(v!==undefined&&v!==''&&v!==false); });
  const pct= reqKeys.length?Math.round(filled.length/reqKeys.length*100):0;
  const valid=filled.length===reqKeys.length;
  const submit=async()=>{
    if(!valid){ setErr('من فضلك املا كل الحقول المطلوبة (*).'); window.scrollTo({top:0,behavior:'smooth'}); return; }
    setBusy(true); setErr('');
    const b=rec.data||{}; const now=new Date().toISOString();
    const upd=Object.assign({},b,{ answers:vals, status:'submitted', submittedAt:now,
      clientName:vals.contactName||b.clientName, company:vals.company||b.company, contactPhone:vals.whatsapp||b.contactPhone, contactEmail:vals.email||b.contactEmail,
      projectType:(Array.isArray(vals.projectType)?vals.projectType.join(', '):vals.projectType)||b.projectType, updatedAt:now });
    const notif={ id:'nt-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), userId:null, role:'Sales', title:'New client brief submitted', message:(upd.company||upd.clientName||'A client')+' completed the brief', entityType:'briefs', entityId:rec.id, read:false, createdAt:now };
    try{ const res=await fetch(sbBase(cfg)+'/rest/v1/records?on_conflict=id',{method:'POST',headers:{apikey:sbKey(cfg),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id:rec.id,coll:'briefs',data:upd},{id:notif.id,coll:'notifications',data:notif}])});
      if(!res.ok) throw new Error(); try{ localStorage.removeItem('magnet_brief_'+token); }catch(_){} setState('done');
    }catch(e){ setBusy(false); setErr('حصل خطأ، حاول تاني.'); }
  };
  const msg=(t,s)=>html`<div class="brf-wrap" dir="rtl"><div class="brf-card brf-msgcard"><img class="pf-logo" src="magnet-logo.png" onError=${e=>{e.target.style.display='none';}}/><div class="pf-msg"><h2>${t}</h2><p>${s}</p></div></div></div>`;

  if(state==='error') return msg('خطأ في الاتصال','اعمل refresh وحاول تاني.');
  if(state==='submitted') return msg('تم استلام البريف قبل كده ✓','شكراً! البريف ده اتبعت بالفعل.');
  if(state==='done') return html`<div class="brf-wrap" dir="rtl"><div class="brf-card brf-msgcard"><img class="pf-logo" src="magnet-logo.png" onError=${e=>{e.target.style.display='none';}}/><div class="pf-msg pf-done"><div class="pf-check" style=${{background:'#c8f31e'}}>✓</div><h2>تمام، استلمنا البريف</h2><p>هنتواصل معاك على واتساب قريب.</p><div class="brf-tag">MADE TO MATTER</div></div></div></div>`;
  return html`<div class="brf-wrap" dir="rtl">
    <div class="brf-prog-bar"><div style=${{width:pct+'%'}}></div></div>

      <div class="brf-hero">

// Short two-tone alert for new notifications / chat messages (WebAudio, no asset).
function playAlertSound(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    const ac=new Ctx(); const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.07, ac.currentTime+0.02);
    o.frequency.setValueAtTime(880, ac.currentTime); o.frequency.setValueAtTime(1245, ac.currentTime+0.09);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.3);
    o.start(); o.stop(ac.currentTime+0.32);
    setTimeout(()=>{ try{ac.close();}catch(e){} }, 500);
  }catch(e){}
}
/* ⌘K command palette — jump to any section or run a quick action. Keyboard-first. */
function CommandPalette({ items, onClose }){
  const [q,setQ]=useState(''); const [i,setI]=useState(0); const inRef=useRef(null);
  useEffect(()=>{ const t=setTimeout(()=>{ try{inRef.current&&inRef.current.focus();}catch(e){} },30); return ()=>clearTimeout(t); },[]);
  const ql=q.trim().toLowerCase();
  const flat=items.filter(it=> !ql || (it.label+' '+(it.group||'')+' '+(it.kw||'')).toLowerCase().includes(ql));
  useEffect(()=>{ setI(0); },[q]);
  const run=(it)=>{ if(it){ onClose(); setTimeout(()=>it.action(),0); } };
  const onKey=(e)=>{ if(e.key==='ArrowDown'){e.preventDefault();setI(x=>Math.min(x+1,flat.length-1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setI(x=>Math.max(x-1,0));}
    else if(e.key==='Enter'){e.preventDefault();run(flat[i]);}
    else if(e.key==='Escape'){e.preventDefault();onClose();} };
  // group in display order
  const groups=[]; const seen={};
  flat.forEach((it,idx)=>{ const g=it.group||''; if(!seen[g]){seen[g]=[];groups.push(g);} seen[g].push({it,idx}); });
  return html`<div class="cmdk-ov" onMouseDown=${onClose}><div class="cmdk" onMouseDown=${e=>e.stopPropagation()}>
    <input ref=${inRef} class="cmdk-in" placeholder="Search or jump to…  (Type a page or action)" value=${q} onInput=${e=>setQ(e.target.value)} onKeyDown=${onKey}/>
    <div class="cmdk-list">
      ${flat.length===0?html`<div class="cmdk-empty">No results for "${q}"</div>`:
        groups.map(g=>html`<div key=${g}>${g?html`<div class="cmdk-grp">${g}</div>`:''}
          ${seen[g].map(({it,idx})=>html`<div key=${it.label} class="cmdk-it ${idx===i?'on':''}" onMouseEnter=${()=>setI(idx)} onClick=${()=>run(it)}>
            ${it.icon?React.createElement(Icon[it.icon]||Icon.command):''}<span>${it.label}</span>${it.hint?html`<span class="kbd">${it.hint}</span>`:''}</div>`)}
        </div>`)}
    </div>
    <div class="cmdk-hint"><span><b>↑↓</b>navigate</span><span><b>↵</b>open</span><span><b>esc</b>close</span></div>
  </div></div>`;
}

  useEffect(()=>{
    if(!cfgComplete(cfg.current)) return;

    const applyRow=(coll, rec)=>{ if(!coll||!rec||!rec.id) return; setDb(prev=>{ const arr=prev[coll]||[]; const i=arr.findIndex(x=>x.id===rec.id);
