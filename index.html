  },[unread, othersChat]);

  // permission gate: returns true if allowed, else shows a professional message.
  const requirePerm = (module, action)=>{ if(can(role,module,action)) return true; showProPopup('permissionDenied'); return false; };
  const ctx = { db, role, user, brand, cloudOn, cfg:cfg.current, lang, currency, appSettings, applyAppSettings, can, requirePerm,
    canDelete:(section)=> isAdminRole(role) || (!PROTECTED_DELETE.includes(section) && userCanEditSection(authUser, section, role)),
    delRec:(coll,id,name)=>{ if(confirm((lang==='ar'?'حذف ':'Delete ')+(name||(lang==='ar'?'هذا السجل':'this record'))+(lang==='ar'?'؟ لا يمكن التراجع.':'? This cannot be undone.'))) deleteRecord(coll,id); },
    createRecord, updateRecord, deleteRecord, getRecords, addComment, addActivity, addNotification, awardPoints, upsertRecord,
    convertLead, convertCandidate, createDefaultTasksForProject, sendToClientReview, approveDeliverable, requestRevision, addDeliverableVersion,
    submitRequest, approveRequest, rejectRequest, requestChanges, sendChat, setAvailability, driveAction, docPrint, docCopy, docEmail,
    runAgent, agentToTask, agentToProposal, agentToNotes, runAutomation, toggleAutomation, startWorkflow, advanceWorkflow, syncTeam,
    invTotal, invPaid, openModal:(coll,initial,schema,title)=>setModal({coll,initial,schema:schema||FORM_SCHEMAS[coll],title:title||((initial&&initial.id?'Edit ':'New ')+coll)}),
    go };

  const byBrand = (arr)=> brand==='All'?arr:(arr||[]).filter(x=>!x.brand||x.brand===brand);
  const visible = (coll)=> filterRecordsByRole(coll, byBrand(db[coll]||[]), role, user);

  // Public campaign form (?form=SLUG): a no-login, branded lead-capture page.
  const _formSlug = getFormSlug();
  if(_formSlug) return html`<${PublicForm} slug=${_formSlug} cfg=${cfg.current}/>`;
  const _verifyTok = getVerifyTok();
  if(_verifyTok) return html`<${PublicVerify} token=${_verifyTok} cfg=${cfg.current}/>`;
  const _briefTok = getBriefTok();
  if(_briefTok) return html`<${PublicBrief} token=${_briefTok} cfg=${cfg.current}/>`;
  if(!authReady) return html`<div style=${{position:'fixed',inset:0,background:'var(--bg)'}}></div>`;
  if(showLogin || !authUser) return html`<${LoginScreen} onLogin=${doLogin} lang=${lang} applyAppSettings=${applyAppSettings}/>`;

  const goM = (r)=>{ go(r); setNavOpen(false); setMoreOpen(false); };
  // Quick-create actions (respect permissions) — shared by ⌘K and the + menu.
  const quickCreate = (()=>{ const a=[];
    if(canEdit('clients',role)) a.push({label:(lang==='ar'?'عميل جديد':'New client'),icon:'plus',action:()=>{go('accounts');ctx.openModal('clients',{status:'Lead'});}});
    if(canCreateTasks(role)) a.push({label:(lang==='ar'?'تاسك جديد':'New task'),icon:'plus',action:()=>ctx.openModal('tasks',{status:'Backlog',priority:'Normal'})});
    if(canEdit('projects',role)) a.push({label:(lang==='ar'?'مشروع جديد':'New project'),icon:'plus',action:()=>ctx.openModal('projects',{status:'Not Started'})});
    if(canEdit('leads',role)) a.push({label:(lang==='ar'?'ليد جديد':'New lead'),icon:'plus',action:()=>ctx.openModal('leads',{})});
    if(canEdit('invoices',role)) a.push({label:(lang==='ar'?'فاتورة جديدة':'New invoice'),icon:'plus',action:()=>ctx.openModal('invoices',{status:'Invoice Draft',issueDate:todayISO(),tax:5})});
    if(canEdit('contentCalendar',role)) a.push({label:(lang==='ar'?'كونتنت جديد':'New content'),icon:'calendar',action:()=>ctx.openModal('contentCalendar',{status:'Idea'})});
    return a; })();
  const cmdkItems = (()=>{ const nav=[];
    NAVGROUPS.forEach(g=>g.items.forEach(it=>{ if(!HIDDEN_NAV.includes(it[0])&&canView(it[0],role)&&moduleEnabled(it[0],appSettings)&&userSeesModule(authUser,it[0],role))
      nav.push({group:(lang==='ar'?'انتقل إلى':'Go to'),label:(t(it[0])!==it[0]?t(it[0]):it[1]),icon:it[2],kw:it[0]+' '+it[1],action:()=>go(it[0])}); }));
    const acts=quickCreate.map(a=>({group:(lang==='ar'?'إنشاء':'Create'),label:a.label,icon:a.icon,kw:'new create '+a.label,action:a.action}));
    return [...acts, ...nav]; })();
  return html`<div class="app ${navOpen?'nav-open':''}">
    ${cmdkOpen&&html`<${CommandPalette} items=${cmdkItems} onClose=${()=>setCmdkOpen(false)}/>`}
    ${navOpen&&html`<div class="nav-scrim" onClick=${()=>setNavOpen(false)}></div>`}
    <aside class="sidebar">
      <div class="brand">
        <img src="/magnet-logo.png" alt="Magnet" style=${{height:38,width:'auto'}}/>
        <button class="icon-btn nav-close" onClick=${()=>setNavOpen(false)} title="Close menu"><span style=${{fontSize:18}}>×</span></button>
      </div>
      <nav class="nav">
        ${(()=>{
          const allowed = it=>!HIDDEN_NAV.includes(it[0])&&canView(it[0],role)&&moduleEnabled(it[0],appSettings)&&userSeesModule(authUser,it[0],role);
          const navItem = it=>html`<button key=${it[0]} class="nav-item ${route===it[0]?'active':''}" onClick=${()=>goM(it[0])} title=${it[3]==='new'?'New feature':''}>
              ${React.createElement(Icon[it[2]]||Icon.command)}<span>${t(it[0])!==it[0]?t(it[0]):it[1]}</span>
              ${it[3]==='new'&&html`<span class="new-badge">${lang==='ar'?'جديد':'New'}</span>`}
              ${it[0]==='notifications'&&unread>0&&html`<span class="badge">${unread}</span>`}</button>`;
          // all items this user may see, kept in NAVGROUPS order
          const all=[]; NAVGROUPS.forEach(g=>g.items.forEach(it=>{ if(allowed(it)) all.push(it); }));
          const primaryKeys = ROLE_PRIMARY[aliasRole(role)] || ROLE_PRIMARY._default;
          const primary = primaryKeys.map(k=>all.find(it=>it[0]===k)).filter(Boolean);
          const pset = new Set(primary.map(it=>it[0]));
          const moreGroups = NAVGROUPS.map(g=>({group:g.group, items:g.items.filter(it=>allowed(it)&&!pset.has(it[0]))})).filter(g=>g.items.length);
          const activeInMore = moreGroups.some(g=>g.items.some(it=>it[0]===route));
          if(!primary.length){ // fallback: no curated set -> show everything grouped (old behaviour)
            return moreGroups.map(g=>html`<div class="nav-group" key=${g.group}><div class="nav-label">${t(g.group)}</div>${g.items.map(navItem)}</div>`);
          }
          return html`
            <div class="nav-group">
              <div class="nav-label">${lang==='ar'?'الأساسية':'Main'}</div>
              ${primary.map(navItem)}
            </div>
            ${moreGroups.length?html`<details class="nav-more" open=${activeInMore}>
              <summary>${lang==='ar'?'المزيد':'More'}</summary>
              ${moreGroups.map(g=>html`<div class="nav-group" key=${g.group}><div class="nav-label">${t(g.group)}</div>${g.items.map(navItem)}</div>`)}
            </details>`:''}`;
        })()}
      </nav>
      <div class="side-foot">
        <div class="user" onClick=${()=>setProfileOpen(true)} style=${{cursor:'pointer'}}><${Avatar} name=${user.name} src=${user.account&&user.account.avatar}/>
          <div class="ut"><b>${user.name}</b><span>${t(role)!==role?t(role):role}</span></div>
          <button class="icon-btn" title=${t('Logout')} onClick=${e=>{e.stopPropagation();doLogout();}}>${React.createElement(Icon.logout)}</button></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn hamburger" onClick=${()=>setNavOpen(true)} title="Menu">${React.createElement(Icon.menu||Icon.command)}</button>
        <div class="crumbs"><img class="topbar-logo" src="/magnet-logo.png" alt="Magnet"/><b>Magnet OS</b><span class="sep">/</span><span>${t(route)!==route?t(route):route}</span></div>
        <div class="seg" style=${{marginLeft:16}}>
          ${['All',...BRANDS].map(b=>html`<button key=${b} class=${brand===b?'on':''} onClick=${()=>setBrand(b)}>${b==='Spark Marketing'?'Spark':b}</button>`)}
        </div>
        <div class="top-actions">
          <button class="icon-btn" title=${(lang==='ar'?'بحث':'Search')+' (⌘K)'} onClick=${()=>setCmdkOpen(true)}>${React.createElement(Icon.search||Icon.command)}</button>
          ${quickCreate.length?html`<div class="qc-wrap">
            <button class="icon-btn" title=${lang==='ar'?'إنشاء':'Create'} onClick=${()=>setQcOpen(o=>!o)}>${React.createElement(Icon.plus)}</button>
            ${qcOpen&&html`<${React.Fragment}>
              <div style=${{position:'fixed',inset:0,zIndex:55}} onClick=${()=>setQcOpen(false)}></div>
              <div class="qc-menu">${quickCreate.map(a=>html`<button key=${a.label} onClick=${()=>{setQcOpen(false);a.action();}}>${React.createElement(Icon[a.icon]||Icon.plus)}<span>${a.label}</span></button>`)}</div>
            <//>`}
          </div>`:''}
          <div class="qc-wrap">
            <button class="icon-btn" title=${lang==='ar'?'راديو ماجنت':'Magnet Radio'} onClick=${()=>setRadioOpen(o=>!o)} style=${{color:musicOn?'var(--lime)':'var(--ink-4)'}}>${React.createElement(musicOn?Icon.volume:Icon.volumeOff)}</button>
            ${radioOpen&&html`<${React.Fragment}>
              <div style=${{position:'fixed',inset:0,zIndex:55}} onClick=${()=>setRadioOpen(false)}></div>
              <div class="radio-pop" onClick=${e=>e.stopPropagation()}>
                <div class="radio-h"><b>${lang==='ar'?'راديو ماجنت':'Magnet Radio'}</b><button class="icon-btn" style=${{width:26,height:26}} onClick=${()=>setRadioOpen(false)}><span style=${{fontSize:15}}>×</span></button></div>
                <div class="radio-np">${np.title || (RADIO_STATIONS.find(s=>s.key===station)||{}).name+' Radio'}</div>
                <div class="radio-sub">${np.author || (lang==='ar'?'ماجنت راديو · يوتيوب':'Magnet Radio · YouTube')}</div>
                <div class="radio-ctrls">
                  <button title=${lang==='ar'?'السابق':'Previous'} onClick=${()=>radioCtl('previousVideo')}>${React.createElement(Icon.skipBack)}</button>
                  <button class="radio-play" title=${musicOn?(lang==='ar'?'إيقاف':'Pause'):(lang==='ar'?'تشغيل':'Play')} onClick=${toggleMusic}>${React.createElement(musicOn?Icon.pauseFill:Icon.playFill)}</button>
                  <button title=${lang==='ar'?'التالي':'Next'} onClick=${()=>radioCtl('nextVideo')}>${React.createElement(Icon.skipForward)}</button>
                </div>
                <div class="flex center" style=${{gap:8}}>${React.createElement(Icon.volumeOff,{style:{width:14,height:14,color:'var(--ink-4)',flex:'0 0 auto'}})}
                  <input class="radio-vol" type="range" min="0" max="100" value=${vol} onInput=${e=>setRadioVol(+e.target.value)}/>
                  ${React.createElement(Icon.volume,{style:{width:14,height:14,color:'var(--ink-4)',flex:'0 0 auto'}})}</div>
                <div class="radio-toggles">
                  <button class="radio-tg ${shuffleOn?'on':''}" onClick=${toggleShuffle}>${React.createElement(Icon.shuffle)} ${lang==='ar'?'عشوائي':'Shuffle'}</button>
                  <button class="radio-tg ${repeatOn?'on':''}" onClick=${toggleRepeat}>${React.createElement(Icon.repeat)} ${lang==='ar'?'تكرار':'Repeat'}</button>
                </div>
                <div class="radio-stations">${RADIO_STATIONS.map(s=>html`<button key=${s.key} class="radio-st ${station===s.key?'on':''}" onClick=${()=>loadStation(s.key)}>${s.name}</button>`)}</div>
              </div>
            <//>`}
          </div>
          <button class="icon-btn" title="Alert sound" onClick=${()=>applyAppSettings({soundAlerts:appSettings.soundAlerts===false})} style=${{color:appSettings.soundAlerts!==false?'var(--lime)':'var(--ink-4)'}}>${React.createElement(appSettings.soundAlerts!==false?Icon.bell:Icon.volumeOff)}</button>
          <span class="tag ${cloudOn?'ok':''}"><span class="d"></span>${cloudOn?'Cloud':'Local'}</span>
          <div style=${{position:'relative'}}>
            <button class="icon-btn" onClick=${()=>setNotifOpen(o=>!o)}>${React.createElement(Icon.bell)}${unread>0&&html`<span class="dot"></span>`}</button>
            ${notifOpen&&html`<div class="notif-pop">
              <div class="notif-h">Notifications</div>
              ${notifs.slice(0,8).map(n=>html`<div class="notif-row ${n.read?'':'unread'}" key=${n.id}
                  onClick=${()=>{ updateRecord('notifications',n.id,{read:true}); if(n.entityType&&canView(n.entityType,role)) go(n.entityType); setNotifOpen(false); }}>
                <b>${n.title}</b><span>${n.message}</span><i>${fmtDateTime(n.createdAt)}</i></div>`)}
              ${notifs.length===0&&html`<div class="notif-row muted">No notifications</div>`}
              <div class="notif-foot">
                <button class="mini" onClick=${()=>{ go('notifications'); setNotifOpen(false); }}>View all</button>
                ${unread>0&&html`<button class="mini" onClick=${()=>{ notifs.forEach(n=>!n.read&&updateRecord('notifications',n.id,{read:true})); }}>Mark all read</button>`}
              </div>
            </div>`}
          </div>
          <div style=${{width:1,height:24,background:'var(--line)'}}></div>
          <button class="lang-toggle" onClick=${()=>applyAppSettings({language: lang==='ar'?'en':'ar'})} title="Language">${lang==='ar'?'EN':'ع'}</button>
          <button class="icon-btn" onClick=${()=>applyAppSettings({theme:(appSettings.theme==='light'?'dark':'light')})} title=${appSettings.theme==='light'?(lang==='ar'?'الوضع الداكن':'Dark mode'):(lang==='ar'?'الوضع الفاتح':'Light mode')}>${React.createElement(appSettings.theme==='light'?Icon.moon:Icon.sun)}</button>
          ${isOwner&&html`<select class="sel" value=${role} onChange=${e=>setRoleOverride(e.target.value===baseRole?null:e.target.value)} title="Switch role for testing (Owner only)">
            ${roleOptions(role).map(r=>html`<option key=${r} value=${r}>${t(r)!==r?t(r):r}</option>`)}
          </select>`}
          <button class="user-chip" onClick=${()=>setProfileOpen(true)} title=${t('Current User')}>
            <${Avatar} name=${user.name} size=${28} src=${user.account&&user.account.avatar}/><span class="uc-role">${t(role)!==role?t(role):role}</span></button>
        </div>
      </header>
      <div class="canvas" ref=${canvasRef}>
        ${renderRoute(route, ctx, { visible, byBrand,
          connectCloud, disconnectCloud, syncNow, saveWebhooks, signInCloud, setLocalRole,
          exportJSON, importJSON, clearLocal, seedDemo, restoreSnapshot, setBackupPrefs, pullFromCloud })}
      </div>
      ${(()=>{ // mobile bottom navigation (5 slots; last opens the More sheet)
        const primary=[['dashboard','Dashboard','command'],['accounts','Accounts','people'],['tasks','Tasks','check'],['approvalCenter','Approvals','shield']].filter(it=>canView(it[0],role));
        return html`<nav class="bottom-nav">
          ${primary.map(it=>html`<button key=${it[0]} class="bn-item ${route===it[0]?'on':''}" onClick=${()=>goM(it[0])}>
            ${React.createElement(Icon[it[2]]||Icon.command)}<span>${it[1]}</span></button>`)}
          <button class="bn-item ${moreOpen?'on':''}" onClick=${()=>setMoreOpen(o=>!o)}>${React.createElement(Icon.grid)}<span>More</span></button>
        </nav>`; })()}
    </main>
    ${moreOpen&&html`<div class="more-scrim" onClick=${()=>setMoreOpen(false)}>
      <div class="more-sheet" onClick=${e=>e.stopPropagation()}>
        <div class="more-grip"></div>
        <div class="more-grid">
          ${NAVGROUPS.flatMap(g=>g.items).filter(it=>canView(it[0],role)&&moduleEnabled(it[0],appSettings)&&userSeesModule(authUser,it[0],role)).map(it=>html`<button key=${it[0]} class="more-item ${route===it[0]?'on':''}" onClick=${()=>goM(it[0])}>
            ${React.createElement(Icon[it[2]]||Icon.command)}<span>${it[1]}</span></button>`)}
        </div>
      </div></div>`}

    ${modal&&html`<${Modal} title=${'New / Edit '+modal.coll} wide=${true} onClose=${()=>setModal(null)}>
      <${RecordForm} schema=${modal.schema||[]} initial=${modal.initial} db=${db} role=${role}
        onSave=${rec=>{ if(rec.id){ if(modal.coll==='employees'){ const prev=byId(db.employees,rec.id)||{}; if(prev.salary!==rec.salary) addActivity('employees',rec.id,'salary updated',''); if(prev.appRole!==rec.appRole) addActivity('employees',rec.id,'role changed',(prev.appRole||'')+'→'+(rec.appRole||'')); } if(modal.coll==='clients'&&rec.status==='At Risk'){ addActivity('clients',rec.id,'marked at risk',''); } if(modal.coll==='tasks'&&rec.status==='Done'){ const prev=byId(db.tasks,rec.id)||{}; if(prev.status!=='Done') showProPopup('taskCompleted',rec.title||rec.name); } if((modal.coll==='projects')&&rec.status==='Completed'){ const prev=byId(db.projects,rec.id)||{}; if(prev.status!=='Completed') showProPopup('projectCompleted',rec.projectName||rec.name); } const _prevTeam = modal.coll==='teams'?byId(db.teams,rec.id):null; updateRecord(modal.coll,rec.id,rec); if(modal.coll==='teams'){ addActivity('teams',rec.id,'team updated',rec.name); syncTeam(rec,_prevTeam); } } else if(modal.coll==='approvalRequests'){ submitRequest(rec); } else { const created=createRecord(modal.coll,rec); if(modal.coll==='leads') triggerWebhook('newLeadWebhook',{lead:created}); if(modal.coll==='clients'){ triggerWebhook('newClientWebhook',{client:created}); } if(modal.coll==='projects'){ if(rec.createDefaultTasks!==false&&rec.projectType){ const ts=createDefaultTasksForProject(rec.projectType,created.id,rec.clientId); addActivity('projects',created.id,'default tasks generated',ts.length+' tasks'); } triggerWebhook('newProjectWebhook',{project:created}); } if(modal.coll==='tasks'){ addNotification('Project Manager','New task created',(created.title||created.name||'')+(created.assignedTo?(' · '+nameById(db.employees,created.assignedTo)):''),'tasks',created.id); if(created.assignedTo){ addActivity('tasks',created.id,'assigned',nameById(db.employees,created.assignedTo)); addNotification(created.assignedTo,'New task assigned',created.title||created.name,'tasks',created.id); triggerWebhook('taskAssignedWebhook',{task:created}); } } if(modal.coll==='payments'){ showProPopup('paymentReceived',money(created.amount)); } if(modal.coll==='employeePayments'){ updateRecord('employeePayments',created.id,{netAmount:empPaymentNet(created)}); } if(modal.coll==='leaves'){ addNotification('Project Manager','Leave requested',nameById(db.employees,created.employeeId)+' · '+created.leaveType,'leaves',created.id); } if(modal.coll==='teams'){ addActivity('teams',created.id,'team created',created.name); syncTeam(created,null); } if(modal.coll==='contentCalendar'){ addActivity('contentCalendar',created.id,'content scheduled',created.title); if(created.assignedTo) addNotification(created.assignedTo,'Scheduled content assigned',(created.title||'')+' · '+fmtDate(created.scheduledDate),'calendar',created.id); if(created.scheduledDate===todayISO()) addNotification('Project Manager','Content due today',created.title,'calendar',created.id); } } setModal(null); }}
        onClose=${()=>setModal(null)}/>
    <//>`}
    ${profileOpen&&html`<${ProfileModal} authUser=${authUser} lang=${lang} onClose=${()=>setProfileOpen(false)}
      onChanged=${(u)=>{ setAuthUser(u); }}/>`}
  </div>`;
}

/* ---------- comments thread (reusable) ---------- */
function CommentThread({ ctx, entityType, entityId }){
  const [text,setText] = useState('');
  const list = (ctx.db.comments||[]).filter(c=>c.entityType===entityType&&c.entityId===entityId);
  return html`<div>
    ${list.map(c=>html`<div class="lrow" key=${c.id}><${Avatar} name=${c.authorName} size=${28}/>
      <div class="li-t"><b style=${{fontWeight:600}}>${c.authorName}</b><span>${c.text}</span></div>
      <span class="li-meta">${fmtDateTime(c.createdAt)}</span></div>`)}
    ${list.length===0&&html`<div class="muted" style=${{fontSize:12,padding:'8px 0'}}>No comments.</div>`}
    <div class="flex gap8" style=${{marginTop:12}}>
      <input class="sel" style=${{flex:1}} placeholder="Write a comment…" value=${text} onChange=${e=>setText(e.target.value)}/>
      <button class="btn btn-pri" onClick=${()=>{ ctx.addComment(entityType,entityId,text); setText(''); }}>Post</button></div>
  </div>`;
}

/* ============================ ROUTE RENDERER ============================ */
function renderRoute(route, ctx, x){
  const { db, role, user } = ctx;
  const ce = (coll)=>userCanEditSection(user && user.account, coll, role);
  // Access gate: the nav hides buttons, but routes can also be set
  // programmatically (notifications, conversions, stale state). Never RENDER a
  // canonical module the user can't see. Alias/system routes not in SECTIONS are
  // left to their own case handling so nothing legitimate is blocked.

/* Employee self-service: request Leave / Permission (إذن) / Lateness (تأخير).
   Reuses the approvalRequests pipeline (submitRequest → notify manager →
   approve/reject → notify employee). Pre-fills the current employee + manager. */
function QuickTimeOff({ ctx }){
  const ar = getAppSettings().language==='ar';
  const u = ctx.user||{};
  const emp = (ctx.db.employees||[]).find(e=> e.id===u.employeeId || e.id===u.id
    || (u.email&&((e.loginEmail||'').toLowerCase()===u.email.toLowerCase()||(e.email||'').toLowerCase()===u.email.toLowerCase())));
  const eid = (emp&&emp.id) || u.employeeId || u.id;
  // Default approver = the employee's manager; else the first HR/Manager/Director.
  // The employee can still change "Assign to manager" in the form before sending.
  const APPROVER_ROLES = ['Admin','Owner','Manager','Project Manager','HR','Marketing Director','Art Director'];
  const approver = (ctx.db.employees||[]).find(e=>APPROVER_ROLES.includes(aliasRole(e.appRole||e.role)));
  const mgr = (emp&&emp.managerId) || (approver&&approver.id) || '';
  const open = (type,title)=> ctx.openModal('approvalRequests',
    { requestType:type, title:title, priority:'Normal', employeeId:eid, assignedManagerId:mgr, date:todayISO() }, null, title);
  return html`<${Panel} title=${ar?'طلب إجازة / إذن / تأخير':'Request time off'}>
    <div class="flex gap8" style=${{flexWrap:'wrap'}}>
      <button class="btn btn-pri" onClick=${()=>open('Leave Request', ar?'طلب إجازة':'Leave request')}>${React.createElement(Icon.plus)} ${ar?'إجازة':'Leave'}</button>
      <button class="btn btn-ghost" onClick=${()=>open('Permission Request', ar?'طلب إذن':'Permission request')}>${ar?'إذن':'Permission'}</button>
      <button class="btn btn-ghost" onClick=${()=>open('Lateness Report', ar?'إبلاغ تأخير':'Lateness report')}>${ar?'تأخير':'Lateness'}</button>
    </div>
    <div class="muted" style=${{fontSize:12,marginTop:8}}>${ar?'هيتبعت لمديرك للموافقة، وهيوصلك إشعار بالنتيجة.':'Sent to your manager for approval; you’ll be notified of the result.'}</div>
  <//>`;
}
/* ============================================================================
   ACCOUNTS — unified account-management command center. ONE tab = the whole
   process, on the SAME records model (single source of truth): clients +
   contracts + collections/payments + deliverables + activityLogs. NO new tables.
   Money is admin-only (canSeeFinance). Adds the genuine gaps: auto payment
   schedule from a contract, WhatsApp reminders (wa.me, Arabic), 7-day follow-up
   flags, onboarding checklist (stored on the client), and a monthly report.
   ============================================================================ */
const ONBOARDING_STEPS = ['Contract signed','Brief collected','Brand assets received','Kickoff meeting','Credentials collected'];
const cNameOf = (c)=> (c&&(c.brandName||c.name||c.company))||'—';
// Contact fallbacks — clients are stored with mainContact* fields (older/seed data
// used whatsapp/phone/contactPerson), so always try both shapes.
const cPhoneOf = (c)=> (c&&(c.mainContactWhatsapp||c.whatsapp||c.mainContactPhone||c.phone))||'';
const cContactOf = (c)=> (c&&(c.mainContactName||c.contactPerson))||'';
const cleanPhone = (p)=>{ let s=String(p||'').replace(/[^0-9]/g,''); if(s.startsWith('00')) s=s.slice(2); if(s.startsWith('0')) s='20'+s.slice(1); return s; };
const waLink = (num,msg)=> 'https://wa.me/'+cleanPhone(num)+'?text='+encodeURIComponent(msg);
const acctPipe = (c)=>{ const s=c.status||'Lead';
  if(['Lead','Prospect','New Lead'].includes(s)) return 'Lead';
  if(s==='Onboarding') return 'Onboarding';
  if(['Paused','On Hold'].includes(s)) return 'Paused';
  if(['Churned','Lost','Archived'].includes(s)) return 'Churned';
  return 'Active'; };
const clientActivities = (db,c)=> (db.activityLogs||[]).filter(a=>a.entityId===c.id||a.clientId===c.id);
const lastActivityAt = (db,c)=>{ const a=clientActivities(db,c).map(x=>x.createdAt||x.date).filter(Boolean).sort(); return a.length?a[a.length-1]:(c.updatedAt||c.createdAt||''); };
const needsFollowup = (db,c)=>{ const la=lastActivityAt(db,c); if(!la) return true; return daysBetween(la, todayISO())>=7; };
const monthsBetween = (a,b)=>{ if(!a||!b) return 0; const x=new Date(a),y=new Date(b); const n=(y.getFullYear()-x.getFullYear())*12+(y.getMonth()-x.getMonth()); return n>0?n:0; };
// Plan (cadence) + this-month actual counts per content type, computed live from
// the content calendar. Returns {plan, actual} keyed by posts/reels/carousels/stories.
// Monthly plan is stored as flat fields on the client (planPosts / planReels /
// planCarousels / planStories) so it can be set in the client form AND edited in
// the Report tab from one source. Legacy c.report.plan is read as a fallback.
const REPORT_PLAN_TYPES = [['planPosts','Post','بوستات','Posts'],['planReels','Reel','ريلز','Reels'],['planCarousels','Carousel','كاروسيلز','Carousels'],['planStories','Story','ستوريز','Stories']];
const LEGACY_PLAN = {planPosts:'posts',planReels:'reels',planCarousels:'carousels',planStories:'stories'};
const planVal = (c,k)=> +(c[k]!=null && c[k]!=='' ? c[k] : ((c.report&&c.report.plan&&c.report.plan[LEGACY_PLAN[k]])||0)) || 0;
function reportPlanActual(c, db){
  const m=thisMonth(); const plan={}; REPORT_PLAN_TYPES.forEach(([k])=>{ plan[k]=planVal(c,k); });
  const items=(db.contentCalendar||[]).filter(x=>x.clientId===c.id && monthOf(x.scheduledDate||x.deadline||x.createdAt)===m);
  const actual={}; REPORT_PLAN_TYPES.forEach(([k,ct])=>{ actual[k]=items.filter(x=>x.contentType===ct).length; });
  return { plan, actual };
}
// "What's still missing" for a client — the gaps a manager (or a new manager on
// handover) must close: missing key info, incomplete onboarding, missing assets/
// access, unmet monthly plan, and overdue collections. Returns an array of strings.
function reportMissing(c, db, ar){
  const out=[]; const {plan,actual}=reportPlanActual(c,db);
  const ob=(Array.isArray(c.onboarding)&&c.onboarding.length)?c.onboarding:ONBOARDING_STEPS.map(s=>({item:s,done:false}));
  const contracts=(db.contracts||[]).filter(k=>k.clientId===c.id);
  const assets=(db.clientAssets||[]).filter(a=>a.clientId===c.id);
  const cols=(db.collections||[]).filter(x=>x.clientId===c.id);
  const sep=ar?'، ':', ';
  if(!c.accountManagerId) out.push(ar?'مفيش أكونت مانجر متسنّد':'No account manager assigned');
  if(!(c.mainContactWhatsapp||c.whatsapp||c.mainContactPhone||c.phone)) out.push(ar?'مفيش رقم تواصل':'No contact phone/WhatsApp');
  if(!((Array.isArray(c.services)&&c.services.length)||c.serviceType)) out.push(ar?'مفيش خدمات محددة':'No services selected');
  if(!contracts.length && !c.monthlyRetainer) out.push(ar?'مفيش عقد ولا ريتينر':'No contract or retainer');
  const obLeft=ob.filter(s=>!s.done); if(obLeft.length) out.push((ar?'التهيئة ناقصة: ':'Onboarding left: ')+obLeft.map(s=>s.item).join(sep));
  const miss=assets.filter(a=>a.accessStatus==='Missing'); if(miss.length) out.push((ar?'أصول/أكسسات ناقصة: ':'Missing assets: ')+miss.map(a=>a.title).join(sep));
  const req=assets.filter(a=>a.accessStatus==='Requested'); if(req.length) out.push((ar?'أكسسات مطلوبة لسه: ':'Access still requested: ')+req.map(a=>a.title).join(sep));
  const planSet=REPORT_PLAN_TYPES.some(([k])=>+((plan||{})[k])>0);
  if(!planSet) out.push(ar?'مفيش خطة شهرية متحطّة':'No monthly plan set');
  else { const behind=REPORT_PLAN_TYPES.filter(([k])=>(actual[k]||0)<(+plan[k]||0)); if(behind.length) out.push((ar?'الخطة لسه ناقصة: ':'Plan not met: ')+behind.map(([k,ct,la,le])=>(ar?la:le)+' '+(actual[k]||0)+'/'+(+plan[k]||0)).join(sep)); }
  const od=cols.filter(x=>(x.status||'Pending')==='Pending'&&x.dueDate&&x.dueDate<todayISO()); if(od.length) out.push((ar?'تحصيلات متأخرة: ':'Overdue collections: ')+od.length);
  return out;
}
// Client-facing "Monthly report" (mode='client') or internal "Handover sheet"
// (mode='handover', adds account snapshot + assets/access + handover notes).
function accountMonthlyReport(c, db, ctx, mode){
  mode=mode||'client'; const handover=mode==='handover';
  const ar=ctx.lang==='ar'; const m=thisMonth(); const nm=cNameOf(c);
  const e=s=>String(s==null?'':s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const rep=c.report||{}; const {plan,actual}=reportPlanActual(c,db);
  const dlv=(db.deliverables||[]).filter(d=>d.clientId===c.id && ['Approved','Delivered'].includes(d.status) && monthOf(d.updatedAt||d.createdAt)===m);
  const nameById=(coll,id)=>{ const r=(db[coll]||[]).find(x=>x.id===id); return r?(r.fullName||r.displayName||r.name||r.title||'—'):'—'; };
  // Plan vs actual table
  const planRows=REPORT_PLAN_TYPES.map(([k,ct,la,le])=>{ const pv=+plan[k]||0, av=actual[k]||0; if(!pv&&!av) return ''; return '<tr><td>'+e(ar?la:le)+'</td><td>'+pv+'</td><td>'+av+'</td></tr>'; }).join('')
    ||'<tr><td colspan="3" style="color:#888">'+(ar?'مفيش خطة أو كونتنت الشهر ده.':'No plan or content this month.')+'</td></tr>';
  const dlvRows=dlv.map(d=>'<tr><td>'+e(d.title||'—')+'</td><td>'+e(d.type||'')+'</td><td>'+e(d.status)+'</td></tr>').join('')||'<tr><td colspan="3" style="color:#888">'+(ar?'مفيش تسليمات مكتملة الشهر ده.':'No deliverables completed this month.')+'</td></tr>';
  const listBlock=(title,arr)=>{ const li=(arr||[]).map(x=>'<li>'+e(typeof x==='string'?x:(x.t||''))+'</li>').join(''); return li?'<h2>'+title+'</h2><ul>'+li+'</ul>':''; };
  let extra='';
  if(handover){
    const miss=reportMissing(c,db,ar);
    if(miss.length) extra+='<h2>'+(ar?'الناقص في العميل':'What is missing')+'</h2><ul>'+miss.map(x=>'<li>'+e(x)+'</li>').join('')+'</ul>';
    const snap=[[ar?'الكونتاكت':'Main contact', c.mainContactName||c.contactPerson||''],
      [ar?'الهاتف / واتساب':'Phone / WhatsApp', c.mainContactWhatsapp||c.whatsapp||c.mainContactPhone||c.phone||''],
      [ar?'أكونت مانجر':'Account manager', c.accountManagerId?nameById('employees',c.accountManagerId):''],
      [ar?'بروجيكت مانجر':'Project manager', c.projectManagerId?nameById('employees',c.projectManagerId):''],

    if((rep.handover||'').trim()) extra+='<h2>'+(ar?'ملاحظات الهاند-أوفر':'Handover notes')+'</h2><p style="font-size:13px;line-height:1.7;white-space:pre-wrap">'+e(rep.handover)+'</p>';

   +'<style>body{background:#070807;color:#f3f5ef;font-family:system-ui,Arial,sans-serif;max-width:760px;margin:0 auto;padding:44px}'
   +'h1{color:#c8f31e;letter-spacing:.14em;font-size:20px;margin:0}h2{margin-top:26px;font-size:14px;color:#c8f31e}'
   +'table{width:100%;border-collapse:collapse;margin:12px 0}th,td{border-bottom:1px solid #23261f;padding:9px;text-align:'+(ar?'right':'left')+';font-size:13px}'
   +'th{color:#9a9a98;font-weight:600;font-size:11px;text-transform:uppercase}ul{padding-'+(ar?'right':'left')+':18px;line-height:1.7;font-size:13px}.muted{color:#9a9a98}'
   +'@media print{body{background:#fff;color:#111}h1,h2{color:#5b7d00}}</style></head><body>'
   +'<div style="display:flex;justify-content:space-between;align-items:center"><h1>MAGNET</h1><span class="muted" style="font-size:11px">'+e(new Date().toDateString())+'</span></div>'
   +'<h2>'+e(nm)+' — '+e(heading)+' · '+e(m)+'</h2>'
   +'<h2>'+(ar?'الخطة مقابل المُنفّذ':'Plan vs delivered')+'</h2><table><thead><tr><th>'+(ar?'النوع':'Type')+'</th><th>'+(ar?'الخطة':'Plan')+'</th><th>'+(ar?'المُنفّذ':'Delivered')+'</th></tr></thead><tbody>'+planRows+'</tbody></table>'
   +'<h2>'+(ar?'التسليمات المكتملة':'Deliverables completed')+'</h2><table><thead><tr><th>Item</th><th>Type</th><th>Status</th></tr></thead><tbody>'+dlvRows+'</tbody></table>'
   +listBlock(ar?'أبرز الإنجازات':'Highlights', rep.highlights)
   +listBlock(ar?'الخطوات القادمة':'Next steps', rep.nextSteps)
   +extra
   +'<p class="muted" style="margin-top:34px;font-size:11px">Magnet OS · '+e(nm)+' · '+e(m)+'</p></body></html>';
  try{ const w=window.open('','_blank'); if(w){ w.document.write(doc); w.document.close(); setTimeout(()=>{try{w.print();}catch(_){}} ,500); } }catch(_){ }
}

function AccountsView({ ctx, visible, byBrand, ce }){
  const { db, role, lang } = ctx; const ar=lang==='ar'; const fin=canSeeFinance(role);
  const [layout,setLayout]=useState('board'); const [sel,setSel]=useState(null);
  const clients=byBrand(db.clients||[]); const m=thisMonth();
  const wk=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const soon2=new Date(Date.now()+2*86400000).toISOString().slice(0,10);
  const activeN=clients.filter(c=>acctPipe(c)==='Active').length;
  const followN=clients.filter(c=>needsFollowup(db,c)&&!['Churned','Lost','Archived'].includes(c.status)).length;
  const dlvAll=db.deliverables||[];
  const dueWeek=dlvAll.filter(d=>d.dueDate&&d.dueDate>=todayISO()&&d.dueDate<=wk&&!['Approved','Delivered'].includes(d.status)).length;
  const dlvOverdue=dlvAll.filter(d=>d.dueDate&&d.dueDate<todayISO()&&!['Approved','Delivered'].includes(d.status)).length;
  const cols=db.collections||[]; const pend=cols.filter(x=>(x.status||'Pending')==='Pending');
  const expectedM=pend.filter(x=>monthOf(x.dueDate)===m).reduce((s,x)=>s+(+x.amount||0),0);
  const collectedM=cols.filter(x=>x.status==='Collected'&&monthOf(x.collectedDate||x.updatedAt)===m).reduce((s,x)=>s+(+x.amount||0),0);
  const overdueP=pend.filter(x=>x.dueDate&&x.dueDate<todayISO());
  const upcoming=pend.filter(x=>x.dueDate&&x.dueDate>=todayISO()).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')).slice(0,5);
  const items=clients.map(c=>Object.assign({},c,{_pipe:acctPipe(c)}));
  return html`<div class="view">

      <div class="seg"><button class=${layout==='board'?'on':''} onClick=${()=>setLayout('board')}>${ar?'بورد':'Board'}</button><button class=${layout==='list'?'on':''} onClick=${()=>setLayout('list')}>${ar?'قائمة':'List'}</button></div>
      ${ce&&html`<button class="btn btn-pri" onClick=${()=>ctx.openModal('clients',{status:'Lead'})}>${React.createElement(Icon.plus)} ${ar?'عميل جديد':'New client'}</button>`}
    <//>
    <div class="grid g-4 stagger" style=${{marginBottom:16}}>
      <${KPI} label=${ar?'عملاء نشطين':'Active clients'} value=${activeN} icon="layers"/>
      <${KPI} label=${ar?'محتاج متابعة':'Needs follow-up'} value=${followN} icon="alert"/>
      <${KPI} label=${ar?'تسليمات هذا الأسبوع':'Due this week'} value=${dueWeek} icon="clock"/>
      <${KPI} label=${ar?'تسليمات متأخرة':'Overdue deliverables'} value=${dlvOverdue} icon="alert"/>
    </div>
    ${fin?html`<div style=${{marginBottom:16}}><${Panel} title=${ar?'المالية — للإدارة فقط':'Money — admin only'} sub=${ar?'محسوبة من الدفعات والتحصيلات الفعلية':'live from payments & collections'}>
      <div class="grid g-4" style=${{marginBottom:upcoming.length?12:0}}>
        <${KPI} label=${ar?'متوقع هذا الشهر':'Expected this month'} value=${money(expectedM)} icon="calendar"/>
        <${KPI} label=${ar?'تم تحصيله':'Collected this month'} value=${money(collectedM)} icon="wallet"/>
        <${KPI} label=${ar?'متأخرات':'Overdue payments'} value=${money(overdueP.reduce((s,x)=>s+(+x.amount||0),0))} icon="alert" sub=${overdueP.length+' '+(ar?'بند':'item(s)')}/>
        <${KPI} label=${ar?'أقرب استحقاق':'Next due'} value=${upcoming.length?fmtDate(upcoming[0].dueDate):'—'} icon="clock"/>
      </div>
      ${upcoming.length?html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${ar?'العميل':'Client'}</th><th class="right">${ar?'المبلغ':'Amount'}</th><th>${ar?'الاستحقاق':'Due'}</th><th></th></tr></thead><tbody>
        ${upcoming.map(u=>{ const c=byId(clients,u.clientId)||{}; const s3=u.dueDate<=new Date(Date.now()+3*86400000).toISOString().slice(0,10); return html`<tr key=${u.id}>
          <td data-label="Client"><b>${cNameOf(c)}</b></td><td data-label="Amount" class="right mono">${money(u.amount)}</td>
          <td data-label="Due"><span style=${{color:s3?'var(--lime)':'var(--ink-2)'}}>${fmtDate(u.dueDate)}</span></td>
          <td class="right">${cPhoneOf(c)?html`<a class="mini" href=${waLink(cPhoneOf(c),(ar?'تذكير من Magnet: مستحق دفعة بقيمة ':'Reminder from Magnet: payment of ')+money(u.amount)+(ar?' بتاريخ ':' due ')+fmtDate(u.dueDate))} target="_blank" rel="noopener">${ar?'تذكير واتساب':'WhatsApp'}</a>`:''}</td>
        </tr>`; })}</tbody></table></div>`:''}
    <//></div>`:''}
    ${layout==='board'
      ? html`<${Kanban} items=${items} columns=${['Lead','Onboarding','Active','Paused','Churned']} field="_pipe" canMove=${ce}
          onMove=${(id,s)=>ctx.updateRecord('clients',id,{status:s})} onCard=${c=>setSel(c)}
          render=${c=>html`<div style=${{cursor:'pointer'}}>
            <div class="flex between center"><b style=${{fontSize:12.5,fontWeight:600}}>${cNameOf(c)}</b>
              ${needsFollowup(db,c)?html`<span class="mono" style=${{fontSize:9,color:'var(--warn)'}}>${ar?'متابعة':'follow-up'}</span>`:''}</div>
            <div class="muted" style=${{fontSize:11,marginTop:5}}>${c.serviceType||(Array.isArray(c.services)?c.services.join(', '):'')||'—'}</div>
            ${fin?(()=>{ const od=(db.collections||[]).filter(x=>x.clientId===c.id&&(x.status||'Pending')==='Pending'&&x.dueDate&&x.dueDate<=soon2); return od.length?html`<div class="mono" style=${{fontSize:10,color:'var(--lime)',marginTop:6}}>${money(od.reduce((s,x)=>s+(+x.amount||0),0))} ${ar?'مستحق قريباً':'due soon'}</div>`:''; })():''}
          </div>`}/>`
      : html`<${DataTable} db=${db} rows=${clients} extraActions=${c=>html`<button class="mini" onClick=${()=>setSel(c)}>${ar?'فتح':'Open'}</button>`}
          cols=${[{k:'name',label:ar?'العميل':'Client',render:cNameOf},{k:'status',label:ar?'الحالة':'Status',tag:true},{k:'serviceType',label:ar?'الخدمة':'Service'},{k:'_fu',label:ar?'متابعة':'Follow-up',render:c=>needsFollowup(db,c)?html`<span class="vpill warn">${ar?'محتاج':'Needs'}</span>`:'—'}]}/>`}
    ${sel&&html`<${AccountDrawer} ctx=${ctx} client=${byId(clients,sel.id)||sel} fin=${fin} ce=${ce} onClose=${()=>setSel(null)}/>`}
  </div>`;
}

function AccountDrawer({ ctx, client, fin, ce, onClose }){
  const { db, lang }=ctx; const ar=lang==='ar'; const c=client;
  const [tab,setTab]=useState('report'); const [note,setNote]=useState('');
  const [nInst,setNInst]=useState(3); const [ivl,setIvl]=useState('Monthly');
  const [hi,setHi]=useState(''); const [ns,setNs]=useState('');
  const acts=clientActivities(db,c).slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const dlv=(db.deliverables||[]).filter(d=>d.clientId===c.id);
  const clientProjects=(db.projects||[]).filter(p=>p.clientId===c.id);
  const clientTasks=(db.tasks||[]).filter(t=>t.clientId===c.id || clientProjects.some(p=>p.id===t.projectId));
  const contracts=(db.contracts||[]).filter(k=>k.clientId===c.id);
  const clientCols=(db.collections||[]).filter(x=>x.clientId===c.id).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
  const ob=(Array.isArray(c.onboarding)&&c.onboarding.length)?c.onboarding:ONBOARDING_STEPS.map(s=>({item:s,done:false}));
  const obDone=ob.filter(s=>s.done).length; const obPct=Math.round(obDone/ob.length*100);
  const toggleOb=(i)=>{ if(!ce)return; ctx.updateRecord('clients',c.id,{onboarding:ob.map((s,idx)=>idx===i?Object.assign({},s,{done:!s.done}):s)}); };
  const addNote=()=>{ if(!note.trim())return; ctx.createRecord('activityLogs',{entityType:'clients',entityId:c.id,clientId:c.id,type:'note',message:note.trim(),by:ctx.user.name}); setNote(''); };
  const genSchedule=(k)=>{ const val=+k.value||0; if(!val){ alert(ar?'حط قيمة العقد الأول (value).':'Set a contract value first.'); return; }
    const n=Math.max(1,Math.min(120, parseInt(nInst,10)||1)); const per=Math.round(val/n); const start=k.startDate||todayISO();
    if((db.collections||[]).some(x=>x.contractId===k.id)){ if(!confirm(ar?'العقد ده ليه جدول دفعات بالفعل. أزوّد كمان؟':'This contract already has a schedule. Add more?')) return; }
    const stepDays = ivl==='Weekly'?7:ivl==='Biweekly'?14:0; // 0 = monthly
    for(let i=0;i<n;i++){ const d=new Date(start); if(stepDays) d.setDate(d.getDate()+i*stepDays); else d.setMonth(d.getMonth()+i);
      const amt = i===n-1 ? (val - per*(n-1)) : per; // last installment absorbs the rounding remainder so they sum to `val`
      ctx.createRecord('collections',{clientId:c.id,contractId:k.id,title:(k.title||k.contractNumber||'Contract')+' '+(i+1)+'/'+n,amount:amt,dueDate:d.toISOString().slice(0,10),status:'Pending'}); }
    showProPopup('savedNotes',n+(ar?' دفعات اتولّدت':' payments generated')); };
  const markPaid=(x)=>{ ctx.updateRecord('collections',x.id,{status:'Collected',collectedDate:todayISO()}); ctx.createRecord('payments',{clientId:c.id,amount:+x.amount||0,date:todayISO(),method:x.method||'Bank',collectionId:x.id,notes:'Accounts payment'}); showProPopup('paymentReceived',money(x.amount)); };
  const total=contracts.reduce((s,k)=>s+(+k.value||0),0);
  const paid=clientCols.filter(x=>x.status==='Collected').reduce((s,x)=>s+(+x.amount||0),0);
  const remaining=total-paid;
  const nm=cNameOf(c);
  // ---- Report & Handover state (stored on the client record as c.report jsonb) ----
  const rep=c.report||{};
  const missing=reportMissing(c,db,ar);
  const {actual:repActual}=reportPlanActual(c,db);
  const saveReport=(patch)=>{ if(!ce)return; ctx.updateRecord('clients',c.id,{report:Object.assign({plan:{},highlights:[],nextSteps:[],handover:''},rep,patch)}); };
  const setPlan=(k,v)=>{ if(!ce)return; ctx.updateRecord('clients',c.id,{[k]:Math.max(0,parseInt(v,10)||0)}); };
  const addToList=(key,val,clear)=>{ if(!val.trim())return; saveReport({[key]:[...(rep[key]||[]),{t:val.trim()}]}); clear(''); };
  const delFromList=(key,i)=>saveReport({[key]:(rep[key]||[]).filter((_,idx)=>idx!==i)});
  const clientAssets=(db.clientAssets||[]).filter(a=>a.clientId===c.id);
  const monthCal=(db.contentCalendar||[]).filter(x=>x.clientId===c.id && monthOf(x.scheduledDate||x.deadline||x.createdAt)===thisMonth()).sort((a,b)=>(a.scheduledDate||'').localeCompare(b.scheduledDate||''));
  const empById=(id)=>{ const r=(db.employees||[]).find(x=>x.id===id); return r?(r.fullName||r.displayName||r.name||'—'):'—'; };
  const assetColor=(s)=> s==='Available'?'var(--pos)':(s==='Missing'?'var(--warn)':'var(--ink-3)');
  const stOf=(x)=> x.status==='Collected'?'Collected':(x.dueDate&&x.dueDate<todayISO()?'Overdue':'Pending');
  const tabs=[['report',ar?'التقرير والهاند-أوفر':'Report & Handover'],['work',ar?'المشاريع والتاسكات':'Projects & Tasks'],fin?['payments',ar?'العقود والدفعات':'Contracts & Payments']:null,['onboarding',ar?'الأونبوردنج':'Onboarding'],['deliverables',ar?'التسليمات':'Deliverables'],['activity',ar?'النشاط':'Activity']].filter(Boolean);
  return html`<div class="cdrawer-ov" onClick=${onClose}><div class="cdrawer" dir=${ar?'rtl':'ltr'} onClick=${e=>e.stopPropagation()}>
    <div class="cdrawer-h">
      <div><div class="muted" style=${{fontSize:11,textTransform:'uppercase',letterSpacing:'.05em'}}>${ar?'حساب':'Account'} · ${c.status||'—'}</div>
        <h3 style=${{margin:'3px 0 0',fontSize:18}}>${nm}</h3>
        <div class="muted" style=${{fontSize:12,marginTop:3}}>${cContactOf(c)}${(cContactOf(c)&&cPhoneOf(c))?' · ':''}${cPhoneOf(c)}</div></div>
      <button class="mini" onClick=${onClose}>×</button></div>
    <div class="cdrawer-b">
      <div class="flex gap8" style=${{flexWrap:'wrap',marginBottom:14}}>
        ${cPhoneOf(c)?html`<a class="btn btn-pri" style=${{padding:'8px 14px'}} href=${waLink(cPhoneOf(c),(ar?'أهلاً ':'Hi ')+(cContactOf(c)||nm)+(ar?'، حابين نطمّن على الشغل ونسمع رأيك. — Magnet':', checking in on your project — Magnet'))} target="_blank" rel="noopener">${ar?'متابعة واتساب':'WhatsApp follow-up'}</a>`:''}
        <button class="btn btn-ghost" onClick=${()=>accountMonthlyReport(c,db,ctx,'client')}>${ar?'تقرير شهري':'Monthly report'}</button>
        <button class="btn btn-ghost" onClick=${()=>accountMonthlyReport(c,db,ctx,'handover')}>${ar?'شيت هاند-أوفر':'Handover sheet'}</button>
        ${ce?html`<button class="btn btn-ghost" onClick=${()=>ctx.openModal('clients',c)}>${ar?'تعديل العميل':'Edit client'}</button>`:''}
      </div>
      <div class="seg" style=${{marginBottom:14,flexWrap:'wrap'}}>${tabs.map(t=>html`<button key=${t[0]} class=${tab===t[0]?'on':''} onClick=${()=>setTab(t[0])}>${t[1]}</button>`)}</div>

      ${tab==='report'?html`<div>
        <div class="muted" style=${{fontSize:11.5,marginBottom:14,lineHeight:1.5}}>${ar?'كل حاجة عن العميل في مكان واحد — جاهزة للملء وللهاند-أوفر. اطبع "تقرير شهري" للعميل أو "شيت هاند-أوفر" للفريق من فوق.':'Everything about this client in one place — ready to fill and to hand over. Print "Monthly report" for the client or "Handover sheet" for the team from the top.'}</div>

        <div style=${{border:'1px solid '+(missing.length?'var(--warn)':'var(--line)'),background:missing.length?'rgba(230,160,30,.06)':'transparent',borderRadius:12,padding:'12px 14px',marginBottom:16}}>
          <div class="flex between center" style=${{marginBottom:missing.length?8:0}}><b style=${{fontSize:13,color:missing.length?'var(--warn)':'var(--pos)'}}>${missing.length?(ar?'الناقص في العميل':'What is missing'):(ar?'العميل مكتمل ✓':'Client complete ✓')}</b><span class="mono" style=${{fontSize:11,color:missing.length?'var(--warn)':'var(--pos)'}}>${missing.length||''}</span></div>
          ${missing.map((mLine,i)=>html`<div class="flex" key=${i} style=${{gap:8,padding:'4px 0',fontSize:12,alignItems:'flex-start'}}><span style=${{color:'var(--warn)',lineHeight:1.3}}>•</span><span style=${{lineHeight:1.4}}>${mLine}</span></div>`)}
        </div>

        <div class="flex between center" style=${{marginBottom:8}}><b style=${{fontSize:13}}>${ar?'الخطة الشهرية مقابل المُنفّذ':'Monthly plan vs delivered'}</b><span class="muted" style=${{fontSize:11}}>${thisMonth()}</span></div>
        ${REPORT_PLAN_TYPES.map(([k,ct,la,le])=>html`<div class="flex between center" key=${k} style=${{gap:10,padding:'7px 0',borderBottom:'1px solid var(--line)'}}>
          <span style=${{fontSize:13}}>${ar?la:le}</span>
          <div class="flex center" style=${{gap:10}}>
            <span class="mono" style=${{fontSize:11,color:(repActual[k]||0)>=planVal(c,k)&&planVal(c,k)>0?'var(--pos)':'var(--ink-3)'}}>${ar?'منفّذ':'done'} ${repActual[k]||0}</span>
            <span class="muted" style=${{fontSize:11}}>${ar?'خطة':'plan'}</span>

        <div class="flex between center" style=${{margin:'18px 0 8px'}}><b style=${{fontSize:13}}>${ar?'الإعداد (Setup)':'Setup done'}</b><span class="mono lime" style=${{fontSize:12}}>${obPct}%</span></div>

        <div class="muted" style=${{fontSize:11,marginTop:6}}>${ob.filter(s=>s.done).map(s=>s.item).join(' · ')||(ar?'لسه مفيش خطوات مكتملة — روح تبويب الأونبوردنج.':'No steps done yet — see the Onboarding tab.')}</div>

        <div style=${{margin:'18px 0 8px'}}><b style=${{fontSize:13}}>${ar?'كالندر الشهر':'Calendar this month'}</b></div>

          ${ce?html`<button class="mini pri" onClick=${()=>genSchedule(k)}>${ar?'ولّد الدفعات':'Generate schedule'}</button>`:''}</div>`):html`<div class="muted" style=${{fontSize:12,padding:'6px 0'}}>${ar?'مفيش عقود. اعمل عقد من موديول Contracts.':'No contracts yet — add one in Contracts.'}</div>`}
        <b style=${{fontSize:13,display:'block',marginTop:14}}>${ar?'جدول الدفعات':'Payment schedule'}</b>
        ${clientCols.length?html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${ar?'البند':'Item'}</th><th class="right">${ar?'المبلغ':'Amount'}</th><th>${ar?'الاستحقاق':'Due'}</th><th>${ar?'الحالة':'Status'}</th><th></th></tr></thead><tbody>
          ${clientCols.map(x=>{ const st=stOf(x); return html`<tr key=${x.id}>

            <td data-label="Due">${fmtDate(x.dueDate)}</td>

function DashboardView({ ctx, byBrand }){
  const { db, role, user } = ctx;
  const leads = byBrand(db.leads||[]);
  const m = thisMonth();

  // CLIENT dashboard
  if(aliasRole(role)==='Client'){
    const mine = (coll)=>filterRecordsByRole(coll, db[coll]||[], role, user);
    const dlv = mine('deliverables');
    return html`<div class="view">
      <${Head} eyebrow="Client Portal" title="Welcome back" desc="Your projects, approvals, invoices and files."/>
      <div class="grid g-3 stagger" style=${{marginBottom:18}}>
        <${KPI} label="Your projects" value=${mine('projects').length} icon="briefcase"/>
        <${KPI} label="Awaiting your approval" value=${dlv.filter(d=>d.status==='Client Review').length} icon="docs"/>
        <${KPI} label="Outstanding invoices" value=${money(mine('invoices').filter(i=>!/cancel|draft/i.test(i.status||'')).reduce((s,i)=>s+(ctx.invTotal(i)-ctx.invPaid(i)),0))} icon="finance"/>
      </div>
      <div style=${{display:'grid',gridTemplateColumns:'1.3fr 1fr',gap:18}}>
        <${Panel} title="Deliverables to review">
          ${dlv.filter(d=>d.status==='Client Review').map(d=>html`<div class="lrow" key=${d.id}>
            <div class="li-ic">${React.createElement(Icon.docs)}</div>
            <div class="li-t"><b>${d.title}</b><span>${d.type} · v${d.version||1}</span></div>
            <div class="flex gap8">
              <button class="mini pri" onClick=${()=>ctx.approveDeliverable(d)}>Approve</button>
              <button class="mini" onClick=${()=>{const n=prompt('What needs changing?');if(n)ctx.requestRevision(d,n);}}>Request revision</button></div></div>`)}
          ${dlv.filter(d=>d.status==='Client Review').length===0&&html`<div class="muted" style=${{fontSize:12}}>Nothing is awaiting your approval right now.</div>`}
        <//>
        <${Panel} title="Your invoices">
          ${mine('invoices').map(i=>html`<div class="lrow" key=${i.id}>
            <div class="li-ic">${React.createElement(Icon.finance)}</div>
            <div class="li-t"><b>${i.invoiceNumber}</b><span>${i.status}</span></div>
            <span class="li-meta">${money(ctx.invTotal(i)-ctx.invPaid(i))} due</span></div>`)}
          ${mine('invoices').length===0&&html`<div class="muted" style=${{fontSize:12}}>No invoices yet.</div>`}
        <//>
      </div>
      <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,marginTop:18}}>
        <${Panel} title="Shared files & assets">
          ${mine('clientAssets').filter(a=>a.visibility==='Client Visible').map(a=>html`<div class="lrow" key=${a.id}>
            <div class="li-ic">${React.createElement(Icon.docs)}</div><div class="li-t"><b>${a.title}</b><span>${a.assetType}</span></div>
            ${(a.driveLink||a.fileLink)?html`<a class="mini" href=${a.driveLink||a.fileLink} target="_blank" rel="noopener">Open</a>`:''}</div>`)}
          ${mine('clientAssets').filter(a=>a.visibility==='Client Visible').length===0&&html`<div class="muted" style=${{fontSize:12}}>No shared files yet.</div>`}
        <//>
        <${Panel} title="Messages">
          ${mine('chatMessages').filter(m=>m.visibility==='Client Visible').slice(-5).map(m=>html`<div class="lrow" key=${m.id}>
            <div class="li-t"><b style=${{fontWeight:600}}>${m.senderName}</b><span>${m.message}</span></div></div>`)}
          ${mine('chatMessages').filter(m=>m.visibility==='Client Visible').length===0&&html`<div class="muted" style=${{fontSize:12}}>No messages yet.</div>`}
        <//>
      </div></div>`;
  }

  // CREATIVE dashboard (Designer / Content Creator / Video / Reel / Social / Art Director)
  // Uses aliasRole so all creative role names — incl. the new "Creative" role — land here
  // (was an exact role==='Designer' check, so "Creative" fell through to the admin view).
  if(['Designer','Video Editor','Social Media','Art Director'].includes(aliasRole(role))){
    const myTasks = (db.tasks||[]).filter(t=>t.assignedTo===user.id||t.assignedTo===user.name);
    const myDlv = (db.deliverables||[]).filter(d=>d.assignedTo===user.id||d.assignedTo===user.name);
    return html`<div class="view">
      <${Head} eyebrow="My Work" title=${(ctx.lang==='ar'?'أهلاً، ':'Hello, ')+(user.name||user.fullName||'')} desc=${ctx.lang==='ar'?'شغلك ومواعيدك النهاردة.':'Your assigned tasks and deadlines.'}/>
      <div class="grid g-4 stagger" style=${{marginBottom:18}}>
        <${KPI} label=${ctx.lang==='ar'?'مهامي المستحقة النهاردة':'Due today'} value=${myTasks.filter(t=>t.status!=='Done'&&t.dueDate===todayISO()).length} icon="clock"/>
        <${KPI} label=${ctx.lang==='ar'?'مهام نشطة':'Active tasks'} value=${myTasks.filter(t=>t.status!=='Done').length} icon="check"/>
        <${KPI} label=${ctx.lang==='ar'?'متأخرة':'Overdue'} value=${myTasks.filter(t=>t.status!=='Done'&&isOverdue(t.dueDate)).length} icon="alert"/>
        <${KPI} label=${ctx.lang==='ar'?'تسليمات مطلوبة':'Deliverables to submit'} value=${myDlv.filter(d=>!['Approved','Delivered','Client Review'].includes(d.status)).length} icon="docs"/>
      </div>
      <div style=${{marginBottom:18}}><${QuickTimeOff} ctx=${ctx}/></div>
      <${Panel} title="My tasks" pad=${false}>
        <${DataTable} db=${db} rows=${myTasks} cols=${[{k:'name',label:'Task'},{k:'projectId',label:'Project',ref:true,coll:'projects'},{k:'status',label:'Status',tag:true},{k:'dueDate',label:'Due',date:true}]}/>
      <//></div>`;
  }

  // ACCOUNTANT dashboard (finance + payroll)
  if(aliasRole(role)==='Accountant'){
    const eps=db.employeePayments||[];
    const payrollDue=eps.filter(p=>p.paymentStatus!=='Paid'&&p.paymentStatus!=='Cancelled').reduce((s,p)=>s+(p.netAmount||empPaymentNet(p)),0);
    const paidSalaries=eps.filter(p=>p.paymentStatus==='Paid').reduce((s,p)=>s+(p.netAmount||empPaymentNet(p)),0);
    const pendingCount=eps.filter(p=>p.paymentStatus==='Pending').length;
    const freelanceCost=(db.expenses||[]).filter(e=>e.category==='Freelancers').reduce((s,e)=>s+(+e.amount||0),0);
    return html`<div class="view">
      <${Head} eyebrow="Finance / HR" title="Finance & Payroll" desc="Cash, margins and payroll."/>
      <div class="grid g-4 stagger" style=${{marginBottom:18}}>
        <${KPI} label="Payroll due" value=${money(payrollDue)} icon="wallet"/>
        <${KPI} label="Paid salaries" value=${money(paidSalaries)} icon="finance"/>
        <${KPI} label="Pending payments" value=${pendingCount} icon="clock"/>
        <${KPI} label="Freelance costs" value=${money(freelanceCost)} icon="trendDown"/>
      </div>
      <${ProfitabilityView} ctx=${ctx} asDashboard=${true} embedded=${true}/></div>`;
  }

  // SALES dashboard (Sales + Account Manager, via aliasRole)
  if(aliasRole(role)==='Sales'){
    const pipe = leads.filter(l=>!['Won','Lost'].includes(l.status));
    return html`<div class="view">
      <${Head} eyebrow="Sales" title="Pipeline" desc="Your leads and deals."/>
      <div class="grid g-4 stagger" style=${{marginBottom:18}}>
        <${KPI} label="New leads (month)" value=${leads.filter(l=>monthOf(l.createdAt)===m).length} icon="target"/>
        <${KPI} label="Pipeline value" value=${money(pipe.reduce((s,l)=>s+(+l.value||0),0))} icon="trend"/>
        <${KPI} label="Won deals" value=${leads.filter(l=>l.status==='Won').length} icon="check"/>

      </div>

  const avgPerf = emps.length? Math.round(emps.reduce((s,e)=>s+(+e.performanceScore||0),0)/emps.length) : 0;

      ${aliasRole(role)==='Admin'&&html`<${KPI} label="Avg. performance" value=${avgPerf} icon="trend"/>`}

          ${(db.approvalRequests||[]).filter(r=>r.status==='Pending Approval').length===0&&html`<div class="muted" style=${{fontSize:12}}>None</div>`}</div>
        <div class="war-card"><h4>Awaiting client</h4>
          ${(db.deliverables||[]).filter(d=>d.status==='Client Review').slice(0,4).map(d=>html`<div class="lrow" key=${d.id}><div class="li-t"><b style=${{fontWeight:600,fontSize:12}}>${d.title}</b><span>${nameById(db.clients,d.clientId)}</span></div></div>`)}
          ${(db.deliverables||[]).filter(d=>d.status==='Client Review').length===0&&html`<div class="muted" style=${{fontSize:12}}>None</div>`}</div>
        <div class="war-card"><h4>Overdue tasks</h4>
          ${(db.tasks||[]).filter(t=>calculateTaskDelay(t).overdue).slice(0,4).map(t=>html`<div class="lrow" key=${t.id}><div class="li-t"><b style=${{fontWeight:600,fontSize:12}}>${t.title||t.name}</b><span>${nameById(db.employees,t.assignedTo)}</span></div></div>`)}
          ${(db.tasks||[]).filter(t=>calculateTaskDelay(t).overdue).length===0&&html`<div class="muted" style=${{fontSize:12}}>None</div>`}</div>
        <div class="war-card"><h4>Missing client assets</h4>
          ${(db.clientAssets||[]).filter(a=>a.accessStatus==='Missing').slice(0,4).map(a=>html`<div class="lrow" key=${a.id}><div class="li-t"><b style=${{fontWeight:600,fontSize:12}}>${a.title}</b><span>${nameById(db.clients,a.clientId)}</span></div></div>`)}
          ${(db.clientAssets||[]).filter(a=>a.accessStatus==='Missing').length===0&&html`<div class="muted" style=${{fontSize:12}}>None</div>`}</div>
      </div>
    <//>
    ${(()=>{ const A=window.__charts; if(!A) return null; const ar=ctx.lang==='ar';
      // ----- chart datasets from real data -----
      const invByStatus=['Draft','Sent','Paid','Overdue','Cancelled'].map((s,i)=>({label:t(s)!==s?t(s):s,
        value:(db.invoices||[]).filter(x=>{ const st=(x.status||'').toLowerCase(); if(s==='Paid')return st==='paid'; if(s==='Overdue')return isOverdue(x.dueDate)&&ctx.invTotal(x)-ctx.invPaid(x)>0; if(s==='Sent')return /sent/.test(st); if(s==='Cancelled')return st==='cancelled'; return /draft/.test(st); }).length,
        color:['#7d8279','#7fb6f0','#c8f31e','#f0796b','#565a52'][i]}));
      const taskStatuses=['New','Assigned','In Progress','Internal Review','Revisions','Approved','Delivered','Done'];
      const taskBars=taskStatuses.map((s,i)=>({label:t(s)!==s?t(s):s,value:(db.tasks||[]).filter(x=>x.status===s).length,color:'#c8f31e'})).filter(d=>d.value>0);
      const clientStatuses=['Lead','Onboarding','Active','Paused','Completed','Churned'];
      const clientPie=clientStatuses.map((s,i)=>({label:t(s)!==s?t(s):s,value:byBrand(db.clients||[]).filter(c=>c.status===s).length,color:['#7fb6f0','#f4c451','#c8f31e','#c9a6f0','#7fe0c4','#f0796b'][i]})).filter(d=>d.value>0);
      const wfStages=(typeof WORKFLOW_STAGES!=='undefined'?WORKFLOW_STAGES:[]);
      const wfData=wfStages.slice(0,8).map(st=>({label:st.name,value:(db.workflows||[]).filter(w=>w.stage===st.n).length,color:'#7fb6f0'}));
      // revenue: last 6 months paid
      const months=[]; for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); months.push(d.toISOString().slice(0,7)); }
      const revPoints=months.map(mo=>(db.payments||[]).filter(p=>monthOf(p.date)===mo).reduce((s,p)=>s+(+p.amount||0),0));
      const teamLoad=emps.slice(0,6).map(e=>({label:(e.fullName||e.name||'').split(' ')[0],value:(db.tasks||[]).filter(tk=>(tk.assignedTo===e.id||tk.assignedTo===e.name)&&!['Done','Delivered','Approved','Cancelled'].includes(tk.status)).length,color:'#c8f31e'}));
      return html`<div class="charts-grid">
        ${fin?html`<${Panel} title=${t('Revenue Overview')} sub=${ar?'آخر 6 أشهر':'Last 6 months'} className="chart-card">
          <${A.LineChart} series=${[{label:t('Paid Revenue'),color:'#c8f31e',points:revPoints}]} fmt=${v=>money(v)}/>
          <div class="muted" style=${{fontSize:11,marginTop:8,textAlign:ar?'right':'left'}}>${months.map(mo=>mo.slice(5)).join(' · ')}</div>
        <//>`:null}
        ${fin?html`<${Panel} title=${t('Invoice Status')} className="chart-card">
          <div class="flex center" style=${{gap:16,flexWrap:'wrap'}}>
            <${A.DonutChart} data=${invByStatus} centerValue=${(db.invoices||[]).length} centerLabel=${t('Invoices')!==''?t('Invoices'):'Invoices'}/>
            <${A.ChartLegend} data=${invByStatus}/></div>
        <//>`:null}
        <${Panel} title=${t('Task Status')} className="chart-card">
          ${taskBars.length?html`<${A.BarChart} data=${taskBars}/>`:html`<div class="muted" style=${{fontSize:12}}>${t('No data yet')}</div>`}
        <//>
        ${(role==='Admin'||role==='Owner'||role==='Manager'||role==='Project Manager')?html`<${Panel} title=${t('Team Workload')} className="chart-card">
          ${teamLoad.length?html`<${A.HBarChart} data=${teamLoad}/>`:html`<div class="muted" style=${{fontSize:12}}>${t('No data yet')}</div>`}
        <//>`:null}
        <${Panel} title=${t('Client Status')} className="chart-card">
          ${clientPie.length?html`<div class="flex center" style=${{gap:16,flexWrap:'wrap'}}><${A.DonutChart} data=${clientPie} thickness=${28} centerValue=${byBrand(db.clients||[]).length} centerLabel=${t('Clients')!==''?t('Clients'):'Clients'}/><${A.ChartLegend} data=${clientPie}/></div>`:html`<div class="muted" style=${{fontSize:12}}>${t('No data yet')}</div>`}
        <//>
        ${wfData.some(d=>d.value)?html`<${Panel} title=${t('Workflow Progress')} className="chart-card"><${A.BarChart} data=${wfData}/><//>`:null}
      </div>`;
    })()}
    <div style=${{display:'grid',gridTemplateColumns:'1.3fr 1fr',gap:18,marginTop:18}}>
      <${Panel} title=${t('Recent Activity')}>
        ${(db.activityLogs||[]).slice(0,8).map(a=>html`<div class="lrow" key=${a.id}><${Avatar} name=${a.actorName} size=${28}/>
          <div class="li-t"><b style=${{fontWeight:500,fontSize:12.5}}><span style=${{fontWeight:700}}>${a.actorName}</span> ${a.action} <span class="lime">${a.entityType}</span></b></div>
          <span class="li-meta">${fmtDateTime(a.createdAt)}</span></div>`)}
      <//>
      <${Panel} title="Needs attention">
        ${(db.deliverables||[]).filter(d=>d.status==='Client Review').map(d=>html`<div class="lrow" key=${d.id}>
          <div class="li-ic">${React.createElement(Icon.docs)}</div><div class="li-t"><b>${d.title}</b><span>Awaiting client</span></div></div>`)}

          <div class="li-ic">${React.createElement(Icon.finance)}</div><div class="li-t"><b>${i.invoiceNumber}</b><span>${money(ctx.invTotal(i)-ctx.invPaid(i))} outstanding</span></div></div>`)}
      <//>
    </div></div>`;
}

      <h3 style=${{margin:'3px 0 0',fontSize:18}}>${rec.title||rec.name||'—'}</h3></div><button class="mini" onClick=${onClose}>×</button></div>

// Next collection date for a client, from billingCycle + collectionDay (or explicit date).
function computeNextCollection(client){
  const cycle=client.billingCycle||'Monthly';
  const today=todayISO();
  if(client.nextCollectionDate && client.nextCollectionDate>=today) return client.nextCollectionDate;
  if(cycle==='One-time') return client.nextCollectionDate||client.contractStartDate||'';
  const day=Math.min(Math.max(parseInt(client.collectionDay,10)||1,1),28);
  const p=today.split('-'); const ty=+p[0], tm=+p[1], td=+p[2];
  const step=cycle==='Quarterly'?3:cycle==='Annual'?12:1;
  let d=new Date(ty,tm-1,day); const todayD=new Date(ty,tm-1,td);
  while(d<todayD){ d=new Date(d.getFullYear(), d.getMonth()+step, day); }
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function PartnersView({ ctx }){
  const { db, appSettings, role } = ctx;
  const canManage = role==='Owner' || aliasRole(role)==='Admin';
  const partners = getPartners(appSettings);
  const [p1,p2] = partners;
  const [edit,setEdit] = useState(false);
  const [draft,setDraft] = useState(()=>partners.map(p=>({...p})));
  const income = (db.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
  const expOneoff = (db.expenses||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const expFixed = (db.fixedCosts||[]).filter(f=>(f.status||'Active')==='Active').reduce((s,f)=>s+cycleToMonthly(f.amount,f.cycle),0);
  const expenses = expOneoff + expFixed;
  const net = income - expenses;
  const sharePct = (p)=> (p.share==null ? 50 : Number(p.share))/100;
  // What each partner PERSONALLY paid out of pocket (paidBy === their name).
  const paidByName = (name)=> (db.expenses||[]).filter(e=>e.paidBy===name&&!e.settled).reduce((s,e)=>s+(Number(e.amount)||0),0)
    + (db.fixedCosts||[]).filter(f=>(f.status||'Active')==='Active'&&f.paidBy===name&&!f.settled).reduce((s,f)=>s+cycleToMonthly(f.amount,f.cycle),0);
  const personal1=paidByName(p1.name), personal2=paidByName(p2.name);
  const totalPersonal=personal1+personal2;
  const fair1=totalPersonal*sharePct(p1);
  const rawBal1=personal1-fair1; // >0 => p1 overpaid (owed back)
  // Net out reimbursements already recorded (a settlement: fromName paid toName an amount).
  const settlements=[...(db.partnerSettlements||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const settledNet=(name)=> settlements.reduce((s,r)=>s+((r.toName===name?1:0)-(r.fromName===name?1:0))*(Number(r.amount)||0),0);
  // Settled items are already excluded from paidByName/rawBal1, so the open-item imbalance
  // IS the outstanding balance — do NOT subtract settledNet again (that double-counts).
  const outstanding1 = rawBal1;
  const settleAmt = Math.abs(outstanding1);
  const payer = outstanding1>0 ? p2 : p1;   // negative => p1 owes
  const receiver = outstanding1>0 ? p1 : p2;
  const save=()=>{ const cleaned=draft.map(p=>({id:p.id,name:p.name||'',share:Number(p.share)||0})); const sum=cleaned.reduce((s,p)=>s+p.share,0)||100; cleaned.forEach(p=>p.share=Math.round(p.share/sum*100)); ctx.applyAppSettings({partners:cleaned}); setEdit(false); };
  const settleUp=()=>{ if(settleAmt<1) return;
    if(partners.length!==2){ window.alert('Settlement currently supports exactly 2 partners. Edit partners to 2, or settle manually.'); return; }
    const items=[];
    (db.expenses||[]).forEach(e=>{ if(!e.settled && partners.some(p=>p.name===e.paidBy)){ ctx.updateRecord('expenses',e.id,{settled:true,settledAt:todayISO()}); items.push({coll:'expenses',id:e.id}); }});
    (db.fixedCosts||[]).forEach(f=>{ if(!f.settled && (f.status||'Active')==='Active' && partners.some(p=>p.name===f.paidBy)){ ctx.updateRecord('fixedCosts',f.id,{settled:true,settledAt:todayISO()}); items.push({coll:'fixedCosts',id:f.id}); }});
    ctx.createRecord('partnerSettlements',{ fromName:payer.name, toName:receiver.name, amount:Math.round(settleAmt), date:todayISO(), note:'Settled all', items }); showProPopup('savedNotes','Marked as settled'); };

function ProfitabilityView({ ctx, asDashboard }){
  const { db } = ctx;
  const invTotalAll = (db.invoices||[]).reduce((s,i)=>s+ctx.invTotal(i),0);
  const paid = (db.payments||[]).reduce((s,p)=>s+(+p.amount||0),0);
  const outstanding = (db.invoices||[]).filter(i=>!/cancel|draft/i.test(i.status||'')).reduce((s,i)=>s+(ctx.invTotal(i)-ctx.invPaid(i)),0);
  const expOneoff = (db.expenses||[]).reduce((s,e)=>s+(Number(e.amount)||0),0);
  // Include active monthly fixed costs so this matches the Partners screen's net.
  const expFixed = (db.fixedCosts||[]).filter(f=>(f.status||'Active')==='Active').reduce((s,f)=>s+cycleToMonthly(f.amount,f.cycle),0);
  const expenses = expOneoff + expFixed;
  const net = paid-expenses;
  const overdueCount = (db.invoices||[]).filter(i=>isOverdue(i.dueDate)&&ctx.invTotal(i)-ctx.invPaid(i)>0).length;
  const perClient = (db.clients||[]).map(c=>{
    const rev=(db.payments||[]).filter(p=>p.clientId===c.id).reduce((s,p)=>s+(+p.amount||0),0);
    const exp=(db.expenses||[]).filter(e=>e.clientId===c.id).reduce((s,e)=>s+(+e.amount||0),0);
    return {id:c.id,name:c.name,rev,exp,profit:rev-exp};
  }).filter(r=>r.rev||r.exp).sort((a,b)=>b.profit-a.profit);
  const perProject = (db.projects||[]).map(p=>{
    const exp=(db.expenses||[]).filter(e=>e.projectId===p.id).reduce((s,e)=>s+(+e.amount||0),0);
    return {id:p.id,name:p.name,budget:+p.budget||0,exp,margin:(+p.budget||0)-exp};
  }).filter(r=>r.budget||r.exp);
  return html`<div class="view">
    <${Head} eyebrow="Finance" title=${asDashboard?'Finance Dashboard':'Profitability'} desc="Revenue, expenses, and margins."/>
    <div class="grid g-4 stagger" style=${{marginBottom:18}}>
      <${KPI} label="Total invoiced" value=${money(invTotalAll)} icon="finance"/>
      <${KPI} label="Total paid" value=${money(paid)} icon="wallet"/>
      <${KPI} label="Outstanding" value=${money(outstanding)} icon="trendDown"/>
      <${KPI} label="Total expenses" value=${money(expenses)} icon="trendDown" sub="one-off + monthly fixed"/>
      <${KPI} label="Net profit" value=${money(net)} icon="trend"/>
      <${KPI} label="Overdue invoices" value=${overdueCount} icon="alert"/>
    </div>
    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
      <${Panel} title="Profit per client" pad=${false}>
        <${DataTable} db=${db} rows=${perClient} cols=${[{k:'name',label:'Client'},{k:'rev',label:'Revenue',num:true,money:true},{k:'exp',label:'Expenses',num:true,money:true},{k:'profit',label:'Profit',num:true,money:true}]}/><//>
      <${Panel} title="Margin per project" pad=${false}>
        <${DataTable} db=${db} rows=${perProject} cols=${[{k:'name',label:'Project'},{k:'budget',label:'Budget',num:true,money:true},{k:'exp',label:'Cost',num:true,money:true},{k:'margin',label:'Margin',num:true,money:true}]}/><//>
    </div></div>`;
}

/* ---- shared HR metric helpers ---- */
function employeeMetrics(db, e){
  const mine = (db.tasks||[]).filter(t=>t.assignedTo===e.id || t.assignedTo===e.name);
  const active = mine.filter(t=>t.status!=='Done');
  const overdue = active.filter(t=>isOverdue(t.dueDate));
  const dueToday = active.filter(t=>t.dueDate===todayISO());
  const wk = todayISO(); const in7=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const dueWeek = active.filter(t=>t.dueDate && t.dueDate>=wk && t.dueDate<=in7);
  const completedMonth = mine.filter(t=>t.status==='Done' && monthOf(t.updatedAt)===thisMonth());
  const capTasks = Math.max(1,(e.capacityPerWeek||40)/8); // ~1 task per 8h capacity
  const pct = Math.round(active.length/capTasks*100);
  return { active:active.length, overdue:overdue.length, dueToday:dueToday.length, dueWeek:dueWeek.length, completedMonth:completedMonth.length, pct, tag:workloadTag(pct) };
}

  return html`<div class="view">

function AttendanceView({ ctx, ce }){
  const { db, appSettings, role } = ctx;
  const ar = false; // English-only HR screen
  const seeSalary = canSeeSalary(role); // hide salary/payroll columns from PMs etc.
  const [month,setMonth]=useState(thisMonth());
  const workDays = Number(appSettings.workDaysPerMonth)||26;
  const hrsBetween=(a,b)=>{ if(!a||!b)return 0; const pa=String(a).split(':'),pb=String(b).split(':'); let d=((+pb[0]||0)*60+(+pb[1]||0))-((+pa[0]||0)*60+(+pa[1]||0)); if(d<0)d+=1440; return d/60; };
  const monthRecs=(db.attendance||[]).filter(r=>(r.date||'').slice(0,7)===month);
  const byEmp={};
  monthRecs.forEach(r=>{ const k=r.employeeId||'?'; const nm=nameById(db.employees,k); if(!byEmp[k]) byEmp[k]={id:k,days:new Set(),hours:0,name:(nm&&nm!=='—')?nm:(r.employeeName||'—')}; byEmp[k].days.add(r.date); byEmp[k].hours+=hrsBetween(r.checkIn,r.checkOut); });
  const summary=Object.values(byEmp).map(e=>{ const emp=byId(db.employees,e.id); const salary=emp?Number(emp.salary)||0:0; const daily=workDays?salary/workDays:0; const days=e.days.size;
    // Cap paid days at the month's work-days so logging in on weekends/extra days
    // (auto check-in fires on every login) can never pay more than the full salary.
    const paidDays=Math.min(days,workDays); return {id:e.id,name:e.name,hours:e.hours,days,salary,daily,earned:daily*paidDays}; }).sort((a,b)=>b.earned-a.earned);
  const monthsList=()=>{ const set=new Set((db.attendance||[]).map(r=>(r.date||'').slice(0,7)).filter(Boolean)); set.add(thisMonth()); return [...set].sort().reverse(); };
  return html`<div class="view">
    <${Head} eyebrow="Team / HR" title="Attendance & Payroll" desc="Auto check-in/out from login + payroll computed from days worked.">
      ${ce&&html`<button class="btn btn-pri" onClick=${()=>ctx.openModal('attendance',{date:todayISO(),status:'Present',workMode:'Office'})}>${React.createElement(Icon.plus)} Log attendance</button>`}<//>
    <${Panel} title=${(ar?'ملخّص الشهر · ':'Monthly summary · ')+month} sub=${(ar?'المرتب المستحق = اليومي × أيام الحضور':'Earned = daily rate × days present')}>
      <div class="flex gap8" style=${{marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
        <select class="sel" value=${month} onChange=${e=>setMonth(e.target.value)}>${monthsList().map(m=>html`<option key=${m} value=${m}>${m}</option>`)}</select>
        ${ce&&html`<span class="muted" style=${{fontSize:12}}>${ar?'أيام العمل/شهر':'Work days/mo'}</span><input class="sel" type="number" style=${{width:80}} value=${workDays} onChange=${e=>ctx.applyAppSettings({workDaysPerMonth:Number(e.target.value)||26})}/>`}
      </div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Employee</th><th class="right">Days</th><th class="right">Hours</th>${seeSalary?html`<th class="right">Salary</th><th class="right">Daily</th><th class="right">Earned</th>`:''}</tr></thead>
      <tbody>${summary.length===0?html`<tr><td colspan=${seeSalary?6:3} class="muted" style=${{textAlign:'center',padding:18}}>No attendance this month</td></tr>`:summary.map(e=>html`<tr key=${e.id}>
        <td data-label="Employee"><b>${e.name}</b></td>
        <td data-label="Days" class="right mono">${e.days}</td>
        <td data-label="Hours" class="right mono">${e.hours.toFixed(1)}</td>
        ${seeSalary?html`<td data-label="Salary" class="right mono">${e.salary?money(e.salary):'—'}</td>
        <td data-label="Daily" class="right mono">${e.salary?money(e.daily):'—'}</td>
        <td data-label="Earned" class="right mono lime">${e.salary?money(e.earned):'—'}</td>`:''}
      </tr>`)}</tbody></table></div>
    <//>
    <${DataTable} db=${db} rows=${(db.attendance||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))} canEditFlag=${ce} onEdit=${ce?(r=>ctx.openModal('attendance',r)):null} onDelete=${(ctx.canDelete&&ctx.canDelete('attendance'))?(r=>ctx.delRec('attendance',r.id,r.employeeName)):null}
      cols=${[{k:'employeeId',label:'Employee',render:r=>{const n=nameById(db.employees,r.employeeId);return (n&&n!=='—')?n:(r.employeeName||'—');}},{k:'date',label:'Date',date:true},{k:'checkIn',label:'In'},{k:'checkOut',label:'Out'},{k:'workMode',label:'Mode'},{k:'status',label:'Status',tag:true}]}/></div>`;
}
