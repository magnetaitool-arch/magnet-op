/* small shared stat block */
function _stat(l,v,c){ return html`<div style=${{flex:1,minWidth:110}}><div class="eyebrow">${l}</div><div style=${{fontFamily:'var(--display)',fontWeight:700,fontSize:18,marginTop:5,color:c||'var(--ink)'}}>${v}</div></div>`; }
function ProgressBar({ pct }){ return html`<div class="flex center" style=${{gap:10,minWidth:120}}><div class="meter" style=${{flex:1}}><i style=${{width:Math.min(100,pct||0)+'%'}}></i></div><span class="mono" style=${{fontSize:11,color:'var(--ink-3)'}}>${pct||0}%</span></div>`; }

/* ============================ CLIENTS ============================ */
function ClientsView({ ctx, visible, ce }){
  const { db, role } = ctx;
  const [view,setView]=useState('Active Clients');
  const [amgr,setAmgr]=useState(''); const [svc,setSvc]=useState(''); const [q,setQ]=useState('');
  const [sel,setSel]=useState(null);
  const seeFin=canSeeFinance(role);
  const all=visible('clients');
  const within30=(d)=>d&&d<=new Date(Date.now()+30*86400000).toISOString().slice(0,10);
  const VIEWS={
    'All Clients':()=>true,
    'Active Clients':c=>c.status==='Active',
    'Onboarding':c=>c.status==='Onboarding',
    'VIP Clients':c=>c.priority==='VIP',
    'At Risk Clients':c=>c.status==='At Risk'||calculateClientHealth(db,c.id).type==='neg',
    'Renewal Needed':c=>c.status==='Renewal Needed'||within30(c.renewalDate),
    'Pending Approvals':c=>getClientDeliverables(db,c.id).some(d=>d.status==='Client Review'),
    'Archived':c=>['Archived','Churned'].includes(c.status),
  };
  let rows=all.filter(VIEWS[view]||(()=>true));
  if(amgr) rows=rows.filter(c=>c.accountManagerId===amgr);
  if(svc) rows=rows.filter(c=>c.serviceType===svc);
  if(q){ const s=q.toLowerCase(); rows=rows.filter(c=>[c.brandName,c.name,c.industry,c.mainContactName,c.serviceType].join(' ').toLowerCase().includes(s)); }

  return html`<div class="view">
    <${Head} eyebrow="Accounts" title="Clients" desc="Full client profiles, health, projects and approvals.">
      ${ce&&html`<button class="btn btn-pri" onClick=${()=>ctx.openModal('clients',{status:'Onboarding',priority:'Normal',brand:'Magnet',clientType:'Retainer'})}>${React.createElement(Icon.plus)} New client</button>`}<//>
    <div class="flex gap8" style=${{marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
      <select class="sel" value=${view} onChange=${e=>setView(e.target.value)}>${Object.keys(VIEWS).map(v=>html`<option key=${v} value=${v}>${v}</option>`)}</select>
      <select class="sel" value=${amgr} onChange=${e=>setAmgr(e.target.value)}><option value="">All managers</option>${(db.employees||[]).map(em=>html`<option key=${em.id} value=${em.id}>${em.fullName||em.name}</option>`)}</select>
      <div class="search" style=${{marginLeft:0,width:220}}>${React.createElement(Icon.search)}<input placeholder="Search brand, contact, industry…" value=${q} onChange=${e=>setQ(e.target.value)}/></div>
      <span class="muted" style=${{fontSize:12,marginLeft:'auto'}}>${rows.length} of ${all.length}</span>
    </div>
    <${Panel} pad=${false}><div style=${{overflowX:'auto'}}><table class="tbl"><thead><tr>
      <th>Client</th><th>Status</th><th>Priority</th><th>Manager</th><th>Projects</th><th>Renewal</th>
      ${seeFin?html`<th class="right">Retainer</th>`:null}<th>Health</th><th></th></tr></thead>
    <tbody>${rows.map(c=>{ const h=calculateClientHealth(db,c.id); const projN=getClientProjects(db,c.id).filter(p=>!['Completed','Archived','Cancelled'].includes(p.status)).length;
      return html`<tr key=${c.id} style=${{cursor:'pointer'}} onClick=${()=>setSel(c)}>
      <td><div class="co-cell"><${Avatar} name=${c.brandName||c.name}/><div class="cn"><b>${c.brandName||c.name}</b><span>${c.industry||c.serviceType||''}</span></div></div></td>
      <td><${Tag}>${c.status}<//></td>
      <td>${c.priority==='VIP'?html`<${Tag} type="lime">VIP<//>`:html`<span class="muted">${c.priority}</span>`}</td>
      <td class="muted">${nameById(db.employees,c.accountManagerId)}</td>
      <td class="num">${projN}</td>
      <td class="muted" style=${{whiteSpace:'nowrap'}}>${c.renewalDate?fmtDate(c.renewalDate):(c.nextCollectionDate?fmtDate(c.nextCollectionDate):'—')}</td>
      ${seeFin?html`<td class="num">${money(c.monthlyRetainer)}</td>`:null}
      <td><${Tag} type=${h.type}>${h.label}<//></td>
      <td class="right"><button class="mini" onClick=${ev=>{ev.stopPropagation();setSel(c);}}>Open</button>${ctx.canDelete('clients')?html`<button class="mini danger" onClick=${ev=>{ev.stopPropagation();ctx.delRec('clients',c.id,c.brandName||c.name);}}>Delete</button>`:''}</td></tr>`; })}
    ${rows.length===0&&html`<tr><td colspan="9" class="muted" style=${{padding:28,textAlign:'center'}}>No clients match.</td></tr>`}
    </tbody></table></div><//>
    ${sel&&html`<${ClientProfile} ctx=${ctx} client=${sel} ce=${ce} onClose=${()=>setSel(null)} onOpenProject=${p=>{setSel(null);ctx._openProject&&ctx._openProject(p);}}/>`}
  </div>`;
}

function ScopeAccounts({ ctx, c, ce }){
  const scope = c.scope||[]; const accounts = c.accounts||[];
  const [ni,setNi]=useState({item:'',qty:''});
  const [na,setNa]=useState({platform:'',username:'',secret:'',link:''});
  const save=(patch)=>ctx.updateRecord('clients',c.id,patch);
  const addItem=()=>{ if(!ni.item.trim())return; save({scope:[...scope,{id:'sc-'+Math.random().toString(36).slice(2,8),item:ni.item.trim(),qty:ni.qty,done:false}]}); setNi({item:'',qty:''}); };
  const toggleItem=(id)=>{ if(ce) save({scope:scope.map(s=>s.id===id?{...s,done:!s.done}:s)}); };
  const delItem=(id)=>save({scope:scope.filter(s=>s.id!==id)});
  const addAcc=()=>{ if(!na.platform.trim())return; save({accounts:[...accounts,{id:'ac-'+Math.random().toString(36).slice(2,8),...na}]}); setNa({platform:'',username:'',secret:'',link:''}); };
  const delAcc=(id)=>save({accounts:accounts.filter(a=>a.id!==id)});
  const presets=['Account creation','Website','Landing page','Logo','Brand identity','Social posts','Reels / Videos','Ad campaign','Monthly report'];
  const doneCount=scope.filter(s=>s.done).length;
  return html`<div>
    <div class="eyebrow" style=${{marginBottom:8}}>Scope / Deliverables checklist ${scope.length?('· '+doneCount+'/'+scope.length+' done'):''}</div>
    ${scope.length?scope.map(s=>html`<div class="plan-row ${s.done?'done':''}" key=${s.id}>
      <button class="plan-chk ${s.done?'on':''}" onClick=${()=>toggleItem(s.id)}>${s.done?'✓':''}</button>
      <div class="plan-main"><div class="plan-title">${s.item}${s.qty?html` <span class="lime mono">× ${s.qty}</span>`:''}</div></div>
      ${ce?html`<button class="mini danger" onClick=${()=>delItem(s.id)}>Del</button>`:''}
    </div>`):html`<div class="muted" style=${{fontSize:12.5}}>No scope items yet.</div>`}
    ${ce?html`<div class="flex gap8" style=${{marginTop:10,flexWrap:'wrap'}}>
      <input class="sel" style=${{flex:'2 1 160px'}} placeholder="Item (e.g. Account creation)" value=${ni.item} onInput=${e=>setNi({...ni,item:e.target.value})} list="scope-presets"/>
      <datalist id="scope-presets">${presets.map(p=>html`<option key=${p} value=${p}></option>`)}</datalist>
      <input class="sel" type="number" style=${{width:84}} placeholder="Qty" value=${ni.qty} onInput=${e=>setNi({...ni,qty:e.target.value})}/>
      <button class="mini pri" onClick=${addItem}>Add</button></div>`:''}
    <div class="eyebrow" style=${{margin:'18px 0 8px'}}>Accounts & access</div>
    ${accounts.length?accounts.map(a=>html`<div class="lrow" key=${a.id}><div class="li-ic">${React.createElement(Icon.shield)}</div>
      <div class="li-t"><b>${a.platform}</b><span>${a.username||''}${a.secret?(' · '+a.secret):''}</span></div>
      ${a.link?html`<a class="mini" href=${a.link} target="_blank" rel="noopener">Open</a>`:''}${ce?html`<button class="mini danger" onClick=${()=>delAcc(a.id)}>Del</button>`:''}</div>`):html`<div class="muted" style=${{fontSize:12.5}}>No accounts saved.</div>`}
    ${ce?html`<div class="flex gap8" style=${{marginTop:10,flexWrap:'wrap'}}>
      <input class="sel" style=${{flex:'1 1 110px'}} placeholder="Platform" value=${na.platform} onInput=${e=>setNa({...na,platform:e.target.value})}/>
      <input class="sel" style=${{flex:'1 1 110px'}} placeholder="Username" value=${na.username} onInput=${e=>setNa({...na,username:e.target.value})}/>
      <input class="sel" style=${{flex:'1 1 110px'}} placeholder="Password" value=${na.secret} onInput=${e=>setNa({...na,secret:e.target.value})}/>
      <input class="sel" style=${{flex:'1 1 110px'}} placeholder="Link" value=${na.link} onInput=${e=>setNa({...na,link:e.target.value})}/>
      <button class="mini pri" onClick=${addAcc}>Add</button></div>`:''}
    <div class="muted" style=${{fontSize:11,marginTop:8,display:'flex',alignItems:'center',gap:5}}>${React.createElement(Icon.alert,{width:14,height:14,style:{flex:'0 0 auto'}})} Credentials are stored in your database — share access carefully.</div>
  </div>`;
}
function ClientProfile({ ctx, client, ce, onClose }){
  const { db, role } = ctx;
  const c = normalizeClient(byId(db.clients,client.id)||client);
  const seeFin=canSeeFinance(role);
  const TABS=['Overview','Projects','Tasks','Deliverables','Content Calendar', ...(seeFin?['Finance']:[]),'Contracts / Proposals','Scope & Accounts','Meetings','Files','Notes / Activity'];
  const [tab,setTab]=useState('Overview');
  const h=calculateClientHealth(db,c.id);
  const projects=getClientProjects(db,c.id), tasks=getClientTasks(db,c.id), delivs=getClientDeliverables(db,c.id);
  const invoices=(db.invoices||[]).filter(i=>i.clientId===c.id);
  const outstanding=invoices.filter(i=>!/cancel|draft/i.test(i.status||'')).reduce((s,i)=>s+(ctx.invTotal(i)-ctx.invPaid(i)),0);
  const totalPaid=(db.payments||[]).filter(p=>p.clientId===c.id).reduce((s,p)=>s+(+p.amount||0),0);
  const pendingApprovals=delivs.filter(d=>d.status==='Client Review').length;

  return html`<div class="ovl" onClick=${onClose}>
    <div class="modal wide" style=${{width:820,maxWidth:'97vw'}} onClick=${ev=>ev.stopPropagation()}>
      <div class="modal-h" style=${{background:'linear-gradient(160deg,rgba(200,243,30,.10),transparent 60%)'}}>
        <div class="flex center" style=${{gap:14}}><${Avatar} name=${c.brandName||c.name} size=${46}/>
          <div><h3 style=${{fontSize:18}}>${c.brandName||c.name} ${c.priority==='VIP'?html`<span class="lime" style=${{fontSize:12,display:'inline-flex',alignItems:'center',gap:3}}>${React.createElement(Icon.star)} VIP</span>`:''}</h3>
            <div class="muted" style=${{fontSize:12.5,marginTop:2}}>${c.industry||''} · ${c.clientCode}</div></div></div>
        <div class="flex center gap8">${ce&&html`<button class="btn btn-ghost" style=${{padding:'7px 12px'}} onClick=${()=>{onClose();ctx.openModal('clients',c);}}>Edit</button>`}
          <button class="icon-btn" onClick=${onClose}><span style=${{fontSize:18}}>×</span></button></div></div>
      <div class="emp-tabs">${TABS.map(t=>html`<button key=${t} class="emp-tab ${tab===t?'on':''}" onClick=${()=>setTab(t)}>${t}</button>`)}</div>
      <div class="modal-b" style=${{maxHeight:'60vh',overflowY:'auto'}}>
        ${tab==='Overview'&&html`<div>
          <div class="flex" style=${{gap:18,flexWrap:'wrap',marginBottom:18}}>
            ${_stat('Status',c.status)}${_stat('Health',h.label,h.type==='neg'?'var(--neg)':h.type==='warn'?'var(--warn)':'var(--pos)')}
            ${_stat('Active projects',projects.filter(p=>!['Completed','Archived','Cancelled'].includes(p.status)).length)}
            ${_stat('Pending approvals',pendingApprovals,pendingApprovals?'var(--warn)':null)}
            ${seeFin?_stat('Outstanding',money(outstanding),outstanding?'var(--warn)':null):''}</div>
          <div class="grid g-2" style=${{gap:14}}>
            <${Panel} title="Main contact"><div class="muted" style=${{fontSize:13,lineHeight:1.9}}>
              ${c.mainContactName||'—'} · ${c.mainContactRole||''}<br/>
              ${React.createElement(Icon.mail,{style:{width:13,height:13,verticalAlign:'middle',marginRight:6}})}${c.mainContactEmail||'—'}<br/>
              ${React.createElement(Icon.bell,{style:{width:13,height:13,verticalAlign:'middle',marginRight:6}})}${c.mainContactPhone||'—'}${c.mainContactWhatsapp?' · WA '+c.mainContactWhatsapp:''}<br/>
              Channel: ${c.communicationChannel||'—'}</div><//>
            <${Panel} title="Account & contract"><div class="muted" style=${{fontSize:13,lineHeight:1.9}}>
              Account mgr: ${nameById(db.employees,c.accountManagerId)} · PM: ${nameById(db.employees,c.projectManagerId)}<br/>
              Services: ${(Array.isArray(c.serviceIds)&&c.serviceIds.length)?c.serviceIds.map(id=>nameById(db.services,id)).filter(Boolean).join(' · '):(c.serviceType||'—')}<br/>

          </div>
          ${(c.targetAudience||c.brandTone||c.competitors)?html`<div class="panel" style=${{padding:14,marginTop:14}}>
            <div class="eyebrow" style=${{marginBottom:8}}>Brand notes</div>
            <div class="muted" style=${{fontSize:13,lineHeight:1.8}}>

function TasksView({ ctx, visible, ce }){
  const { db, role, user } = ctx;
  const cc = ce && canCreateTasks(role); // only managers / account managers create tasks
  const [view,setView]=useState('All Tasks'); const [layout,setLayout]=useState('board'); const [sel,setSel]=useState(null);
  const all=visible('tasks');
  const wk=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  const VIEWS={
    'My Tasks':t=>t.assignedTo===user.id||t.assignedTo===user.name,
    'All Tasks':()=>true,
    'Today':t=>t.dueDate===todayISO(),
    'This Week':t=>t.dueDate&&t.dueDate>=todayISO()&&t.dueDate<=wk,
    'Overdue':t=>calculateTaskDelay(t).overdue,
    'Internal Review':t=>t.status==='Internal Review',
    'Client Review':t=>t.status==='Client Review',
    'Blocked':t=>t.status==='Blocked',
    'Done':t=>t.status==='Done',
  };
  let rows=all.filter(VIEWS[view]||(()=>true));
  return html`<div class="view">
    <${Head} eyebrow="Delivery" title="Tasks" desc="Drag across the workflow, or open a task for full detail.">
      <select class="sel" value=${view} onChange=${e=>setView(e.target.value)}>${Object.keys(VIEWS).map(v=>html`<option key=${v} value=${v}>${v}</option>`)}</select>
      <div class="seg"><button class=${layout==='board'?'on':''} onClick=${()=>setLayout('board')}>Board</button><button class=${layout==='list'?'on':''} onClick=${()=>setLayout('list')}>List</button></div>
      ${cc&&html`<button class="btn btn-pri" onClick=${()=>ctx.openModal('tasks',{status:'Backlog',priority:'Normal'})}>${React.createElement(Icon.plus)} New task</button>`}<//>
    ${rows.length===0
      ? html`<${EmptyState} icon="check"
          title=${ctx.lang==='ar'?'مفيش تاسكات هنا':'No tasks here'}
          text=${ctx.lang==='ar'?(cc?'مفيش تاسكات في العرض ده. اعمل تاسك جديد أو جرّب عرض تاني.':'مفيش تاسكات متسندة ليك دلوقتي — استنى ما يتسند ليك شغل.'):(cc?'No tasks in this view yet — create one or try another view.':'No tasks assigned to you yet — check back when work is assigned.')}
          actionLabel=${cc?(ctx.lang==='ar'?'تاسك جديد':'New task'):null}
          onAction=${cc?(()=>ctx.openModal('tasks',{status:'Backlog',priority:'Normal'})):null}/>`
      : layout==='board'
      ? html`<${Kanban} items=${rows} columns=${ST.task.filter(s=>s!=='Cancelled')} field="status"
          canMove=${ce}
          onMove=${(id,s)=>ctx.updateRecord('tasks',id,{status:s})} onCard=${t=>setSel(t)}
          render=${t=>{const d=calculateTaskDelay(t);return html`<div style=${{cursor:'pointer'}}>
            <div class="flex between center"><b style=${{fontSize:12.5,fontWeight:600}}>${t.title||t.name}</b>
              ${t.priority==='Urgent'||t.priority==='High'?html`<span class="mono" style=${{fontSize:9.5,color:t.priority==='Urgent'?'var(--neg)':'var(--warn)'}}>${t.priority}</span>`:''}</div>
            <div class="muted" style=${{fontSize:11,marginTop:5}}>${nameById(db.projects,t.projectId)}</div>
            <div class="flex between center" style=${{marginTop:8}}><span class="muted" style=${{fontSize:11}}>${nameById(db.employees,t.assignedTo)}</span>
              ${d.overdue?html`<span class="mono" style=${{fontSize:10,color:'var(--neg)'}}>${d.delayDays}d late</span>`:t.dueDate?html`<span class="muted" style=${{fontSize:10}}>${fmtDate(t.dueDate)}</span>`:''}</div></div>`;}}/>`
      : html`<${DataTable} db=${db} rows=${rows} extraActions=${t=>html`<button class="mini" onClick=${()=>setSel(t)}>Open</button>`}
          canEditFlag=${ce} onDelete=${ce?(r=>{ if(confirm((ctx.lang==='ar'?'حذف هذه المهمة؟':'Delete this task?'))) ctx.deleteRecord('tasks',r.id); }):null}
          cols=${[{k:'title',label:'Task',render:r=>r.title||r.name},{k:'clientId',label:'Client',ref:true,coll:'clients'},{k:'projectId',label:'Project',ref:true,coll:'projects'},{k:'assignedTo',label:'Assignee',ref:true,coll:'employees'},{k:'status',label:'Status',tag:true},{k:'priority',label:'Priority'},{k:'dueDate',label:'Due',render:r=>{const d=calculateTaskDelay(r);return html`<span style=${{color:d.overdue?'var(--neg)':'var(--ink-2)'}}>${fmtDate(r.dueDate)}</span>`;}}]}/>`}
    ${sel&&html`<${TaskDetail} ctx=${ctx} task=${sel} ce=${ce} onClose=${()=>setSel(null)}/>`}
  </div>`;

function TaskDetail({ ctx, task, ce, onClose }){
  const { db, role } = ctx;
  const t = normalizeTask(byId(db.tasks,task.id)||task);
  const [newCheck,setNewCheck]=useState('');
  const delay=calculateTaskDelay(t);
  const upd=(p)=>ctx.updateRecord('tasks',t.id,p);
  const setStatus=(s)=>{ const wasDone=t.status==='Done'; upd({status:s}); ctx.addActivity('tasks',t.id,'status → '+s,t.title); if(s==='Done'&&!wasDone) ctx.awardPoints(POINTS.taskDone,'Task done'); };
  const toggleCheck=(i)=>{ const cl=(t.checklist||[]).map((x,idx)=>idx===i?Object.assign({},x,{done:!x.done}):x); upd({checklist:cl}); };
  const addCheck=()=>{ if(!newCheck)return; upd({checklist:[...(t.checklist||[]),{text:newCheck,done:false}]}); setNewCheck(''); };
  const subtasks=(db.tasks||[]).filter(x=>x.parentTaskId===t.id);
  return html`<div class="ovl" onClick=${onClose}>
    <div class="modal wide" style=${{width:820,maxWidth:'97vw'}} onClick=${ev=>ev.stopPropagation()}>
      <div class="modal-h"><div><h3 style=${{fontSize:17}}>${t.title||t.name}</h3>
        <div class="muted" style=${{fontSize:12,marginTop:2}}>${nameById(db.clients,t.clientId)} · ${nameById(db.projects,t.projectId)} · ${t.taskCode}</div></div>
        <button class="icon-btn" onClick=${onClose}><span style=${{fontSize:18}}>×</span></button></div>
      <div class="modal-b" style=${{maxHeight:'64vh',overflowY:'auto'}}>
        <div class="flex" style=${{gap:18,flexWrap:'wrap',marginBottom:16}}>
          ${_stat('Status',t.status)}${_stat('Priority',t.priority)}${_stat('Assignee',nameById(db.employees,t.assignedTo))}${_stat('Due',fmtDate(t.dueDate),delay.overdue?'var(--neg)':null)}${t.taskType?_stat('Type',t.taskType):''}</div>
        ${ce&&html`<div class="flex gap8" style=${{flexWrap:'wrap',marginBottom:16}}>
          <button class="mini" onClick=${()=>setStatus('In Progress')}>Start</button>
          <button class="mini" onClick=${()=>setStatus('Internal Review')}>→ Internal Review</button>
          <button class="mini" onClick=${()=>setStatus('Client Review')}>→ Client Review</button>
          <button class="mini pri" onClick=${()=>setStatus('Done')}>Mark Done</button>
          <button class="mini" onClick=${()=>setStatus('Blocked')}>Block</button>
          <button class="btn btn-ghost" style=${{padding:'5px 10px'}} onClick=${()=>{onClose();ctx.openModal('tasks',t);}}>Edit all fields</button>
          <button class="btn btn-ghost danger" style=${{padding:'5px 10px'}} onClick=${()=>{ if(confirm((ctx.lang==='ar'?'حذف هذه المهمة نهائيًا؟':'Delete this task permanently?'))){ ctx.deleteRecord('tasks',t.id); onClose(); } }}>${ctx.lang==='ar'?'حذف':'Delete'}</button></div>`}
        ${t.brief?html`<div class="panel" style=${{padding:12,marginBottom:14}}><div class="eyebrow">Brief</div><div style=${{marginTop:6,fontSize:13,lineHeight:1.6,whiteSpace:'pre-wrap'}}>${t.brief}</div></div>`:''}

/* ---------------- Requests / Approvals ---------------- */
function RequestsView({ ctx, visible, ce }){
  const { db, role, user } = ctx;
  const [view,setView]=useState('My Requests'); const [sel,setSel]=useState(null);
  const all=visible('approvalRequests');
  const VIEWS={
    'My Requests':r=>r.requestedBy===user.id,
    'Pending My Approval':r=>r.status==='Pending Approval'&&(aliasRole(role)==='Admin'||r.assignedManagerId===user.id||canApproveRequest(role,r.requestType)),
    'All Requests':()=>['Admin','Project Manager','Accountant','HR','Marketing Director','Art Director'].includes(aliasRole(role)),
    'Approved':r=>r.status==='Approved',
    'Rejected':r=>r.status==='Rejected',
  };
  let rows=all.filter(VIEWS[view]||(()=>true));
  return html`<div class="view">
    <${Head} eyebrow="Operations" title="Requests / Approvals" desc="Submit requests and route them to the right manager.">
      ${ce&&html`<button class="btn btn-pri" onClick=${()=>ctx.openModal('approvalRequests',{priority:'Normal',requestType:'Other'},null,'New request')}>${React.createElement(Icon.plus)} New request</button>`}<//>
    <div style=${{marginBottom:16}}><${QuickTimeOff} ctx=${ctx}/></div>
    <div class="flex gap8" style=${{marginBottom:16,flexWrap:'wrap'}}>
      ${Object.keys(VIEWS).map(v=>html`<button key=${v} class="mini ${view===v?'pri':''}" onClick=${()=>setView(v)}>${v}</button>`)}
      <span class="muted" style=${{fontSize:12,marginLeft:'auto'}}>${rows.length} request(s)</span></div>
    <${DataTable} db=${db} rows=${rows} extraActions=${r=>html`<button class="mini" onClick=${()=>setSel(r)}>Open</button>`}
      cols=${[{k:'requestNumber',label:'#'},{k:'title',label:'Title'},{k:'requestType',label:'Type'},{k:'requestedByName',label:'By'},{k:'assignedManagerName',label:'Manager'},{k:'priority',label:'Priority'},{k:'status',label:'Status',tag:true}]}/>
    ${sel&&html`<${RequestDetail} ctx=${ctx} req=${sel} onClose=${()=>setSel(null)}/>`}
  </div>`;
}
function RequestDetail({ ctx, req, onClose }){
  const { db, role, user } = ctx;
  const r = byId(db.approvalRequests, req.id)||req;
  const [comment,setComment]=useState('');
  const canApr = r.status==='Pending Approval' && (aliasRole(role)==='Admin' || r.assignedManagerId===user.id || canApproveRequest(role,r.requestType));
  return html`<${Modal} title=${r.requestNumber+' · '+r.title} wide=${true} onClose=${onClose}>
    <div class="flex" style=${{gap:18,flexWrap:'wrap',marginBottom:16}}>
      ${_stat('Type',r.requestType)}${_stat('Priority',r.priority)}${_stat('Status',r.status)}${_stat('By',r.requestedByName)}${r.amount?_stat('Amount',money(r.amount)):''}</div>
    ${r.description?html`<div class="panel" style=${{padding:12,marginBottom:12}}><div class="eyebrow">Description</div><div style=${{marginTop:6,fontSize:13}}>${r.description}</div></div>`:''}
    ${r.reason?html`<div class="panel" style=${{padding:12,marginBottom:12}}><div class="eyebrow">Reason</div><div style=${{marginTop:6,fontSize:13}}>${r.reason}</div></div>`:''}
    ${r.managerComment?html`<div class="panel" style=${{padding:12,marginBottom:12}}><div class="eyebrow">Manager comment</div><div style=${{marginTop:6,fontSize:13}}>${r.managerComment}</div></div>`:''}
    ${canApr?html`<div style=${{marginTop:8}}>
      <input class="sel" style=${{width:'100%',marginBottom:10}} placeholder="Manager comment (optional)…" value=${comment} onChange=${e=>setComment(e.target.value)}/>
      <div class="flex gap8">
        <button class="btn btn-pri" onClick=${()=>{ctx.approveRequest(r,comment);onClose();}}>Approve</button>
        <button class="btn btn-ghost" onClick=${()=>{ctx.rejectRequest(r,comment);onClose();}}>Reject</button>
        <button class="btn btn-ghost" onClick=${()=>{ctx.requestChanges(r,comment);onClose();}}>Request changes</button>
      </div></div>`
    : r.status==='Approved'?html`<div class="ok" style=${{fontSize:13}}>Approved ${r.approvedAt?('· '+fmtDateTime(r.approvedAt)):''}</div>`
    : r.status==='Rejected'?html`<div class="neg" style=${{fontSize:13}}>Rejected ${r.rejectedAt?('· '+fmtDateTime(r.rejectedAt)):''}</div>`
    : html`<div class="muted" style=${{fontSize:12}}>Awaiting ${r.assignedManagerName||'manager'} approval.</div>`}
  <//>`;
}

/* ---------------- Chat ---------------- */
function ChatView({ ctx }){
  const { db, role, user } = ctx;
  const channels=[{type:'General',id:'general',label:'General Team'},
    ...(db.projects||[]).slice(0,8).map(p=>({type:'Project',id:p.id,label:'Project · '+(p.projectName||p.name)})),
    ...(db.clients||[]).slice(0,8).map(c=>({type:'Client',id:c.id,label:'Client · '+(c.brandName||c.name)}))];
  const [chan,setChan]=useState(channels[0]); const [msg,setMsg]=useState(''); const [vis,setVis]=useState('Internal Only');
  const all=filterRecordsByRole('chatMessages', db.chatMessages||[], role, user);
  const msgs=all.filter(m=>m.channelType===chan.type && (chan.type==='General'||m.channelId===chan.id));
  const send=()=>{ if(!msg)return;
    const v = role==='Client' ? 'Client Visible' : vis; // clients can only post client-visible, or their msg would be hidden from them
    const extra = chan.type==='Project' ? {projectId:chan.id,clientId:(byId(db.projects,chan.id)||{}).clientId}
      : chan.type==='Client' ? {clientId:chan.id}
      : (role==='Client' ? {clientId:user.clientId} : {});
    ctx.sendChat(chan.type,chan.id,msg,v,extra); setMsg(''); };
  return html`<div class="view">
    <${Head} eyebrow="Operations" title="Chat" desc="Internal team chat + client-visible messages. Live sync: new messages appear automatically every few seconds."/>
    <div style=${{display:'grid',gridTemplateColumns:'240px 1fr',gap:16}}>
      <${Panel} pad=${false}><div style=${{maxHeight:'60vh',overflowY:'auto'}}>
        ${channels.map(ch=>html`<button key=${ch.type+ch.id} class="chan-row ${chan.type===ch.type&&chan.id===ch.id?'on':''}" onClick=${()=>setChan(ch)}>${ch.label}</button>`)}</div><//>
      <${Panel} title=${chan.label} pad=${false}>
        <div style=${{height:'46vh',overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:10}}>
          ${msgs.map(m=>html`<div key=${m.id} class="chat-msg ${m.senderId===user.id?'me':''}">
            <div class="chat-meta"><b>${m.senderName}</b> · ${m.senderRole} ${m.visibility==='Client Visible'?html`<span class="lime">· client-visible</span>`:''} · ${fmtDateTime(m.createdAt)}</div>
            <div class="chat-body">${m.message}</div></div>`)}
          ${msgs.length===0&&html`<div class="muted" style=${{fontSize:12,textAlign:'center',marginTop:20}}>No messages yet.</div>`}
        </div>
        ${role!=='Client'||true?html`<div class="chat-input">
          <input class="sel" style=${{flex:1}} placeholder="Type a message…" value=${msg} onChange=${e=>setMsg(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&send()}/>
          ${role!=='Client'&&html`<select class="sel" value=${vis} onChange=${e=>setVis(e.target.value)}><option>Internal Only</option><option>Client Visible</option></select>`}
          <button class="btn btn-pri" onClick=${send}>Send</button></div>`:''}
      <//>
    </div></div>`;
}

/* ---------------- Share Center ---------------- */
function ShareCenterView({ ctx }){
  const { db } = ctx;
  const [type,setType]=useState('Client Summary'); const [id,setId]=useState((db.clients[0]||{}).id||''); const [text,setText]=useState('');
  const gen=()=>{ let t='';
    if(type==='Client Summary') t=generateClientSummary(db,id);
    else if(type==='Project Summary') t=generateProjectSummary(db,id);
    else if(type==='Asset Checklist') t=generateAssetChecklist(db,id);
    else if(type==='Employee Workload') t=generateEmployeeWorkloadSummary(db);
    setText(t); };
  const idList = type==='Project Summary'? db.projects : db.clients;
  const needsId = type!=='Employee Workload';
  return html`<div class="view">
    <${Head} eyebrow="Operations" title="Share Center" desc="Generate copyable text summaries and printable views to share."/>
    <${Panel}>
      <div class="flex gap8" style=${{flexWrap:'wrap',marginBottom:14}}>
        <select class="sel" value=${type} onChange=${e=>{setType(e.target.value);setText('');}}>
          ${['Client Summary','Project Summary','Asset Checklist','Employee Workload'].map(t=>html`<option key=${t}>${t}</option>`)}</select>
        ${needsId&&html`<select class="sel" value=${id} onChange=${e=>setId(e.target.value)}>${idList.map(r=>html`<option key=${r.id} value=${r.id}>${r.brandName||r.projectName||r.name}</option>`)}</select>`}
        <button class="btn btn-pri" onClick=${gen}>Generate</button>
        ${text&&html`<button class="btn btn-ghost" onClick=${()=>{navigator.clipboard&&navigator.clipboard.writeText(text);alert('Copied.');}}>Copy</button>`}
        ${text&&html`<button class="btn btn-ghost" onClick=${()=>{const w=window.open('','_blank');w.document.write('<pre style="font-family:monospace;padding:30px;font-size:13px;line-height:1.7">'+text.replace(/</g,'&lt;')+'</pre>');w.document.close();w.print&&setTimeout(()=>w.print(),200);}}>Print</button>`}
      </div>
      ${text?html`<pre class="doc-preview">${text}</pre>`:html`<div class="muted" style=${{fontSize:13}}>Pick a type and click Generate.</div>`}
    <//></div>`;
}

    <//>

      <div class="flex gap8 center">
        <button class="mini" onClick=${()=>view==='day'?shiftDay(-1):shiftMonth(-1)}>‹ ${TT('Previous')}</button>

  const recordCount=COLLECTIONS.reduce((s,c)=>s+(db[c]||[]).length,0);
  return html`<div class="view">
    <${Head} eyebrow="System" title="Backup Center" desc="Protect your data with local snapshots, file exports, and cloud sync."/>
    <div class="grid g-4 stagger" style=${{marginBottom:18}}>
      <${KPI} label="Total records" value=${recordCount} icon="grid"/>
      <${KPI} label="Restore points" value=${snaps.length+'/7'} icon="refresh"/>
      <${KPI} label="Last snapshot" value=${lastSnap==='Never'?'Never':'Saved'} sub=${lastSnap} icon="clock"/>

    </div>
    <div class="grid g-2 stagger">

/* ---------------- Login placeholder ---------------- */
function LoginScreen({ onLogin, lang, applyAppSettings }){
  const ar=lang==='ar';
  const [id,setId]=useState(''); const [pw,setPw]=useState(''); const [show,setShow]=useState(false);
  const [remember,setRemember]=useState(true); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const submit=async()=>{ setErr(''); if(!id||!pw){ setErr(ar?'أدخل البريد وكلمة المرور.':'Enter your email/username and password.'); return; }
    setBusy(true); const reason=await onLogin(id,pw,remember); setBusy(false);
    if(reason==='inactive') setErr(ar?'الحساب غير نشط. يرجى التواصل مع مالك النظام.':'Your account is inactive. Please contact the system owner.');
    else if(reason) setErr(ar?'بيانات الدخول غير صحيحة.':'Invalid username/email or password.'); };
  const forgot=async()=>{
    const who=(id||window.prompt(ar?'اكتب بريدك الإلكتروني أو اسم المستخدم':'Enter your email or username')||'').trim();
    if(!who){ return; }
    setErr(''); setBusy(true);
    try {
      const cfg=getCfg(); let handled=false;
      // PRIMARY: server-side reset (works even when _accounts is locked to anon).
      if(cfg&&cfg.url&&cfg.key){ try { const r=await acctApi(cfg,'forgot',{ identifier:who }); if(r&&r.ok) handled=true; } catch(e){} }
      if(!handled){
        // FALLBACK (function unreachable): legacy client-side reset.
        await AUTH.syncUsersFromCloud().catch(()=>{});
        const u=(AUTH.loadUsers()||[]).find(x=>(x.email||'').toLowerCase()===who.toLowerCase()||(x.username||'').toLowerCase()===who.toLowerCase());
        if(u && u.email){
          const temp=randToken(5);
          await sendEmail({ to:u.email, subject:(ar?'كلمة مرور مؤقتة — Magnet OS':'Your temporary password — Magnet OS'),
            text:(ar?'كلمة المرور المؤقتة الخاصة بك هي: ':'Your temporary password is: ')+temp+'\n'+location.origin+'\n'+(ar?'يُرجى تغييرها بعد الدخول من الملف الشخصي.':'Please change it after signing in (Profile).') });
          u.passwordHash=await AUTH.hashPassword(temp); u.isDefaultPassword=true;
          AUTH.saveUsers(AUTH.loadUsers().map(x=>x.id===u.id?u:x));
        }
      }
      window.alert(ar?'لو الحساب موجود، تم إرسال كلمة مرور مؤقتة على البريد.':'If the account exists, a temporary password has been emailed.');
    } catch(e){ setErr((ar?'تعذّر الإرسال: ':'Could not send: ')+e.message); }
    setBusy(false);
  };
  return html`<div class="login-screen" dir=${ar?'rtl':'ltr'}>
    <div class="login-card">
      <img src="/magnet-logo.png" alt="Magnet" style=${{height:46,display:'block',margin:'0 auto 18px'}}/>
      <div style=${{textAlign:'center',marginBottom:4,fontFamily:'var(--display)',fontWeight:700,fontSize:18}}>Magnet OS</div>
      <div class="muted" style=${{textAlign:'center',fontSize:12.5,marginBottom:22}}>${ar?'نظام تشغيل الوكالة الداخلي':'Internal agency operating system'}</div>
      <label class="fld" style=${{marginBottom:12}}><span>${ar?'البريد الإلكتروني أو اسم المستخدم':'Email or username'}</span>
        <input value=${id} onChange=${e=>setId(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&submit()} placeholder="owner" autoComplete="username"/></label>
      <label class="fld" style=${{marginBottom:14}}><span>${ar?'كلمة المرور':'Password'}</span>
        <div style=${{position:'relative'}}>
          <input type=${show?'text':'password'} value=${pw} onChange=${e=>setPw(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&submit()} placeholder="********" autoComplete="current-password" style=${{width:'100%'}}/>
          <button type="button" class="pw-toggle" onClick=${()=>setShow(s=>!s)}>${show?(ar?'إخفاء':'Hide'):(ar?'إظهار':'Show')}</button>
        </div></label>
      <div class="flex between center" style=${{marginBottom:16}}>
        <label class="flex center" style=${{gap:8,fontSize:12.5,cursor:'pointer',color:'var(--ink-2)'}}>
          <input type="checkbox" checked=${remember} onChange=${e=>setRemember(e.target.checked)}/>${ar?'تذكرني':'Remember me'}</label>
        <button type="button" class="link-btn" disabled=${busy} onClick=${forgot}>${ar?'نسيت كلمة المرور؟':'Forgot password?'}</button>
      </div>
      ${err&&html`<div class="login-err">${err}</div>`}
      <button class="btn btn-pri" style=${{width:'100%',justifyContent:'center'}} disabled=${busy} onClick=${submit}>${busy?(ar?'جارٍ الدخول...':'Signing in...'):(ar?'تسجيل الدخول':'Login')}</button>
      <div class="flex center" style=${{justifyContent:'center',gap:10,marginTop:16}}>
        <button class="link-btn" onClick=${()=>applyAppSettings({language:ar?'en':'ar'})}>${ar?'English':'العربية'}</button>
      </div>
      <div class="muted" style=${{fontSize:10.5,textAlign:'center',marginTop:14,lineHeight:1.6}}>${ar?'إصدار محلي للاختبار الداخلي. للاستخدام الإنتاجي اربط النظام بقاعدة بيانات آمنة.':'Local/demo authentication for internal testing. Connect a secure backend for production.'}</div>
    </div></div>`;
}

/* ---------------- Profile modal (self-service) ---------------- */
function ProfileModal({ authUser, lang, onClose, onChanged }){
  const ar=lang==='ar'; const [tab,setTab]=useState('profile');
  const [cur,setCur]=useState(''); const [np,setNp]=useState(''); const [cp,setCp]=useState(''); const [msg,setMsg]=useState('');
  const [avatar,setAvatar]=useState(authUser.avatar||''); const [bio,setBio]=useState(authUser.bio||'');
  const onPickAvatar=(file)=>{ if(!file) return; const reader=new FileReader();
    reader.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=256; let w=img.width,h=img.height; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      let q=0.82, data=cv.toDataURL('image/jpeg',q); while(data.length>60000 && q>0.4){ q-=0.1; data=cv.toDataURL('image/jpeg',q); } setAvatar(data); }; img.src=reader.result; };
    reader.readAsDataURL(file); };
  const saveProfile=()=>{ const list=AUTH.loadUsers(); const u=list.find(x=>x.id===authUser.id); if(!u) return;
    u.avatar=avatar||''; u.bio=bio||''; AUTH.saveUsers(list.map(x=>x.id===u.id?u:x));
    try{ AUTH.setSessionUser(u, true); }catch(e){} if(onChanged) onChanged(u);
    setMsg(ar?'تم حفظ البروفايل.':'Profile saved.'); showProPopup('savedNotes'); };
  const changePw=async()=>{ setMsg('');
    const u=AUTH.loadUsers().find(x=>x.id===authUser.id); if(!u) return;
    const v=AUTH.validatePassword(np,cp); if(v){ setMsg(v); return; }
    const okMsg=ar?'تم تغيير كلمة المرور بنجاح.':'Password changed successfully.';
    const badMsg=ar?'كلمة المرور الحالية غير صحيحة.':'Current password is incorrect.';
    const cfg=getCfg();
    // PRIMARY: server verifies current + stores new hash (hash never leaves the server).
    if(cfg&&cfg.url&&cfg.key){
      try {
        // Send the plaintext new password over HTTPS; the server hashes it (PBKDF2)
        // and stores it. The browser never computes or sends a password hash, so a
        // crafted request can't inject an arbitrary stored hash.
        const r=await acctApi(cfg,'changepw',{ token:getAcctToken(), currentPassword:cur, newPassword:np });
        if(r&&r.ok){ u.isDefaultPassword=false; setCur('');setNp('');setCp(''); setMsg(okMsg); showProPopup('savedNotes'); return; }
        if(r&&r.reason==='bad-current'){ setMsg(badMsg); return; }
      } catch(e){ /* unreachable -> legacy fallback */ }
    }
    // FALLBACK (function unreachable): legacy local change.
    if(!(await AUTH.verifyPassword(cur,u.passwordHash))){ setMsg(badMsg); return; }
    u.passwordHash=await AUTH.hashPassword(np); u.isDefaultPassword=false;
    AUTH.saveUsers(AUTH.loadUsers().map(x=>x.id===u.id?u:x));
    setCur('');setNp('');setCp(''); setMsg(okMsg); showProPopup('savedNotes'); };
  return html`<${Modal} title=${ar?'الملف الشخصي':'Profile'} onClose=${onClose}>
    <div class="emp-tabs" style=${{margin:'0 -22px 16px'}}>
      <button class="emp-tab ${tab==='profile'?'on':''}" onClick=${()=>setTab('profile')}>${ar?'الحساب':'Account'}</button>
      <button class="emp-tab ${tab==='pw'?'on':''}" onClick=${()=>setTab('pw')}>${ar?'تغيير كلمة المرور':'Change Password'}</button>
    </div>
    ${tab==='profile'?html`<div>
      <div class="prof-edit">
        <${Avatar} name=${authUser.fullName} size=${72} src=${avatar}/>
        <div class="prof-edit-actions">
          <label class="btn btn-pri" style=${{cursor:'pointer'}}>${ar?'رفع صورة':'Upload photo'}<input type="file" accept="image/*" style=${{display:'none'}} onChange=${e=>onPickAvatar(e.target.files&&e.target.files[0])}/></label>
          ${avatar&&html`<button class="btn btn-ghost" onClick=${()=>setAvatar('')}>${ar?'إزالة':'Remove'}</button>`}
        </div>
      </div>
      <label class="fld" style=${{margin:'14px 0 12px'}}><span>${ar?'تعريف شخصي / نبذة':'About me / bio'}</span><textarea rows=${3} value=${bio} onChange=${e=>setBio(e.target.value)} placeholder=${ar?'اكتب نبذة عنك ودورك في الفريق…':'Tell the team about yourself and your role…'}></textarea></label>
      ${msg&&html`<div class=${/saved|حفظ/.test(msg)?'ok':'neg'} style=${{fontSize:12.5,marginBottom:10}}>${msg}</div>`}
      <button class="btn btn-pri" onClick=${saveProfile}>${ar?'حفظ البروفايل':'Save profile'}</button>
      <div class="muted" style=${{fontSize:13,lineHeight:2,marginTop:16,borderTop:'1px solid var(--line)',paddingTop:12}}>
        <div><b style=${{color:'var(--ink)'}}>${authUser.fullName}</b></div>
        <div>${ar?'البريد:':'Email:'} ${authUser.email}</div>
        <div>${ar?'اسم المستخدم:':'Username:'} ${authUser.username}</div>
        <div>${ar?'الدور:':'Role:'} <${Tag}>${authUser.role}<//></div>
        <div>${ar?'المسمى:':'Job title:'} ${authUser.jobTitle||'—'}</div>
        <div>${ar?'آخر دخول:':'Last login:'} ${authUser.lastLogin?fmtDateTime(authUser.lastLogin):'—'}</div>
        <div class="muted" style=${{fontSize:11.5,marginTop:10}}>${ar?'لا يمكنك تغيير دورك أو صلاحياتك. يتولى ذلك المالك/المدير.':'You cannot change your own role or permissions. Only the Owner/Admin can.'}</div>
      </div>
    </div>`:html`<div>
      <label class="fld" style=${{marginBottom:10}}><span>${ar?'كلمة المرور الحالية':'Current password'}</span><input type="password" value=${cur} onChange=${e=>setCur(e.target.value)}/></label>
      <label class="fld" style=${{marginBottom:10}}><span>${ar?'كلمة المرور الجديدة':'New password'}</span><input type="password" value=${np} onChange=${e=>setNp(e.target.value)}/></label>
      <label class="fld" style=${{marginBottom:12}}><span>${ar?'تأكيد كلمة المرور':'Confirm password'}</span><input type="password" value=${cp} onChange=${e=>setCp(e.target.value)}/></label>
      ${msg&&html`<div class=${/success|نجاح/.test(msg)?'ok':'neg'} style=${{fontSize:12.5,marginBottom:12}}>${msg}</div>`}
      <button class="btn btn-pri" onClick=${changePw}>${ar?'تغيير كلمة المرور':'Change Password'}</button>
    </div>`}
  <//>`;
}

    if(!editing) return;

function UsersView({ ctx }){
  const ar=ctx.lang==='ar';

  const [access,setAccess]=useState(null); // user whose per-module access is being edited
  const saveAccess=(acc)=>{ const list=AUTH.loadUsers(); const tu=list.find(x=>x.id===access.id); if(tu){ tu.access=acc; AUTH.saveUsers(list.map(x=>x.id===tu.id?tu:x)); ctx.addActivity('users',tu.id,'access updated',tu.fullName); } refresh(); setAccess(null); showProPopup('savedNotes', ar?'تم حفظ الصلاحيات':'Access saved'); };
  const refresh=()=>setUsers(AUTH.loadUsers());
  // Pull the full team roster from the cloud on open (token-gated Edge Function),
  // so ALL users show immediately without a manual refresh.
  useEffect(()=>{ let alive=true; AUTH.syncUsersFromCloud().then(()=>{ if(alive) setUsers(AUTH.loadUsers()); }).catch(()=>{}); return ()=>{ alive=false; }; }, []); // eslint-disable-line
  const anyDefault=users.some(u=>u.isDefaultPassword);
  const verifyLink=(tok)=>{ try { return location.origin+location.pathname+'?verify='+encodeURIComponent(tok); } catch(e){ return '?verify='+tok; } };
  const sendVerify=async(u, silent)=>{
    const list=AUTH.loadUsers(); const tu=list.find(x=>x.id===u.id)||u;
    let tok=tu.verifyToken; if(!tok){ tok='vt-'+randToken(18); tu.verifyToken=tok; tu.verified=false; AUTH.saveUsers(list.map(x=>x.id===tu.id?tu:x)); refresh(); }
    const link=verifyLink(tok);
    const body='<div style="font-family:Arial,sans-serif;max-width:480px;margin:auto"><h2 style="color:#0a0a0a">Verify your Magnet OS account</h2><p>Hi '+(tu.fullName||'')+', please confirm your email to activate your account.</p><p style="margin:22px 0"><a href="'+link+'" style="background:#C4FF3D;color:#0a0a0a;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:700">Verify my email</a></p><p style="color:#666;font-size:13px">Or open this link:<br>'+link+'</p></div>';
    try { await sendEmail({to:tu.email, subject:'Verify your Magnet OS account', html:body}); if(!silent) showProPopup('savedNotes', ar?'تم إرسال رابط التأكيد':'Verification email sent'); }
    catch(e){ if(!silent){ try{ navigator.clipboard.writeText(link); }catch(_){ } alert((ar?'خدمة الإيميل غير مفعّلة على هذا الرابط. تم نسخ رابط التأكيد — ابعته يدويًا:\n\n':'Email service not active on this host. Verification link copied — send it manually:\n\n')+link); } }
  };
  const requireVer = !!ctx.appSettings.requireVerification;
  const save=async(form)=>{
    const list=AUTH.loadUsers();
    const v=AUTH.validatePassword(form._pw||'x'.repeat(6), form._pw2!=null?form._pw2:(form._pw||'x'.repeat(6)));
    if(form.id){ // edit existing (no password here)
      const u=list.find(x=>x.id===form.id); Object.assign(u,{ fullName:form.fullName,username:form.username,email:form.email,phone:form.phone,jobTitle:form.jobTitle,role:form.role,status:form.status });
      AUTH.saveUsers(list.map(x=>x.id===u.id?u:x)); ctx.addActivity('users',u.id,'user updated',u.fullName);
    } else { // create new — requires password
      if(!form.fullName||!form.username||!form.email){ alert(ar?'الاسم واسم المستخدم والبريد مطلوبة.':'Name, username, and email are required.'); return; }
      if(v){ alert(v); return; }
      const u={ id:uid('usr'), fullName:form.fullName,username:form.username,email:form.email,phone:form.phone||'',jobTitle:form.jobTitle||'',role:form.role||'Viewer',status:form.status||'Active',
        passwordHash:await AUTH.hashPassword(form._pw), assignedClients:[],assignedTasks:[],dataScope:'assigned',createdAt:nowISO(),lastLogin:'',isDefaultPassword:false,
        verified:false, verifyToken:'vt-'+randToken(18) };
      AUTH.saveUsers([...list,u]); ctx.addActivity('users',u.id,'user created',u.fullName);
      try { await sendVerify(u, true); } catch(e){}
    }
    refresh(); setEdit(null); showProPopup('taskCreated', ar?'تم حفظ المستخدم':'User saved');
  };
  const doReset=async(form)=>{ const v=AUTH.validatePassword(form._pw,form._pw2); if(v){ alert(v); return; }

    setReset(null); showProPopup('savedNotes', ar?'تمت إعادة التعيين':'Password reset'); };

      <td class="right cell-actions">
        <button class="mini" onClick=${()=>setEdit(u)}>${ar?'تعديل':'Edit'}</button>
        <button class="mini" onClick=${()=>setReset(u)}>${ar?'إعادة كلمة المرور':'Reset Password'}</button>
        ${u.role!=='Owner'&&html`<button class="mini" onClick=${()=>setAccess(u)}>${ar?'الصلاحيات':'Access'}</button>`}
        ${u.role!=='Owner'&&!u.verified&&html`<button class="mini" onClick=${()=>sendVerify(u)}>${ar?'إرسال تأكيد':'Verify email'}</button>`}
        <button class="mini" onClick=${()=>toggleStatus(u)}>${u.status==='Active'?(ar?'إيقاف':'Deactivate'):(ar?'تفعيل':'Activate')}</button>
        <button class="mini" onClick=${()=>del(u)}>${ar?'حذف':'Delete'}</button>
      </td></tr>`)}</tbody></table></div><//>
    <div class="muted" style=${{fontSize:11.5,marginTop:12}}>${ar?'هذا الإصدار يخزّن البيانات محليًا للاختبار فقط. للاستخدام الفعلي اربط النظام بـ Supabase أو Firebase أو خادم آمن.':'This version uses frontend/localStorage authentication for demo and internal testing only. For real multi-user production use, connect to Supabase, Firebase, or a secure backend.'}</div>

    ${edit&&html`<${UserForm} user=${edit} ar=${ar} onClose=${()=>setEdit(null)} onSave=${save}/>`}
    ${reset&&html`<${PwResetForm} user=${reset} ar=${ar} onClose=${()=>setReset(null)} onSave=${doReset}/>`}
    ${access&&html`<${AccessDrawer} user=${access} ar=${ar} onClose=${()=>setAccess(null)} onSave=${saveAccess}/>`}
  </div>`;
}
function UserForm({ user, ar, onClose, onSave }){
  const [f,setF]=useState(Object.assign({},user)); const set=(k,v)=>setF(Object.assign({},f,{[k]:v}));
  const isNew=!user.id;
  return html`<${Modal} title=${isNew?(ar?'إنشاء مستخدم':'Create User'):(ar?'تعديل مستخدم':'Edit User')} onClose=${onClose}>
    <div class="form-grid">
      <label class="fld"><span>${ar?'الاسم الكامل':'Full name'}</span><input value=${f.fullName||''} onChange=${e=>set('fullName',e.target.value)}/></label>
      <label class="fld"><span>${ar?'اسم المستخدم':'Username'}</span><input value=${f.username||''} onChange=${e=>set('username',e.target.value)}/></label>
      <label class="fld"><span>${ar?'البريد':'Email'}</span><input type="email" value=${f.email||''} onChange=${e=>set('email',e.target.value)}/></label>
      <label class="fld"><span>${ar?'الهاتف':'Phone'}</span><input value=${f.phone||''} onChange=${e=>set('phone',e.target.value)}/></label>
      <label class="fld"><span>${ar?'المسمى الوظيفي':'Job title'}</span><input value=${f.jobTitle||''} onChange=${e=>set('jobTitle',e.target.value)}/></label>
      <label class="fld"><span>${ar?'الدور':'Role'}</span><select value=${f.role||'Creative'} onChange=${e=>set('role',e.target.value)}>${roleOptions(f.role).map(r=>html`<option key=${r} value=${r}>${r}</option>`)}</select></label>
      <label class="fld"><span>${ar?'الحالة':'Status'}</span><select value=${f.status||'Active'} onChange=${e=>set('status',e.target.value)}><option>Active</option><option>Inactive</option></select></label>
      ${isNew&&html`<label class="fld"><span>${ar?'كلمة المرور':'Password'}</span><input type="password" value=${f._pw||''} onChange=${e=>set('_pw',e.target.value)}/></label>`}
      ${isNew&&html`<label class="fld"><span>${ar?'تأكيد كلمة المرور':'Confirm password'}</span><input type="password" value=${f._pw2||''} onChange=${e=>set('_pw2',e.target.value)}/></label>`}
    </div>
    <div class="form-foot"><button class="btn btn-ghost" onClick=${onClose}>${ar?'إلغاء':'Cancel'}</button><button class="btn btn-pri" onClick=${()=>onSave(f)}>${ar?'حفظ':'Save'}</button></div>
  <//>`;
}
function PwResetForm({ user, ar, onClose, onSave }){
  const [f,setF]=useState({}); const set=(k,v)=>setF(Object.assign({},f,{[k]:v}));
  return html`<${Modal} title=${(ar?'إعادة تعيين كلمة المرور — ':'Reset Password — ')+user.fullName} onClose=${onClose}>
    <label class="fld" style=${{marginBottom:10}}><span>${ar?'كلمة المرور الجديدة':'New password'}</span><input type="password" value=${f._pw||''} onChange=${e=>set('_pw',e.target.value)}/></label>
    <label class="fld" style=${{marginBottom:12}}><span>${ar?'تأكيد كلمة المرور':'Confirm password'}</span><input type="password" value=${f._pw2||''} onChange=${e=>set('_pw2',e.target.value)}/></label>
    <div class="muted" style=${{fontSize:11.5,marginBottom:12}}>${ar?'لا يؤثر هذا على بيانات المستخدم الأخرى.':'This does not change any other user data.'}</div>
    <div class="form-foot"><button class="btn btn-ghost" onClick=${onClose}>${ar?'إلغاء':'Cancel'}</button><button class="btn btn-pri" onClick=${()=>onSave(f)}>${ar?'إعادة التعيين':'Reset'}</button></div>
  <//>`;
}

/* ============================ MOUNT ============================ */
/* ---------------- Teams ---------------- */
function TeamsView({ ctx }){
  const { db, role, user } = ctx; const ar=ctx.lang==='ar';
  const TT=(en)=>t(en)!==en?t(en):en;
  const [sel,setSel]=useState(null);
  const ce = role==='Owner'||aliasRole(role)==='Admin'||role==='Manager'||aliasRole(role)==='Project Manager';
  // visibility: Owner/Manager see all; others see their own teams
  let teams=(db.teams||[]);
  if(!(role==='Owner'||aliasRole(role)==='Admin'||role==='Manager')) teams=userTeams(db,user.id);
  return html`<div class="view">
    <${Head} eyebrow=${t('Team / HR')} title=${TT('Teams')} desc=${ar?'الفرق والأقسام، أعضاؤها وعملاؤها ومهامها.':'Teams and departments — members, clients, tasks and workload.'}>
      ${ce&&html`<button class="btn btn-pri" onClick=${()=>ctx.openModal('teams',{status:'Active',type:'Creative',color:TEAM_COLORS[0]},null,TT('Add Team'))}>${React.createElement(Icon.plus)} ${TT('Add Team')}</button>`}
    <//>
    ${teams.length===0?html`<${Panel}><${EmptyState} title=${TT('No teams yet')} text=${TT('Create your first team')} icon="people" actionLabel=${ce?TT('Add Team'):''} onAction=${ce?()=>ctx.openModal('teams',{status:'Active',type:'Creative',color:TEAM_COLORS[0]}):null}/><//>`
    : html`<div class="teams-grid">${teams.map(tm=>{ const m=teamMetrics(db,tm.id); const ws=workloadStatus(m.pct);
      return html`<div class="team-card" key=${tm.id} style=${{borderTopColor:tm.color||'var(--lime)'}}>
        <div class="flex between center">
          <div><b style=${{fontSize:15,fontFamily:'var(--display)'}}>${tm.name}</b>
            <div class="muted" style=${{fontSize:12,marginTop:2}}>${TT(tm.type||'')}</div></div>
          <${Tag} type=${tm.status==='Active'?'ok':'neg'}>${TT(tm.status||'Active')}<//></div>
        <div class="muted" style=${{fontSize:12.5,margin:'10px 0'}}>${ar?'القائد:':'Lead:'} ${nameById(db.employees,tm.teamLeadId)}</div>
        <div class="team-stats">
          <div><b>${m.members}</b><span>${TT('Members')}</span></div>
          <div><b>${m.clients}</b><span>${TT('Assigned Clients')}</span></div>
          <div><b>${m.active}</b><span>${TT('Active tasks')}</span></div>
          <div><b style=${{color:m.overdue?'var(--neg)':'var(--ink)'}}>${m.overdue}</b><span>${TT('Overdue tasks')}</span></div>
        </div>
        <div class="flex center" style=${{gap:8,margin:'10px 0'}}>
          <div class="meter" style=${{flex:1}}><i style=${{width:Math.min(100,m.pct)+'%',background:m.pct>100?'var(--neg)':'linear-gradient(90deg,var(--lime-deep),var(--lime))'}}></i></div>
          <${Tag} type=${ws.type}>${TT(ws.label)}<//></div>
        <div class="flex gap8" style=${{flexWrap:'wrap'}}>
          <button class="mini pri" onClick=${()=>setSel(tm)}>${TT('Open Team')}</button>
          ${ce&&html`<button class="mini" onClick=${()=>ctx.openModal('teams',tm)}>${TT('Edit')}</button>`}
          ${ce&&(role==='Owner'||aliasRole(role)==='Admin')&&html`<button class="mini" onClick=${()=>{ if(teamClients(db,tm.id).length||teamTasks(db,tm.id).length){ alert(ar?'أعد إسناد العملاء والمهام أولاً.':'Reassign clients and tasks first.'); return;} if(confirm(ar?'أرشفة الفريق؟':'Archive this team?')) ctx.updateRecord('teams',tm.id,{status:'Inactive'}); }}>${TT('Archive Team')}</button>`}
        </div>
      </div>`; })}</div>`}
    ${sel&&html`<${TeamProfile} ctx=${ctx} team=${sel} ce=${ce} onClose=${()=>setSel(null)}/>`}
  </div>`;
}
function TeamProfile({ ctx, team, ce, onClose }){
  const { db, role } = ctx; const ar=ctx.lang==='ar';
  const TT=(en)=>t(en)!==en?t(en):en;
  const tm=byId(db.teams,team.id)||team;
  const TABS=['Overview','Members','Clients','Tasks','Content Calendar','Activity'];
  const [tab,setTab]=useState('Overview');
  const [addMem,setAddMem]=useState(null);     // {employeeId, teamRole} when adding
  const [assignCl,setAssignCl]=useState(null); // array of client ids when assigning
  const m=teamMetrics(db,tm.id); const members=teamMembers(db,tm.id); const clients=teamClients(db,tm.id); const tasks=teamTasks(db,tm.id);
  const _st=(l,v,c)=>html`<div style=${{flex:1,minWidth:110}}><div class="eyebrow">${l}</div><div style=${{fontFamily:'var(--display)',fontWeight:700,fontSize:18,marginTop:5,color:c||'var(--ink)'}}>${v}</div></div>`;
  // team-role stored per user in tm.memberRoles[userId]
  const memberRole=(uid)=> (tm.memberRoles||{})[uid] || (uid===tm.teamLeadId?'Team Lead':'Member');

  const saveMember=()=>{ if(!addMem||!addMem.employeeId) return; const mem=new Set(tm.members||[]); mem.add(addMem.employeeId);
    const roles=Object.assign({},tm.memberRoles||{}); roles[addMem.employeeId]=addMem.teamRole||'Member';
    ctx.updateRecord('teams',tm.id,{members:[...mem],memberRoles:roles}); ctx.addActivity('teams',tm.id,'member added',nameById(db.employees,addMem.employeeId));
    ctx.addNotification(addMem.employeeId,ar?'تمت إضافتك لفريق':'Added to a team',tm.name,'teams',tm.id); setAddMem(null); };
  const removeMember=(uid)=>{ if(uid===tm.teamLeadId){ alert(ar?'اختر قائداً جديداً أولاً.':'Select a new team lead first.'); return; }
    if(!confirm(ar?'إزالة العضو؟':'Remove this member?')) return;
    const mem=(tm.members||[]).filter(x=>x!==uid); const roles=Object.assign({},tm.memberRoles||{}); delete roles[uid];
    ctx.updateRecord('teams',tm.id,{members:mem,memberRoles:roles}); ctx.addActivity('teams',tm.id,'member removed',nameById(db.employees,uid)); };
  const setLead=(uid)=>{ const mem=new Set(tm.members||[]); mem.add(uid); ctx.updateRecord('teams',tm.id,{teamLeadId:uid,members:[...mem]}); ctx.addActivity('teams',tm.id,'team lead set',nameById(db.employees,uid)); };
  const setMemberRole=(uid,r)=>{ const roles=Object.assign({},tm.memberRoles||{}); roles[uid]=r; ctx.updateRecord('teams',tm.id,{memberRoles:roles}); };
  const doAssignClients=()=>{ const next=Array.from(new Set([...(tm.assignedClients||[]),...(assignCl||[])]));
    const updated=Object.assign({},tm,{assignedClients:next}); ctx.updateRecord('teams',tm.id,{assignedClients:next}); ctx.syncTeam(updated,tm); setAssignCl(null); };
  const unassignClient=(cid)=>{ const next=(tm.assignedClients||[]).filter(x=>x!==cid); const updated=Object.assign({},tm,{assignedClients:next});
    ctx.updateRecord('teams',tm.id,{assignedClients:next}); ctx.syncTeam(updated,tm); };
  const createTeamTask=()=>{ ctx.openModal('tasks',{assignedTeamId:tm.id,teamId:tm.id,status:'New',priority:'Normal'},null,TT('Create Team Task')); onClose(); };

  return html`<div class="ovl" onClick=${onClose}>
    <div class="modal wide" style=${{width:840,maxWidth:'97vw'}} onClick=${e=>e.stopPropagation()}>
      <div class="modal-h" style=${{borderTop:'3px solid '+(tm.color||'var(--lime)')}}>
        <div><h3 style=${{fontSize:18}}>${tm.name}</h3><div class="muted" style=${{fontSize:12.5,marginTop:2}}>${TT(tm.type||'')}${tm.department?' · '+TT(tm.department):''} · ${ar?'القائد':'Lead'}: ${nameById(db.employees,tm.teamLeadId)}</div></div>
        <button class="icon-btn" onClick=${onClose}><span style=${{fontSize:18}}>×</span></button></div>
      ${ce&&html`<div class="flex gap8" style=${{padding:'10px 22px',borderBottom:'1px solid var(--line)',flexWrap:'wrap'}}>
        <button class="mini pri" onClick=${()=>setAddMem({teamRole:'Member'})}>${TT('Add Member')}</button>
        <button class="mini" onClick=${()=>setAssignCl([])}>${TT('Assign Clients')}</button>
        <button class="mini" onClick=${createTeamTask}>${TT('Create Team Task')}</button>
        <button class="mini" onClick=${()=>{onClose();ctx.openModal('teams',tm);}}>${TT('Edit Team')}</button>
        ${(role==='Owner'||aliasRole(role)==='Admin')&&html`<button class="mini" onClick=${()=>{ if(clients.length||tasks.length){alert(ar?'أعد الإسناد أولاً.':'Reassign clients/tasks first.');return;} if(confirm(ar?'أرشفة؟':'Archive?')){ctx.updateRecord('teams',tm.id,{status:'Inactive'});onClose();} }}>${TT('Archive Team')}</button>`}
      </div>`}
      <div class="emp-tabs">${TABS.map(tb=>html`<button key=${tb} class="emp-tab ${tab===tb?'on':''}" onClick=${()=>setTab(tb)}>${TT(tb)}</button>`)}</div>
      <div class="modal-b" style=${{maxHeight:'56vh',overflowY:'auto'}}>
        ${tab==='Overview'&&html`<div>
          <div class="flex" style=${{gap:18,flexWrap:'wrap',marginBottom:16}}>
            ${_st(TT('Members'),m.members)}${_st(TT('Assigned Clients'),m.clients)}${_st(TT('Active tasks'),m.active)}${_st(TT('Overdue tasks'),m.overdue,m.overdue?'var(--neg)':null)}${_st(TT('Team Workload'),m.pct+'%','var(--lime)')}</div>
          ${tm.description?html`<div class="panel" style=${{padding:12}}><div class="eyebrow">${TT('Description')}</div><div style=${{marginTop:6,fontSize:13}}>${tm.description}</div></div>`:''}
        </div>`}

        ${tab==='Members'&&html`<div>
          ${members.length===0?html`<${EmptyState} title=${TT('Members')} text=${TT('Add Member')} icon="people"/>`
          : html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${TT('Name')}</th><th>${TT('Job Title')||'Title'}</th><th>${TT('Team Role')}</th><th class="right">${TT('Active tasks')}</th>${ce?html`<th></th>`:null}</tr></thead>
            <tbody>${members.map(mem=>{ const active=(db.tasks||[]).filter(t=>t.assignedTo===mem.id&&!['Done','Delivered','Approved','Cancelled'].includes(t.status)).length;
              return html`<tr key=${mem.id}>
                <td data-label=${TT('Name')}><b>${mem.fullName||mem.name}</b><div class="muted" style=${{fontSize:11}}>${mem.email||''}</div></td>
                <td data-label="Title" class="muted">${mem.jobTitle||TT(mem.role)||'—'}</td>
                <td data-label=${TT('Team Role')}>${ce?html`<select class="sel" style=${{padding:'4px 6px',fontSize:11}} value=${memberRole(mem.id)} onChange=${e=>setMemberRole(mem.id,e.target.value)}>${TEAM_ROLES.map(r=>html`<option key=${r} value=${r}>${TT(r)}</option>`)}</select>`:html`<${Tag}>${TT(memberRole(mem.id))}<//>`}</td>
                <td data-label=${TT('Active tasks')} class="num">${active}</td>
                ${ce?html`<td class="right cell-actions">
                  ${mem.id!==tm.teamLeadId?html`<button class="mini" onClick=${()=>setLead(mem.id)}>${TT('Set as Team Lead')}</button>`:html`<span class="muted" style=${{fontSize:11}}>${TT('Team Lead')}</span>`}
                  <button class="mini" onClick=${()=>removeMember(mem.id)}>${TT('Remove Member')}</button></td>`:null}
              </tr>`; })}</tbody></table></div>`}
        </div>`}

        ${tab==='Clients'&&html`<div>
          ${clients.length===0?html`<${EmptyState} title=${TT('Assigned Clients')} text=${TT('Assign Clients')} icon="layers"/>`
          : html`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${TT('Client')}</th><th>${TT('Status')}</th><th>${TT('Account manager')||'Manager'}</th>${ce?html`<th></th>`:null}</tr></thead>
            <tbody>${clients.map(c=>html`<tr key=${c.id}>
              <td data-label=${TT('Client')}><b>${c.brandName||c.name}</b>${c.primaryTeamId===tm.id?html`<span class="new-badge" style=${{marginLeft:6}}>${TT('Primary Team')}</span>`:''}</td>
              <td data-label=${TT('Status')}><${Tag}>${TT(c.status||'')}<//></td>
              <td data-label="Manager" class="muted">${nameById(db.employees,c.accountManagerId||c.ownerId)}</td>
              ${ce?html`<td class="right cell-actions"><button class="mini" onClick=${()=>{onClose();ctx.go&&ctx.go('clients');}}>${TT('Open Client Profile')}</button><button class="mini" onClick=${()=>unassignClient(c.id)}>${TT('Unassign Client')}</button></td>`:null}
            </tr>`)}</tbody></table></div>`}
        </div>`}

        ${tab==='Tasks'&&html`<div>
          ${ce&&html`<button class="mini pri" style=${{marginBottom:10}} onClick=${createTeamTask}>${TT('Create Team Task')}</button>`}
          <${DataTable} db=${db} rows=${tasks} cols=${[{k:'title',label:TT('Title'),render:r=>r.title||r.name},{k:'assignedTo',label:TT('Assigned To'),render:r=>nameById(db.employees,r.assignedTo)},{k:'status',label:TT('Status'),tag:true,render:r=>TT(r.status||'')},{k:'dueDate',label:TT('Due'),date:true}]}/></div>`}

        ${tab==='Content Calendar'&&(()=>{ const cids=new Set(clients.map(c=>c.id)); const items=getScheduledContentItems(db).filter(i=>cids.has(i.clientId)).sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));
          return items.length?html`<${DataTable} db=${db} rows=${items} cols=${[{k:'title',label:TT('Title')},{k:'clientName',label:TT('Client')},{k:'platform',label:TT('Platform')},{k:'scheduledDate',label:TT('Scheduled Date'),date:true},{k:'status',label:TT('Status'),tag:true,render:r=>TT(r.status)}]}/>`:html`<${EmptyState} title=${TT('No scheduled content')} icon="calendar"/>`; })()}

        ${tab==='Activity'&&html`<div>${(db.activityLogs||[]).filter(a=>a.entityType==='teams'&&a.entityId===tm.id).map(a=>html`<div class="lrow" key=${a.id}><div class="li-t"><b style=${{fontWeight:500}}>${a.actorName} ${a.action}</b></div><span class="li-meta">${fmtDateTime(a.createdAt)}</span></div>`)}
          ${(db.activityLogs||[]).filter(a=>a.entityType==='teams'&&a.entityId===tm.id).length===0&&html`<div class="muted" style=${{fontSize:12}}>${TT('No data yet')}</div>`}</div>`}
      </div>
    </div>

    ${addMem&&html`<div class="ovl" style=${{zIndex:90}} onClick=${()=>setAddMem(null)}><div class="modal" style=${{width:420}} onClick=${e=>e.stopPropagation()}>
      <div class="modal-h"><h3>${TT('Add Member')}</h3><button class="icon-btn" onClick=${()=>setAddMem(null)}><span style=${{fontSize:18}}>×</span></button></div>
      <div class="modal-b">
        <label class="fld" style=${{marginBottom:10}}><span>${TT('Members')}</span><select value=${addMem.employeeId||''} onChange=${e=>setAddMem(Object.assign({},addMem,{employeeId:e.target.value}))}><option value="">—</option>${(db.employees||[]).filter(e=>!(tm.members||[]).includes(e.id)).map(e=>html`<option key=${e.id} value=${e.id}>${e.fullName||e.name}</option>`)}</select></label>
        <label class="fld" style=${{marginBottom:14}}><span>${TT('Team Role')}</span><select value=${addMem.teamRole} onChange=${e=>setAddMem(Object.assign({},addMem,{teamRole:e.target.value}))}>${TEAM_ROLES.map(r=>html`<option key=${r} value=${r}>${TT(r)}</option>`)}</select></label>
        <div class="form-foot"><button class="btn btn-ghost" onClick=${()=>setAddMem(null)}>${TT('Cancel')}</button><button class="btn btn-pri" onClick=${saveMember}>${TT('Save')}</button></div>
      </div></div></div>`}

    ${assignCl&&html`<div class="ovl" style=${{zIndex:90}} onClick=${()=>setAssignCl(null)}><div class="modal" style=${{width:460}} onClick=${e=>e.stopPropagation()}>
      <div class="modal-h"><h3>${TT('Assign Clients')}</h3><button class="icon-btn" onClick=${()=>setAssignCl(null)}><span style=${{fontSize:18}}>×</span></button></div>
      <div class="modal-b">
        <div class="mr-list" style=${{maxHeight:'40vh'}}>${(db.clients||[]).filter(c=>!(tm.assignedClients||[]).includes(c.id)).map(c=>html`<label class="mr-opt ${(assignCl||[]).includes(c.id)?'on':''}" key=${c.id}><input type="checkbox" checked=${(assignCl||[]).includes(c.id)} onChange=${()=>{ const s=new Set(assignCl); s.has(c.id)?s.delete(c.id):s.add(c.id); setAssignCl([...s]); }}/><span>${c.brandName||c.name}</span></label>`)}</div>
        <div class="form-foot"><button class="btn btn-ghost" onClick=${()=>setAssignCl(null)}>${TT('Cancel')}</button><button class="btn btn-pri" onClick=${doAssignClients}>${TT('Save')}</button></div>
      </div></div></div>`}
  </div>`;
}

/* ============================ MOUNT ============================ */
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

</script>
