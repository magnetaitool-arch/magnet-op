<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<title>Magnet OS</title>
<meta name="theme-color" content="#0c0e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Magnet OS">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/magnet-logo.png">
<link rel="shortcut icon" type="image/png" href="/magnet-logo.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   MAGNET — OPERATING SYSTEM
   Design tokens & global styles
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  /* brand */
  --lime:#c8f31e;
  --lime-bright:#d6fb45;
  --lime-deep:#a6cf12;
  --lime-glow:rgba(200,243,30,.16);

  /* metal */
  --silver-1:#ffffff;
  --silver-2:#d7d9dc;
  --silver-3:#a7abb0;
  --silver-4:#7c8087;

  /* canvas */
  --bg:#070807;
  --bg-2:#0c0d0b;
  --panel:#101210;
  --panel-2:#14161300;
  --panel-hi:#171a16;
  --raise:#1b1e1a;

  /* ink */
  --ink:#f3f5ef;
  --ink-2:#b9bdb4;
  --ink-3:#7d8279;
  --ink-4:#565a52;

  /* lines */
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.11);
  --line-strong:rgba(255,255,255,.16);

  /* status */
  --pos:#7fe08a;
  --neg:#f0796b;
  --warn:#f4c451;
  --info:#7fb6f0;

  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:24px;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 24px 60px -28px rgba(0,0,0,.9);

  --sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --display:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
::selection{background:var(--lime);color:#000}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* metallic text */
.metal{
  background:linear-gradient(176deg,#ffffff 0%,#e9ebee 26%,#aab0b6 52%,#f2f4f6 60%,#888d94 86%,#cfd3d8 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}

/* ===== app frame ===== */
#root{height:100vh}
.app{
  display:grid;
  grid-template-columns:248px 1fr;
  height:100vh;
  background:
    radial-gradient(1200px 600px at 78% -8%, rgba(200,243,30,.05), transparent 60%),
    radial-gradient(900px 500px at -5% 110%, rgba(120,130,140,.06), transparent 60%),
    var(--bg);
}

/* ===== sidebar ===== */
.sidebar{
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(255,255,255,.015),transparent 30%);
  min-height:0;
}
.brand{
  display:flex;align-items:center;gap:12px;
  padding:20px 22px 18px;
  border-bottom:1px solid var(--line);
}
.brand img{height:30px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
.brand .bt{display:flex;flex-direction:column;line-height:1}
.brand .bt b{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.14em}
.brand .bt span{font-size:9.5px;letter-spacing:.34em;color:var(--ink-3);margin-top:4px;font-weight:600}

.nav{flex:1;overflow-y:auto;padding:14px 12px;min-height:0}
.nav-group{margin-bottom:6px}
/* collapsible "More" section (focused nav) */
.nav-more{margin-top:6px;border-top:1px solid var(--line)}
.nav-more>summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  font-size:9.5px;letter-spacing:.22em;color:var(--ink-3);font-weight:700;
  padding:14px 12px 12px;text-transform:uppercase;user-select:none;
}
.nav-more>summary::-webkit-details-marker{display:none}
.nav-more>summary::after{content:"";width:6px;height:6px;border-right:1.6px solid var(--ink-4);border-bottom:1.6px solid var(--ink-4);transform:rotate(45deg);transition:.18s;margin-inline-start:auto;margin-inline-end:2px}
.nav-more[open]>summary::after{transform:rotate(-135deg)}
.nav-more>summary:hover{color:var(--ink-2)}
.nav-more[open]>summary{color:var(--ink-2)}
.nav-label{
  font-size:9.5px;letter-spacing:.22em;color:var(--ink-4);
  font-weight:700;padding:14px 12px 8px;text-transform:uppercase;
}
.nav-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:9px 12px;border-radius:var(--r-s);
  color:var(--ink-2);font-size:13.5px;font-weight:500;
  position:relative;transition:.16s;text-align:left;
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.nav-item.active{background:linear-gradient(90deg,rgba(200,243,30,.13),rgba(200,243,30,.03));color:var(--ink)}
.nav-item.active svg{color:var(--lime);opacity:1}
.nav-item.active::before{
  content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;background:var(--lime);border-radius:0 3px 3px 0;
  box-shadow:0 0 12px var(--lime-glow);
}
.nav-item .badge{
  margin-left:auto;font-family:var(--mono);font-size:10px;
  background:rgba(255,255,255,.07);color:var(--ink-2);
  padding:2px 7px;border-radius:20px;font-weight:600;
}
.nav-item.active .badge{background:var(--lime);color:#0a0a0a}

.side-foot{padding:14px 16px;border-top:1px solid var(--line)}
.user{
  display:flex;align-items:center;gap:11px;padding:8px;border-radius:var(--r-m);
  transition:.16s;cursor:pointer;
}
.user:hover{background:rgba(255,255,255,.04)}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:0 0 34px;
  display:grid;place-items:center;font-weight:700;font-size:13px;
  font-family:var(--display);color:#0a0a0a;
  background:linear-gradient(150deg,var(--silver-1),var(--silver-3));
  box-shadow:0 0 0 1px rgba(255,255,255,.1);
}
.user .ut{line-height:1.3;min-width:0}
.user .ut b{font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user .ut span{font-size:10.5px;color:var(--ink-3)}

/* ===== main ===== */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{
  height:64px;flex:0 0 64px;
  display:flex;align-items:center;gap:18px;
  padding:0 30px;border-bottom:1px solid var(--line);
  background:rgba(7,8,7,.6);backdrop-filter:blur(12px);
  position:relative;z-index:5;
}
.crumbs{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-3)}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs .sep{opacity:.4}
.search{
  margin-left:8px;display:flex;align-items:center;gap:9px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
  padding:8px 13px;width:300px;color:var(--ink-3);transition:.16s;
}
.search:focus-within{border-color:var(--line-strong);background:var(--panel-hi)}
.search svg{width:15px;height:15px}
.search input{background:none;border:none;outline:none;color:var(--ink);font-size:13px;width:100%}
.search input::placeholder{color:var(--ink-4)}
.search kbd{
  font-family:var(--mono);font-size:10px;color:var(--ink-3);
  border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;
}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{
  width:38px;height:38px;border-radius:var(--r-m);
  display:grid;place-items:center;color:var(--ink-2);
  border:1px solid var(--line);background:var(--panel);transition:.16s;position:relative;
}
.icon-btn:hover{background:var(--panel-hi);color:var(--ink);border-color:var(--line-2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime)}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:var(--r-m);font-size:13px;font-weight:600;
  transition:.16s;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
/* inline status/section icons (replaced emojis) — keep them small */
.lb-card-h svg{width:18px;height:18px;flex:0 0 auto}
.board-ro svg,.kpill svg,.pf-trust svg,.cd-ro svg,.acc-row svg,.settle-explain svg,.lime svg{width:15px;height:15px;flex:0 0 auto;vertical-align:middle}
.lb-meta svg{width:14px;height:14px;flex:0 0 auto}
.btn-pri{background:var(--lime);color:#0c0e08;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 8px 24px -10px var(--lime-glow)}
.btn-pri:hover{background:var(--lime-bright);transform:translateY(-1px)}
.btn-ghost{border:1px solid var(--line-2);color:var(--ink);background:var(--panel)}
.btn-ghost:hover{background:var(--panel-hi);border-color:var(--line-strong)}

/* ===== content scroll ===== */
.canvas{flex:1;overflow-y:auto;min-height:0;padding:30px 30px 60px;scroll-behavior:smooth}
.view-head{display:flex;align-items:flex-end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.view-head .vh-t{flex:1;min-width:240px}
.view-head h1{font-family:var(--display);font-weight:700;font-size:29px;letter-spacing:-.01em}
.view-head p{color:var(--ink-3);font-size:14px;margin-top:7px;max-width:60ch;line-height:1.5}
.view-actions{display:flex;gap:10px;align-items:center}

/* ===== panels ===== */
.panel{
  background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 40%),var(--panel);
  border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--shadow);
}
.panel-h{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.panel-h h3{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.01em}
.panel-h .ph-sub{font-size:12px;color:var(--ink-3)}
.panel-h .ph-act{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-b{padding:20px}

.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-4);font-weight:700}

/* grid utils */
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:18px}
@media(max-width:1180px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:repeat(2,1fr)}}

/* ===== KPI ===== */
.kpi{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 50%),var(--panel);
  border:1px solid var(--line);border-radius:var(--r-l);padding:20px;
  transition:.18s;
}
.kpi:hover{border-color:var(--line-2);transform:translateY(-2px)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.kpi .k-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--silver-2)}
.kpi .k-ic svg{width:17px;height:17px}
.kpi .k-lab{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.01em}
.kpi .k-val{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1}
.kpi .k-val small{font-size:15px;color:var(--ink-3);font-weight:600;margin-left:2px}
.kpi .k-foot{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px}
.chip.up{color:var(--pos);background:rgba(127,224,138,.1)}
.chip.down{color:var(--neg);background:rgba(240,121,107,.1)}
.chip.flat{color:var(--ink-2);background:rgba(255,255,255,.06)}
.kpi .spark{position:absolute;right:0;bottom:0;width:54%;height:46px;opacity:.9}

/* ===== tags / status ===== */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-2)}
.tag .d{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.tag.ok{color:var(--pos);border-color:rgba(127,224,138,.25);background:rgba(127,224,138,.07)}
.tag.ok .d{background:var(--pos);box-shadow:0 0 7px var(--pos)}
.tag.warn{color:var(--warn);border-color:rgba(244,196,81,.25);background:rgba(244,196,81,.07)}
.tag.warn .d{background:var(--warn);box-shadow:0 0 7px var(--warn)}
.tag.neg{color:var(--neg);border-color:rgba(240,121,107,.25);background:rgba(240,121,107,.07)}
.tag.neg .d{background:var(--neg)}
.tag.lime{color:var(--lime);border-color:rgba(200,243,30,.3);background:var(--lime-glow)}
.tag.lime .d{background:var(--lime);box-shadow:0 0 7px var(--lime)}

/* ===== table ===== */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-4);font-weight:700;padding:0 16px 12px;white-space:nowrap;
}
.tbl td{padding:14px 16px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{transition:.14s}
.tbl tbody tr:hover{background:rgba(255,255,255,.022)}
.tbl .num{font-family:var(--mono);text-align:right}
.tbl .right{text-align:right}
.co-cell{display:flex;align-items:center;gap:12px}
.co-logo{width:34px;height:34px;border-radius:9px;flex:0 0 34px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;color:#0a0a0a;border:1px solid rgba(255,255,255,.12)}
.co-cell .cn b{font-size:13.5px;font-weight:600;display:block}
.co-cell .cn span{font-size:11.5px;color:var(--ink-3)}

/* progress / meters */
.meter{height:6px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden}
.meter i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--lime-deep),var(--lime))}
.bar-track{height:8px;border-radius:20px;background:rgba(255,255,255,.06);overflow:hidden}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:14px}
.legend .lg{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.legend .lg i{width:9px;height:9px;border-radius:3px}

/* donut center */
.donut-wrap{position:relative;display:grid;place-items:center}
.donut-center{position:absolute;text-align:center}
.donut-center b{font-family:var(--display);font-size:24px;font-weight:700;display:block;line-height:1}
.donut-center span{font-size:11px;color:var(--ink-3)}

/* list rows */
.lrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:none}
.lrow .li-ic{width:34px;height:34px;border-radius:9px;flex:0 0 34px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--silver-2)}
.lrow .li-ic svg{width:16px;height:16px}
.lrow .li-t{flex:1;min-width:0}
.lrow .li-t b{font-size:13px;font-weight:600;display:block}
.lrow .li-t span{font-size:12px;color:var(--ink-3)}
.lrow .li-meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap}

/* avatars stack */
.stack{display:flex}
.stack .av{width:28px;height:28px;border-radius:50%;margin-left:-8px;border:2px solid var(--panel);display:grid;place-items:center;font-size:10px;font-weight:700;color:#0a0a0a;font-family:var(--display)}
.stack .av:first-child{margin-left:0}

/* segmented */
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-3);transition:.14s}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}

/* fade-in */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.view{animation:fadeUp .4s cubic-bezier(.2,.7,.2,1) both}
.stagger>*{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both}
.stagger>*:nth-child(1){animation-delay:.02s}
.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.1s}
.stagger>*:nth-child(4){animation-delay:.14s}
.stagger>*:nth-child(5){animation-delay:.18s}
.stagger>*:nth-child(6){animation-delay:.22s}

/* misc */
.divline{height:1px;background:var(--line);margin:0}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono)}
.flex{display:flex}
.between{justify-content:space-between}
.center{align-items:center}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.lime{color:var(--lime)}
.lnk{color:var(--lime);text-decoration:none;border-bottom:1px solid rgba(200,243,30,.35);word-break:break-all;transition:.14s}
.lnk:hover{border-bottom-color:var(--lime);opacity:.85}

/* ============================================================================
   LIGHT THEME  —  applied via <body class="theme-light">. Toggle in Settings.
   Flips the palette variables and overrides the few dark-specific spots
   (white-alpha hovers, topbar, login) so the app reads clean and bright,
   Asana/ClickUp style. Dark remains available via the toggle.
   ============================================================================ */
body.theme-light{
  --bg:#f6f7f9; --bg-2:#ffffff; --panel:#ffffff; --panel-2:transparent; --panel-hi:#eef1f5;
  --ink:#1b2430; --ink-2:#48515f; --ink-3:#6f7b8a; --ink-4:#9aa4b1;
  --silver-2:#6b7686;
  --line:rgba(16,24,40,.10); --line-2:rgba(16,24,40,.14); --line-strong:rgba(16,24,40,.22);
  --raise:rgba(16,24,40,.05);
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 14px 36px -20px rgba(16,24,40,.20);
  --lime-glow:rgba(150,190,10,.18);
}
body.theme-light{ background:var(--bg); color:var(--ink); }
body.theme-light .topbar{ background:rgba(255,255,255,.72); }
body.theme-light .sidebar{ background:#ffffff; }
body.theme-light .login-screen{ background:radial-gradient(1200px 600px at 50% -10%,rgba(200,243,30,.12),transparent),#eaeef3; }
body.theme-light .panel, body.theme-light .kpi{ background:#ffffff; box-shadow:var(--shadow); }
/* white-alpha hovers/fills -> subtle dark-alpha so they're visible on light */
body.theme-light .nav-item:hover,
body.theme-light .user:hover,
body.theme-light .notif-row:hover,
body.theme-light .chan-row:hover,
body.theme-light .mr-opt:hover{ background:rgba(16,24,40,.05); }
body.theme-light .nav-item.active{ background:linear-gradient(90deg,rgba(200,243,30,.30),rgba(200,243,30,.07)); }
body.theme-light .tbl tbody tr:hover{ background:rgba(16,24,40,.03); }
body.theme-light .badge,
body.theme-light .chip.flat,
body.theme-light .kcount,
body.theme-light .mini{ background:rgba(16,24,40,.06); color:var(--ink-2); }
body.theme-light .mini:hover{ background:rgba(16,24,40,.10); color:var(--ink); }
body.theme-light .kpi .k-ic,
body.theme-light .lrow .li-ic,
body.theme-light .empty-state .es-ic{ background:rgba(16,24,40,.05); }
body.theme-light .meter,
body.theme-light .bar-track,
body.theme-light .hb-track,
body.theme-light .k-bar{ background:rgba(16,24,40,.08); }
body.theme-light .kcol,
body.theme-light .cal-cell.empty{ background:rgba(16,24,40,.02); }
body.theme-light ::-webkit-scrollbar-thumb{ background:rgba(16,24,40,.18); }
body.theme-light ::-webkit-scrollbar-thumb:hover{ background:rgba(16,24,40,.30); }
body.theme-light .co-logo{ border:1px solid rgba(16,24,40,.12); }

/* ---- Light mode: soft indigo accent (replaces harsh lime on white) ---- */
body.theme-light{
  --lime:#5b6ef2; --lime-bright:#7486f6; --lime-deep:#4658d8; --lime-glow:rgba(91,110,242,.22);
}
body.theme-light .btn-pri{ color:#fff; box-shadow:0 1px 2px rgba(91,110,242,.22),0 12px 26px -12px rgba(91,110,242,.55); }
body.theme-light .btn-pri:hover{ filter:brightness(1.04); }
body.theme-light .nav-item.active{ background:linear-gradient(90deg,rgba(91,110,242,.14),rgba(91,110,242,.02)); }
body.theme-light .nav-item.active .badge{ color:#fff; }
body.theme-light .new-badge{ color:#fff; }
body.theme-light ::selection{ background:var(--lime); color:#fff; }
/* a touch softer + airier */
body.theme-light .panel{ border-radius:16px; }
body.theme-light .kpi{ border-radius:16px; }
body.theme-light .btn{ border-radius:10px; }

/* ===== CRM app additions ===== */
.logo-badge{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;color:#0a0a0a;background:linear-gradient(150deg,var(--lime-bright),var(--lime-deep));letter-spacing:.02em}
.grid.g-3{grid-template-columns:repeat(3,1fr)}
.seg .on{background:var(--raise);color:var(--ink)}
.sel{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:var(--r-m);padding:8px 12px;font-size:13px;font-family:inherit}
.sel:focus{outline:none;border-color:var(--line-strong)}

/* buttons */
.mini{font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--ink-2);border:1px solid var(--line);transition:.14s}
.mini:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.mini.pri{background:var(--lime);color:#0c0e08;border-color:transparent}
.mini.pri:hover{background:var(--lime-bright)}

/* modal */
.ovl{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:7vh 20px;animation:fadeUp .18s}
.modal{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-l);width:480px;max-width:96vw;box-shadow:0 40px 90px -20px rgba(0,0,0,.8);animation:slideUp .24s cubic-bezier(.2,.7,.2,1)}
.modal.wide{width:640px}
@keyframes slideUp{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font-family:var(--display);font-size:16px;font-weight:600}
.modal-b{padding:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld span{font-size:11px;letter-spacing:.04em;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.fld input,.fld select,.fld textarea{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:var(--r-s);padding:9px 11px;font-size:13px;font-family:inherit;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px var(--lime-glow)}
.form-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}

/* kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:20px;align-items:flex-start}
.kcol{flex:0 0 264px;background:var(--panel-2);background:rgba(255,255,255,.012);border:1px solid var(--line);border-radius:var(--r-m);min-height:120px}
.kcol-h{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink-2);position:sticky;top:0}
.kcount{font-family:var(--mono);font-size:11px;color:var(--ink-4);background:rgba(255,255,255,.06);padding:1px 7px;border-radius:20px}
.kcol-b{padding:10px;display:flex;flex-direction:column;gap:10px;min-height:40px}
.kcard{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-s);padding:12px;cursor:grab;transition:.14s}
.kcard:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.kcard:active{cursor:grabbing}
.kcard.locked{cursor:pointer}
.kcard.locked:active{cursor:pointer}
.kcol.kover{outline:1.5px dashed var(--lime);outline-offset:-3px;background:rgba(196,255,61,.045)}
.kcard-labels{display:flex;gap:4px;margin-bottom:9px;flex-wrap:wrap}
.klabel{width:28px;height:6px;border-radius:6px;display:inline-block}
.kmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.kpill{font-size:10.5px;font-family:var(--mono);color:var(--ink-3);background:rgba(255,255,255,.05);border:1px solid var(--line);padding:1px 7px;border-radius:20px}
.kpill.kdue.over{color:#ff7a7a;border-color:rgba(255,90,90,.4)}
.kpill.kchk.all{color:#46d369;border-color:rgba(70,211,105,.4)}
/* Trello card drawer */
.cdrawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;justify-content:flex-end;animation:cdfade .15s ease}
.cdrawer{width:min(440px,94vw);height:100%;background:var(--panel);border-left:1px solid var(--line-strong);box-shadow:-22px 0 60px rgba(0,0,0,.45);display:flex;flex-direction:column;animation:cdslide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes cdslide{from{transform:translateX(34px);opacity:.5}to{transform:none;opacity:1}}
@keyframes cdfade{from{opacity:0}to{opacity:1}}
.cdrawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.cdrawer-b{padding:16px 18px 28px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.cd-sec label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.cdrawer .inp{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font-size:13px;font-family:inherit}
.cdrawer .inp:focus{border-color:var(--lime);outline:none}
.cdrawer .inp:disabled{opacity:.7}
.cd-labels{display:flex;flex-wrap:wrap;gap:6px}
.cd-lab{font-size:11.5px;font-weight:600;border:1.5px solid;border-radius:20px;padding:4px 11px;cursor:pointer;background:transparent;transition:.12s}
.cd-lab:disabled{opacity:.55;cursor:default}
.cd-prog{height:6px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;margin-bottom:10px}
.cd-prog-i{height:100%;background:var(--lime);transition:width .2s}
.cd-checks{display:flex;flex-direction:column;gap:8px}
.cd-check{display:flex;align-items:center;gap:9px;font-size:13px}
.cd-check span.done{text-decoration:line-through;color:var(--ink-4)}
.cd-check .cd-x{margin-left:auto;background:none;border:none;color:var(--ink-4);cursor:pointer;font-size:12px}
.cd-add{display:flex;gap:8px;margin-top:10px}
.cd-add .inp{flex:1}
.cd-ro{font-size:12px;color:var(--ink-3);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.board-ro{font-size:12px;color:var(--ink-3);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:14px;display:inline-block}
.kwrap{position:relative}
.khint{display:none}
.kanban{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.kcard{touch-action:pan-x pan-y}
.kcard.tappable{cursor:pointer}
.kcard-open{font-size:10.5px;color:var(--ink-4);margin-top:9px;font-weight:600;opacity:0;transition:opacity .15s}
.kcard.tappable:hover .kcard-open{opacity:.75}
@media (max-width:767px){
  .khint{display:block;font-size:11.5px;color:var(--ink-3);background:rgba(196,255,61,.06);border:1px solid rgba(196,255,61,.25);border-radius:10px;padding:9px 12px;margin-bottom:11px;text-align:center}
  .kcol{flex:0 0 87vw;scroll-snap-align:center}
  .kcard-open{opacity:1;color:var(--lime);text-align:end}
}
/* Campaign cards */
.camp-card{display:flex;flex-direction:column;gap:10px}
.camp-stat{padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.camp-link{display:flex;gap:8px;align-items:center}
.camp-link input{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink-2);font-size:11.5px;font-family:var(--mono)}
.vpill{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink-4);margin-left:6px;text-transform:uppercase}
.vpill.ok{color:#46d369;border-color:rgba(70,211,105,.4);background:rgba(70,211,105,.08)}
.ver-toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin:4px 0 14px;cursor:pointer}
.ver-toggle input{accent-color:var(--lime);width:15px;height:15px}
.settle-box{text-align:center;padding:18px;background:rgba(196,255,61,.05);border:1px solid rgba(196,255,61,.25);border-radius:14px}
.settle-line{font-size:16px;margin-bottom:6px}
.settle-amt{font-size:32px;font-weight:800;font-family:var(--mono);letter-spacing:-.01em}
.settle-explain{font-size:12.5px;line-height:1.7;color:var(--ink-3);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.settle-explain b{color:var(--ink)} .settle-explain b.lime{color:var(--lime)}
.acc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.acc-row>span{font-size:13px}
.acc-seg{display:flex;gap:3px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:2px;flex:0 0 auto}
.acc-seg button{font-size:11px;font-weight:600;padding:5px 9px;border:0;border-radius:7px;background:transparent;color:var(--ink-3);cursor:pointer;font-family:inherit}
.acc-seg button.on{background:var(--lime);color:#0a0a0a}
.acc-seg button:disabled{opacity:.4;cursor:default}
.prof-edit{display:flex;align-items:center;gap:16px}
.prof-edit-actions{display:flex;gap:8px;flex-wrap:wrap}
.plan-row{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.plan-row:last-child{border-bottom:0}
.plan-chk{flex:0 0 24px;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line-strong);background:transparent;color:#0a0a0a;cursor:pointer;display:grid;place-items:center;font-size:13px;font-weight:800;transition:.12s}
.plan-chk.on{background:var(--lime);border-color:var(--lime)}
.plan-main{flex:1;min-width:0}
.plan-title{font-size:14px;font-weight:600}
.plan-row.done .plan-title{text-decoration:line-through;color:var(--ink-4)}
.plan-meta{font-size:11.5px;color:var(--ink-4);margin-top:2px}
.plan-prog{flex:0 0 64px;height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
.plan-prog>div{height:100%;background:var(--lime)}
@media(max-width:767px){ .plan-row{flex-wrap:wrap} .plan-main{flex:1 1 55%} .plan-prog{flex-basis:100%;order:6} }
/* Public campaign form — premium */
.pf-wrap{position:fixed;inset:0;overflow-y:auto;background:#060705;display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.pf-wrap::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 50% -6%,rgba(196,255,61,.12) 0%,transparent 60%),radial-gradient(50% 35% at 100% 100%,rgba(196,255,61,.05) 0%,transparent 60%)}
.pf-card{position:relative;z-index:1;width:100%;max-width:500px;background:linear-gradient(180deg,#101109,#0b0c08);border:1px solid #20231a;border-radius:24px;padding:32px 28px;box-shadow:0 40px 90px -30px rgba(0,0,0,.75);margin:auto}
.pf-logo-frame{width:72px;height:72px;margin-bottom:20px;border-radius:20px;background:linear-gradient(160deg,#15180f,#0b0c08);border:1px solid #262a1d;display:grid;place-items:center;box-shadow:0 16px 40px -16px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.04)}
.pf-logo-frame img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(196,255,61,.25))}
.pf-eyebrow{color:#C4FF3D;font-weight:800;letter-spacing:.26em;font-size:10.5px;margin-bottom:10px}
.pf-head h1{font-size:clamp(26px,5.5vw,34px);font-weight:900;letter-spacing:-.02em;line-height:1.08;background:linear-gradient(180deg,#fff,#cdd1c4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-family:'Archivo','Plus Jakarta Sans',sans-serif}
.pf-head p{color:#9ea298;font-size:14.5px;margin-top:10px;line-height:1.6}
.pf-fields{display:flex;flex-direction:column;gap:15px;margin:24px 0}
.pf-fld span{display:block;font-size:12.5px;font-weight:700;color:#d4d8cb;margin-bottom:7px}
.pf-fld input,.pf-fld textarea{width:100%;background:#070807;border:1px solid #2a2e23;border-radius:13px;padding:13px 14px;color:#fff;font-size:16px;font-family:inherit;transition:border-color .16s,box-shadow .16s,background .16s}
.pf-fld input::placeholder,.pf-fld textarea::placeholder{color:#5a5e55}
.pf-fld input:focus,.pf-fld textarea:focus{border-color:#C4FF3D;outline:none;background:#0b0d08;box-shadow:0 0 0 4px rgba(196,255,61,.12)}
.pf-fld textarea{resize:vertical;line-height:1.6}
.pf-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.pf-submit{width:100%;border:0;border-radius:15px;padding:16px;font-size:16px;font-weight:900;color:#0a0a0a;cursor:pointer;
  box-shadow:0 10px 0 #7e9a10,0 18px 40px -16px rgba(196,255,61,.55);transition:transform .08s,box-shadow .08s,filter .15s;font-family:'Archivo','Plus Jakarta Sans',sans-serif}
.pf-submit:hover{filter:brightness(1.04)}.pf-submit:active{transform:translateY(5px);box-shadow:0 5px 0 #7e9a10}.pf-submit:disabled{opacity:.55;box-shadow:0 10px 0 #34381f;cursor:default}
.pf-trust{display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;color:#8a8f80;font-size:11.5px;margin-top:14px;line-height:1.5}
.pf-foot{text-align:center;color:#5a5e55;font-size:11px;font-weight:700;letter-spacing:.12em;margin-top:12px}
.pf-foot b{color:#C4FF3D}
.pf-logo{height:44px;width:auto;margin:0 auto 18px;display:block}
.pf-msg{text-align:center;padding:30px 0;color:#a8a8a8}
.pf-msg h2{color:#fff;font-size:20px;margin-bottom:8px}
.pf-done .pf-check{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#0a0a0a;margin:0 auto 16px;font-weight:800}
/* ===== Premium UX polish (Zoho/Asana feel) — additive, CSS-only ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
.view{animation:viewIn .3s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:10px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
.panel{transition:border-color .18s var(--ease),box-shadow .22s var(--ease),transform .18s var(--ease)}
.panel:hover{box-shadow:0 14px 34px -22px rgba(0,0,0,.6)}
.fld input,.fld select,.fld textarea{transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.fld input:focus,.fld select:focus,.fld textarea:focus{box-shadow:0 0 0 3px rgba(196,255,61,.14)}
.tbl tbody tr{transition:background .12s var(--ease)}
.tbl tbody tr:hover{background:rgba(255,255,255,.025)}
.nav-item{position:relative}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);width:3px;height:58%;background:var(--lime);border-radius:0 4px 4px 0;box-shadow:0 0 10px rgba(196,255,61,.5)}
.btn:focus-visible,.mini:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.modal{animation:viewIn .2s var(--ease)}
.kcol{transition:background .15s var(--ease)}
.kcol:hover{background:rgba(255,255,255,.022)}
.kpi b,.kpi .num{font-variant-numeric:tabular-nums}
.tag{transition:background .15s var(--ease),color .15s var(--ease)}
.skel{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 37%,rgba(255,255,255,.04) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.view,.modal{animation:none}*{scroll-behavior:auto}}
.btn.danger,.btn-ghost.danger{color:#ff7a7a;border-color:rgba(255,90,90,.35)}
.btn.danger:hover,.btn-ghost.danger:hover{background:rgba(255,90,90,.1);border-color:rgba(255,90,90,.6)}
@keyframes cdsheet{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
/* ===== Mobile refinements for new modules (boards, drawer, campaigns, forms) ===== */
@media (max-width:767px){
  /* Trello card drawer + campaign editor become a native bottom sheet */
  .cdrawer-ov{justify-content:stretch;align-items:flex-end}
  .cdrawer{width:100%;max-width:100%;height:auto;max-height:90vh;border-left:0;

  .cdrawer-h{padding:16px 16px 12px}

.brf-logo-frame img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(200,243,30,.25))}
.brf-eyebrow{color:#c8f31e;font-weight:800;letter-spacing:.28em;font-size:11px;font-family:'Archivo',sans-serif;margin-bottom:10px}
.brf-hero h1{font-size:clamp(30px,8vw,46px);font-weight:900;letter-spacing:-.02em;line-height:1.05;font-family:'Archivo','Cairo',sans-serif;
  background:linear-gradient(180deg,#ffffff,#c9cdc0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brf-hero p{color:#9ea298;font-size:15px;margin-top:12px;line-height:1.75;max-width:440px;margin-inline:auto}
.brf-hero-pct{display:inline-flex;align-items:center;gap:7px;margin-top:18px;background:rgba(200,243,30,.08);border:1px solid rgba(200,243,30,.28);color:#c8f31e;font-size:12.5px;font-weight:800;padding:7px 16px;border-radius:30px}
.brf-sec{position:relative;background:linear-gradient(180deg,rgba(20,23,14,.7),rgba(11,12,8,.7));backdrop-filter:blur(8px);
  border:1px solid #1d2018;border-radius:22px;padding:22px 20px;margin-bottom:16px;animation:brfUp .5s cubic-bezier(.2,.8,.2,1) both}
.brf-sec:nth-child(2){animation-delay:.04s}.brf-sec:nth-child(3){animation-delay:.08s}.brf-sec:nth-child(4){animation-delay:.12s}
.brf-sec:nth-child(5){animation-delay:.16s}.brf-sec:nth-child(6){animation-delay:.2s}.brf-sec:nth-child(7){animation-delay:.24s}
@keyframes brfUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.brf-sec-h{display:flex;align-items:center;gap:13px;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #1d2018}
.brf-num{flex:0 0 38px;width:38px;height:38px;border-radius:12px;background:linear-gradient(150deg,#c8f31e,#a6cf12);color:#070807;font-weight:900;
  display:grid;place-items:center;font-size:16px;font-family:'Archivo',sans-serif;box-shadow:0 6px 18px -6px rgba(200,243,30,.5)}
.brf-sec-h b{font-size:18px;font-weight:800;display:block;line-height:1.2}
.brf-sec-h i{font-style:normal;color:#5a5e55;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.brf-fld{margin-bottom:17px}
.brf-fld label{display:block;font-size:14px;font-weight:700;margin-bottom:9px}
.brf-fld label b{color:#ff5a4d;margin-inline-start:2px}
.brf-fld label i{font-style:normal;color:#5a5e55;font-weight:500;font-size:11.5px;margin-inline-start:7px}
.brf-fld input,.brf-fld select,.brf-fld textarea{width:100%;background:#0b0d08;border:1px solid #2a2e23;border-radius:13px;padding:14px 15px;color:#f5f7f0;font-size:16px;font-family:inherit;transition:border-color .16s,box-shadow .16s,background .16s}
.brf-fld input::placeholder,.brf-fld textarea::placeholder{color:#4f5349}
.brf-fld input:focus,.brf-fld select:focus,.brf-fld textarea:focus{border-color:#c8f31e;outline:none;background:#0e1009;box-shadow:0 0 0 4px rgba(200,243,30,.12)}
.brf-fld textarea{resize:vertical;line-height:1.6}
.brf-chips{display:flex;flex-wrap:wrap;gap:9px}
.brf-chip{background:#0b0d08;border:1.5px solid #2a2e23;color:#a9ada2;border-radius:30px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.14s;min-height:44px}
.brf-chip.on{background:linear-gradient(150deg,#c8f31e,#a6cf12);border-color:#c8f31e;color:#070807;box-shadow:0 6px 16px -8px rgba(200,243,30,.6)}
.brf-consent{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;cursor:pointer;background:#0b0d08;border:1px solid #2a2e23;border-radius:14px;padding:16px}
.brf-consent input{width:22px;height:22px;accent-color:#c8f31e;flex:0 0 22px}
.brf-consent b{color:#ff5a4d}
.brf-err{background:rgba(255,90,77,.12);border:1px solid rgba(255,90,77,.4);color:#ff8a7d;border-radius:13px;padding:13px 16px;font-size:14px;margin-bottom:14px;text-align:center;font-weight:600}
.brf-submit{width:100%;border:0;border-radius:16px;padding:18px;font-size:18px;font-weight:900;color:#070807;
  background:linear-gradient(150deg,#c8f31e,#a6cf12);cursor:pointer;box-shadow:0 10px 0 #7e9a10,0 18px 40px -16px rgba(200,243,30,.6);
  transition:transform .08s,box-shadow .08s,opacity .15s;font-family:'Archivo','Cairo',sans-serif;margin-top:6px}
.brf-submit:active{transform:translateY(5px);box-shadow:0 5px 0 #7e9a10}
.brf-submit:disabled{opacity:.45;box-shadow:0 10px 0 #34381f;cursor:default}
.brf-msgcard{text-align:center;margin-top:10vh}
.brf-tag{margin-top:20px;color:#5a5e55;font-size:12px;font-weight:800;letter-spacing:.26em;font-family:'Archivo',sans-serif}
.brf-ro{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.brf-ro:last-child{border-bottom:0}
.brf-ro-l{color:var(--ink-4);flex:0 0 auto;max-width:46%}
.brf-ro-v{color:var(--ink);text-align:right;font-weight:600;white-space:pre-wrap}
.brf-ro-list{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.brf-msgcard .pf-logo{height:48px;margin:0 auto 18px}
.lrow .li-meta{margin-left:auto}
.flex.gap8{display:flex;gap:8px}
.mb18{margin-bottom:18px}
.grid.g-2{grid-template-columns:repeat(2,1fr)}
/* notifications popover */
.notif-pop{position:absolute;top:46px;right:0;width:320px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-m);box-shadow:0 30px 70px -20px rgba(0,0,0,.8);z-index:60;overflow:hidden;animation:slideUp .18s}
.notif-h{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-2)}
.notif-row{padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:.14s}
.notif-row:hover{background:rgba(255,255,255,.03)}
.notif-row.unread{background:rgba(200,243,30,.04)}
.notif-row b{font-size:12.5px;font-weight:600}
.notif-row span{font-size:11.5px;color:var(--ink-3)}
.notif-row i{font-size:10.5px;color:var(--ink-4);font-style:normal}
/* doc preview */
.doc-preview{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);padding:18px;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;max-height:50vh;overflow:auto}
.brand img{filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
a.mini{text-decoration:none;display:inline-block}
/* employee profile tabs */
.emp-tabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg-2)}
.emp-tab{padding:11px 14px;font-size:12.5px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;transition:.14s}
.emp-tab:hover{color:var(--ink)}
.emp-tab.on{color:var(--lime);border-bottom-color:var(--lime)}
/* checklist grids */
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check-row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel);cursor:pointer}
.check-row input{accent-color:var(--lime);width:15px;height:15px}
.check-row:hover{border-color:var(--line-2)}
@media(max-width:640px){.check-grid{grid-template-columns:1fr}}
/* chat */
.chan-row{display:block;width:100%;text-align:left;padding:10px 14px;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line);transition:.14s}
.chan-row:hover{background:rgba(255,255,255,.03)}
.chan-row.on{background:rgba(200,243,30,.06);color:var(--lime);font-weight:600}
.chat-msg{max-width:80%;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.chat-msg.me{align-self:flex-end;background:rgba(200,243,30,.07);border-color:rgba(200,243,30,.2)}
.chat-meta{font-size:10.5px;color:var(--ink-4);margin-bottom:3px}
.chat-body{font-size:13px;color:var(--ink);line-height:1.5}
.chat-input{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
/* war room */
.war-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.war-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:14px}
.war-card h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-4);margin-bottom:8px}
.war-card .lrow{padding:6px 0}
/* professional popups */
.toast-host{position:fixed;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast-host.tr{top:18px;right:18px}
.toast-host.br{bottom:18px;right:18px}
.toast-host.bc{bottom:18px;left:50%;transform:translateX(-50%)}
.pro-toast{display:flex;min-width:280px;max-width:360px;background:#101310;border:1px solid var(--line-2);border-radius:var(--r-m);box-shadow:0 18px 50px -12px rgba(0,0,0,.8);overflow:hidden;opacity:0;transform:translateY(-8px);transition:.3s;pointer-events:auto}
.pro-toast.in{opacity:1;transform:none}
.pro-toast .pt-bar{width:4px;background:var(--lime);flex:0 0 4px}
.pro-toast.neg .pt-bar{background:#f0796b}
.pro-toast .pt-body{padding:12px 16px}
.pro-toast .pt-title{font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:.01em}
.pro-toast .pt-msg{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.pro-toast .pt-ctx{font-size:11px;color:var(--ink-4);margin-top:4px;font-family:var(--mono)}
/* empty states */
.empty-state{text-align:center;padding:44px 20px}
.empty-state .es-ic{width:46px;height:46px;margin:0 auto 14px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink-4)}
.empty-state .es-ic svg{width:22px;height:22px}
.empty-state .es-title{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink)}
.empty-state .es-text{font-size:12.5px;color:var(--ink-3);margin-top:6px;max-width:360px;margin-left:auto;margin-right:auto;line-height:1.6}

/* ============================================================================
   RESPONSIVE — desktop untouched; mobile/tablet behavior in media queries.
   Breakpoints: mobile <=767, tablet 768-1023, desktop >=1024.
   ============================================================================ */
.hamburger,.nav-close,.bottom-nav,.more-scrim{display:none}
.tbl-wrap{overflow-x:auto}

/* ---- Tablet: narrower sidebar ---- */
@media (max-width:1023px){
  .sidebar{width:208px}
  .grid.g-4{grid-template-columns:repeat(2,1fr)}
}

/* ---- Mobile: drawer sidebar + bottom nav + cards ---- */
@media (max-width:767px){
  /* sidebar becomes an off-canvas drawer */
  .app{display:block}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:84vw;max-width:320px;z-index:120;
    transform:translateX(-105%);transition:transform .26s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 60px rgba(0,0,0,.6)}
  .app.nav-open .sidebar{transform:none}
  .nav-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:110;backdrop-filter:blur(2px)}
  .nav-close{display:grid;margin-left:auto}
  .main{margin-left:0;width:100%}
  .hamburger{display:grid}

  /* compact top bar; hide brand-filter segment + breadcrumb chrome */
  .topbar{padding:0 12px;gap:8px}
  .crumbs{font-size:12px}.crumbs .sep,.crumbs span:last-child{display:none}
  .topbar .seg{display:none}
  .top-actions .sel{max-width:120px}

  /* content padding + stack everything to one column */
  .canvas{padding:14px 12px 84px} /* bottom space for bottom-nav */
  .view-head{flex-direction:column;align-items:flex-start;gap:12px}
  .view-actions{width:100%;flex-wrap:wrap}
  .grid.g-2,.grid.g-3,.grid.g-4{grid-template-columns:1fr}
  [style*="grid-template-columns"]{grid-template-columns:1fr !important}
  .war-grid{grid-template-columns:1fr 1fr}
  h1{font-size:22px}

  /* tables -> stacked cards */
  .tbl-wrap{overflow:visible}
  table.tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table.tbl,table.tbl tbody,table.tbl tr,table.tbl td{display:block;width:100%}
  table.tbl tr{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
    margin-bottom:10px;padding:6px 4px}
  table.tbl td{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:8px 14px;border:0;text-align:right;font-size:13px}
  table.tbl td::before{content:attr(data-label);color:var(--ink-4);font-size:11px;
    text-transform:uppercase;letter-spacing:.04em;font-weight:600;text-align:left;flex:0 0 auto}
  table.tbl td.num{justify-content:space-between}
  table.tbl td.cell-actions{justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
  table.tbl td.cell-actions::before{display:none}
  table.tbl td .mini{padding:7px 12px} /* touch targets */
  table.tbl td[data-label=""]{display:none}

  /* touch-friendly controls */
  .btn{padding:11px 16px;font-size:13px}
  .mini{padding:8px 12px}
  .nav-item{padding:12px 14px}
  .kcol{flex:0 0 80vw}

  /* modals full-screen on mobile */
  .ovl{padding:0;align-items:stretch}
  .modal,.modal.wide{width:100% !important;max-width:100% !important;height:100%;border-radius:0;display:flex;flex-direction:column}
  .modal-b{flex:1;max-height:none !important;overflow-y:auto}
  .form-grid{grid-template-columns:1fr}
  .emp-tabs{overflow-x:auto}

  /* bottom navigation */
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:90;background:rgba(12,14,11,.96);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);height:62px;padding-bottom:env(safe-area-inset-bottom)}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--ink-4);font-size:10px;font-weight:600}
  .bn-item svg{width:20px;height:20px}
  .bn-item.on{color:var(--lime)}

  /* More sheet */
  .more-scrim{display:block;position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
  .more-sheet{width:100%;background:var(--bg-2);border-top-left-radius:18px;border-top-right-radius:18px;
    padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:78vh;overflow-y:auto;animation:slideUp .24s}
  .more-grip{width:42px;height:4px;border-radius:20px;background:var(--line-2);margin:8px auto 14px}
  .more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .more-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 8px;border:1px solid var(--line);
    border-radius:var(--r-m);background:var(--panel);color:var(--ink-2);font-size:11.5px;text-align:center}
  .more-item svg{width:20px;height:20px}
  .more-item.on{border-color:var(--lime);color:var(--lime)}
  .notif-pop{position:fixed;top:54px;left:10px;right:10px;width:auto}
}

/* very small phones */
@media (max-width:400px){ .more-grid{grid-template-columns:repeat(2,1fr)} .war-grid{grid-template-columns:1fr} }

/* desktop: never show mobile chrome */
@media (min-width:768px){ .bottom-nav,.more-scrim,.hamburger,.nav-close{display:none !important} }

/* ============================ PRINT ISOLATION ============================ */
@media print{
  .sidebar,.topbar,.bottom-nav,.more-scrim,.nav-scrim,.toast-host,.btn,.mini,.icon-btn{display:none !important}
  .app,.main,.canvas{display:block;margin:0;padding:0;background:#fff;color:#000;height:auto;overflow:visible}
}

/* New badge */
.new-badge{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:5px;
  background:var(--lime);color:#0c0e08;text-transform:uppercase}
[dir="rtl"] .new-badge{margin-left:0;margin-right:auto}
.lang-toggle{min-width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink-2);font-size:13px;font-weight:700;cursor:pointer}
.lang-toggle:hover{border-color:var(--line-2);color:var(--ink)}
/* RTL */
[dir="rtl"] .sidebar{left:auto;right:0;border-right:0;border-left:1px solid var(--line)}
[dir="rtl"] .main{margin-left:0}
[dir="rtl"] .nav-item,[dir="rtl"] .chan-row{text-align:right}
[dir="rtl"] .num,[dir="rtl"] .right{text-align:left}
[dir="rtl"] table.tbl td,[dir="rtl"] table.tbl th{text-align:right}
@media(max-width:767px){ [dir="rtl"] .sidebar{transform:translateX(105%)} [dir="rtl"] .app.nav-open .sidebar{transform:none} }
/* Workflow timeline */
.wf-timeline{display:flex;flex-direction:column;gap:0}
.wf-stage{display:flex;gap:14px;padding:14px 0;border-left:2px solid var(--line);margin-left:16px;padding-left:20px;position:relative}
[dir="rtl"] .wf-stage{border-left:0;border-right:2px solid var(--line);margin-left:0;margin-right:16px;padding-left:0;padding-right:20px}
.wf-stage.done{border-color:var(--lime)}
.wf-stage.current{border-color:var(--lime)}
.wf-num{position:absolute;left:-15px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--panel);
  border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-3)}
[dir="rtl"] .wf-num{left:auto;right:-15px}
.wf-stage.done .wf-num{background:var(--lime);color:#0c0e08;border-color:var(--lime)}
.wf-stage.current .wf-num{border-color:var(--lime);color:var(--lime)}
.wf-body{flex:1}.wf-body b{font-size:13.5px}
/* permission cells */
.perm-yes{color:var(--lime);font-weight:700}.perm-no{color:var(--ink-4)}

/* login screen */
.login-screen{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%,rgba(200,243,30,.06),transparent),#070807;
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.login-card{width:380px;max-width:94vw;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-l);padding:30px 28px;
  box-shadow:0 40px 90px -20px rgba(0,0,0,.8)}
.pw-toggle{position:absolute;top:50%;transform:translateY(-50%);right:8px;background:none;border:0;color:var(--ink-3);font-size:11px;font-weight:600;cursor:pointer;padding:4px 6px}
[dir="rtl"] .pw-toggle{right:auto;left:8px}
.login-err{background:rgba(240,121,107,.1);border:1px solid rgba(240,121,107,.3);color:#f0a99e;font-size:12.5px;padding:9px 12px;border-radius:var(--r-s);margin-bottom:14px;text-align:center}
.link-btn{background:none;border:0;color:var(--ink-3);font-size:12px;cursor:pointer;padding:0}
.link-btn:hover{color:var(--lime)}
/* user chip */
.user-chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 3px;cursor:pointer}
.user-chip:hover{border-color:var(--line-2)}
.uc-role{font-size:11px;font-weight:600;color:var(--ink-2)}
[dir="rtl"] .user-chip{padding:3px 3px 3px 10px}
/* warning note */
.warn-note{background:rgba(244,196,81,.1);border:1px solid rgba(244,196,81,.3);color:#f4c451;font-size:12.5px;padding:10px 14px;border-radius:var(--r-s);margin-bottom:16px}
/* backup reminder banner */
.backup-banner{background:rgba(127,182,240,.08);border:1px solid rgba(127,182,240,.25);color:#9cc6f0;font-size:12.5px;padding:10px 14px;border-radius:var(--r-s);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
@media(max-width:767px){ .user-chip .uc-role{display:none} .login-card{padding:24px 20px} }
.perm-box{width:16px;height:16px;accent-color:var(--lime);cursor:pointer}

/* ===================== DASHBOARD CHARTS ===================== */
.charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:18px}
@media(max-width:900px){ .charts-grid{grid-template-columns:1fr} }
.chart-card{min-width:0}
.chart-donut{position:relative;flex:0 0 auto}
.donut-seg{transition:stroke-dasharray .9s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion: reduce){ .donut-seg,.line-path,.cb-bar i,.k-bar i,.kpi-anim{transition:none!important;animation:none!important} }
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center b{font-family:var(--display);font-weight:700;font-size:18px}
.donut-center span{font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.04em}
.chart-legend{display:flex;flex-direction:column;gap:7px;min-width:120px}

   MAGNET OS — Agency Operating System (single-file React app via htm)
   ----------------------------------------------------------------------------
   MODES
     • Local Demo Mode  — no login, localStorage, demo data (default).
     • Cloud Mode       — Supabase records table {id, coll, data}, role-based.
   The app NEVER crashes when Supabase keys are missing; it falls back to local.
   Design identity (black/lime premium) is unchanged — see os.css + crm-extra.css.
   ============================================================================ */
const html = htm.bind(React.createElement);
const { useState, useEffect, useMemo, useRef } = React;

/* ============================ STORAGE (safe) ============================ */
const KEY = 'tia_agency_os_v2';
const CFG_KEY = 'tia_agency_os_cloud';
const SESSION_KEY = 'tia_agency_os_session';
const _mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return _mem[k]||null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ _mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete _mem[k]; } },
};

/* ============================ HELPERS ============================ */
const uid = (p) => {
  // Prefer a cryptographically-random UUID (no collisions, not guessable). Falls
  // back to time+random for very old browsers. Wider entropy than the old 4-char
  // suffix, which could collide on records created in the same millisecond.
  try { if(window.crypto && window.crypto.randomUUID) return (p||'rec') + '-' + window.crypto.randomUUID(); } catch(e){}
  return (p||'rec') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
};
// Cryptographically-strong, unguessable token (hex). Used for access tokens that
// gate data (brief links, email-verify links) and temporary passwords, which must
// NOT be predictable like Math.random(). n = number of random bytes.
const randToken = (n) => {
  n = n || 16;
  try { if(window.crypto && window.crypto.getRandomValues){ const a=new Uint8Array(n); window.crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); } } catch(e){}
  return Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
};
const nowISO = () => new Date().toISOString();
// LOCAL calendar date (YYYY-MM-DD). Using toISOString() directly returns the UTC date,
// which is wrong near midnight (e.g. Egypt UTC+2) — this keeps the date in the user's timezone.
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };

/* ============================ APP SETTINGS (currency + language) ============================ */
const APP_SETTINGS_KEY = 'tia_agency_os_appsettings';
// Each currency carries English + Arabic labels and placement (before/after amount).
const CURRENCIES = {
  USD:{ code:'USD', symbol:'$',  en:'USD', ar:'دولار', after:false },
  EGP:{ code:'EGP', symbol:'ج.م', en:'EGP', ar:'ج.م',  after:true },
  SAR:{ code:'SAR', symbol:'ر.س', en:'SAR', ar:'ر.س',  after:true },
  AED:{ code:'AED', symbol:'د.إ', en:'AED', ar:'د.إ',  after:true },
  EUR:{ code:'EUR', symbol:'€',  en:'EUR', ar:'يورو', after:false },
  KWD:{ code:'KWD', symbol:'د.ك', en:'KWD', ar:'د.ك',  after:true },
};
function getAppSettings(){ try { return Object.assign({ currency:'EGP', language:'en', theme:'dark' }, JSON.parse(store.get(APP_SETTINGS_KEY)||'{}')); } catch(e){ return { currency:'EGP', language:'en', theme:'dark' }; } }
function setAppSettings(patch){ const next=Object.assign(getAppSettings(),patch); store.set(APP_SETTINGS_KEY, JSON.stringify(next)); return next; }
function currencySymbol(code){ return (CURRENCIES[code]||CURRENCIES.USD).symbol; }
// Central currency formatter. English -> "EGP 15,000"; Arabic -> "15,000 ج.م".
function formatCurrency(amount, currency, lang){
  const cur = CURRENCIES[currency] || CURRENCIES[getAppSettings().currency] || CURRENCIES.USD;
  const L = lang || getAppSettings().language || 'en';
  const amt = (Number(amount)||0).toLocaleString('en-US',{maximumFractionDigits:0});
  const label = L==='ar' ? cur.ar : cur.en;
  // Arabic: label after the number; English: label before the number.
  return L==='ar' ? (amt+' '+label) : (label+' '+amt);
}
// money(n, code?) — backwards-compatible wrapper used across the app; now
// routes through formatCurrency so every amount is language + currency aware.
const money = (n, code) => formatCurrency(n, code, getAppSettings().language);

function getLang(){ return getAppSettings().language || 'en'; }
function isRTL(){ return getLang()==='ar'; }
// t(key) — returns Arabic when language=ar and a translation exists, else the key itself.
function t(key){ if(getLang()!=='ar') return key; return I18N[key] || key; }
// Bare "YYYY-MM-DD" strings parse as UTC midnight; rendering them in a local
// timezone behind UTC shifted the day back by one. Format those as a pure date
// (no timezone) so the day shown always matches the day stored.
const _isBareDate = (d) => typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d);
const fmtDate = (d) => { if(!d) return '—'; const x = _isBareDate(d) ? new Date(d+'T00:00:00') : new Date(d); return isNaN(x)? d : x.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}); };
const fmtDateTime = (d) => { if(!d) return '—'; const x=new Date(d); return isNaN(x)? d : x.toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
const monthOf = (d) => (d||'').slice(0,7);
const thisMonth = () => todayISO().slice(0,7);
// Clickable links: any value that looks like a URL/domain becomes an <a> that
// opens in a new tab — never copy-paste. `Ln` renders a labelled clickable link.
// A value is a link only if it has an explicit scheme, starts with www., or is a
// bare host on a known TLD. File names (brief.pdf) and names (Mr.Kitty) are NOT links.
const _URL_FILE_EXT = /\.(pdf|docx?|xlsx?|pptx?|png|jpe?g|gif|svg|webp|mp4|mov|avi|mkv|mp3|wav|zip|rar|7z|csv|txt|ai|psd|eps|sketch|fig|key|pages|numbers)$/i;
const _URL_TLD = /\.(com|net|org|io|co|app|dev|me|ly|so|xyz|info|biz|tv|store|online|site|link|page|cloud|design|gg|eg|sa|ae|uk|us|fr|de)(\/|\?|#|$)/i;
const isUrl = (v) => { if(typeof v!=='string') return false; v=v.trim(); if(!v || /\s/.test(v)) return false;
  if(/^(https?:\/\/|mailto:|tel:)/i.test(v)) return true;
  if(_URL_FILE_EXT.test(v)) return false;
  return /^www\./i.test(v) || (/^([a-z0-9-]+\.)+[a-z]{2,}(\/|\?|#|$)/i.test(v) && _URL_TLD.test(v)); };
const normUrl = (v) => { v=String(v||'').trim(); if(/^(https?:\/\/|mailto:|tel:)/i.test(v)) return v; return 'https://'+v.replace(/^\/+/,''); };
const shortUrl = (v) => String(v||'').replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/\/$/,'').slice(0,42);
const Ln = ({ href, children, cls }) => href ? html`<a class=${cls||'lnk'} href=${normUrl(href)} target="_blank" rel="noopener noreferrer" onClick=${e=>e.stopPropagation()}>${children||shortUrl(href)}</a>` : html`<span>—</span>`;
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const isOverdue = (d) => d && new Date(d) < new Date(todayISO());
const byId = (arr,id) => (arr||[]).find(x=>x.id===id) || null;
const nameById = (arr,id,f='name') => { const r=byId(arr,id); return r ? (r[f]||r.title||r.name||'—') : '—'; };

// ---- editable permission overrides (saved to localStorage) ----
// Shape: { RoleName: { Module: ['View','Edit',...] } }. Any role present here
// fully replaces that role's defaults; absent roles use PERMISSIONS above.
const PERM_OVERRIDE_KEY = 'tia_permissions';
function getPermOverrides(){ try { return JSON.parse(store.get(PERM_OVERRIDE_KEY)||'{}')||{}; } catch(e){ return {}; } }
function setPermOverrides(obj){ store.set(PERM_OVERRIDE_KEY, JSON.stringify(obj||{})); }
// effective matrix for a role = override if present, else default
function effectivePerms(role){
  const ov = getPermOverrides();
  if(ov[role]) return ov[role];
  const r = PERMISSIONS[role] ? role : (Object.keys(ROLE_ALIAS).find(k=>aliasRole(k)===aliasRole(role)&&PERMISSIONS[k]) || role);
  return PERMISSIONS[r] || null;
}
// can(role, module, action) — action-level check used to gate buttons.
function can(role, module, action){
  if(role==='Owner' || aliasRole(role)==='Admin') return true; // Owner always full
  const map = effectivePerms(role);
  if(!map){ if(action==='View') return true; return false; }
  return (map[module]||[]).includes(action);
}
// Who can edit the permission matrix: Owner always, plus any role granted the
// 'Manage' action on the Settings module (Owner can grant this to others).
function canManagePermissions(role){
  if(role==='Owner' || aliasRole(role)==='Admin') return true;
  return (effectivePerms(role) || {})['Settings']?.includes('Manage') || false;
}

// Absent module = inherit the role default. Owner/Admin always full.
function userAccessMap(user){ return (user && user.access) || {}; }
function userSeesModule(user, key, role){
  if(MODULE_ALWAYS_ON.includes(key)) return true;
  if(ADMIN_ONLY_SECTIONS.includes(key)) return isAdminRole(role); // system config: Owner/Admin only, not overridable
  if(user && (user.role==='Owner' || aliasRole(user.role)==='Admin')) return canView(key, role);
  const a = userAccessMap(user)[key];
  if(a==='hidden') return false;
  if(a==='view' || a==='edit') return true;
  return canView(key, role);
}
function userCanEditSection(user, key, role){
  if(user && (user.role==='Owner' || aliasRole(user.role)==='Admin')) return canEdit(key, role);

  if(a==='edit') return true;
  if(a==='view' || a==='hidden') return false;

}

// Which request types each role may approve
const FINANCE_REQ = ['Expense Request','Purchase Request','Bonus Request','Salary Adjustment','Client Discount Request','Invoice Approval'];
const PM_REQ = ['Task Approval','Deliverable Approval','Send to Client Approval','Deadline Change','Project Scope Change','Leave Request','Tool Access Request'];
const TIMEOFF_REQ = ['Leave Request','Permission Request','Lateness Report','Early Leave','Half Day'];
function canApproveRequest(role, reqType){
  const a = aliasRole(role); // resolve business names (Owner→Admin, Manager→PM, …)
  if(a==='Admin') return true;
  if(a==='HR') return TIMEOFF_REQ.includes(reqType);
  if(a==='Accountant') return FINANCE_REQ.includes(reqType);
  if(a==='Project Manager') return PM_REQ.includes(reqType) || TIMEOFF_REQ.includes(reqType) || ['Proposal Approval','Quotation Approval','Contract Approval'].includes(reqType);
  if(a==='Marketing Director' || a==='Art Director') return TIMEOFF_REQ.includes(reqType);
  return false;
}

// Restrict the records a role is allowed to see (Client = own; creatives = assigned)
function filterRecordsByRole(coll, records, role, user){
  if(!user) return records;
  role = aliasRole(role);
  if(role==='Admin') return records;
  if(role==='Client'){
    const cid = user.clientId;
    if(coll==='requests') return []; // clients never see internal approval requests
    if(coll==='clientAssets') return records.filter(r=>r.clientId===cid && r.visibility==='Client Visible');
    if(coll==='chatMessages') return records.filter(r=>r.clientId===cid && r.visibility==='Client Visible');
    if(['projects','deliverables','invoices','files','revisions','payments','contracts','reports','clientAssets'].includes(coll))
      return records.filter(r=>r.clientId===cid);
    return records;
  }
  if(coll==='requests'){
    // employees see their own + ones assigned to them; managers handled in views
    if(['Project Manager','Accountant','HR','Marketing Director','Art Director'].includes(role)) return records;
    return records.filter(r=>r.requestedBy===user.id || r.assignedManagerId===user.id);
  }
  if(coll==='chatMessages'){
    return records.filter(r=>r.visibility!=='Client Visible' || true); // staff see internal + client-visible
  }
  // Tasks: every non-manager sees ONLY the tasks assigned to them. Managers
  // (Sales/PM/Marketing Director/Art Director) and Admin/Owner see everyone's.
  if(coll==='tasks' && !TASK_MANAGERS.includes(role)){
    return records.filter(r=>r.assignedTo===user.id || r.assignedTo===user.name);
  }
  // Deliverables stay scoped to their owner for the pure creative roles (unchanged).
  if((role==='Designer'||role==='Video Editor') && coll==='deliverables'){
    return records.filter(r=>r.assignedTo===user.id || r.assignedTo===user.name);
  }
  return records;
}

function getClientProjects(db,id){ return (db.projects||[]).filter(p=>p.clientId===id); }

const TASK_DONE = ['Done','Delivered','Approved','Cancelled'];
function calculateProjectProgress(db,id){ const ts=getProjectTasks(db,id); if(!ts.length) return 0; const done=ts.filter(t=>['Done','Delivered','Approved'].includes(t.status)).length; return Math.round(done/ts.length*100); }
function calculateTaskDelay(t){ const overdue = t && t.dueDate && new Date(t.dueDate) < new Date(todayISO()) && !TASK_DONE.includes(t.status); return { overdue:!!overdue, delayDays: overdue? Math.max(0, Math.round((new Date(todayISO())-new Date(t.dueDate))/86400000)) : 0 }; }
function calculateClientHealth(db,id){
  const tasks=getClientTasks(db,id); const overdueTasks=tasks.filter(t=>calculateTaskDelay(t).overdue).length;
  const pendingApprovals=getClientDeliverables(db,id).filter(d=>d.status==='Client Review').length;
  const overdueInv=(db.invoices||[]).filter(i=>i.clientId===id).filter(i=>{ const bal=(Number(i.amount)||0)*(1+(Number(i.tax)||0)/100) - (db.payments||[]).filter(p=>p.invoiceId===i.id).reduce((s,p)=>s+(Number(p.amount)||0),0); return bal>0 && i.dueDate && new Date(i.dueDate)<new Date(todayISO()); }).length;
  let score=100; score-=overdueTasks*8; score-=pendingApprovals*4; score-=overdueInv*15;
  if(score>=75) return {label:'Healthy',type:'ok',score}; if(score>=45) return {label:'Needs Attention',type:'warn',score}; return {label:'At Risk',type:'neg',score};
}
// status -> tag style class
function statusClass(s){
  if(!s) return '';
  const ok=['Won','Active','Approved','Approved Internally','Paid','Signed','Done','Accepted','Published','Delivered','Completed','Closed','Available'];
  const warn=['Negotiation','Client Review','Revision Requested','Revisions','Partially Paid','On Leave','Sent to Client','Pending','Pending Approval','Pending Internal Approval','Changes Requested','Renewal Needed','Paused','Busy','In Meeting','In Shooting','Requested','Draft'];
  const neg=['Lost','Overdue','Rejected','Cancelled','Blocked','Terminated','Expired','Churned','Overloaded','Inactive','Offline','Missing','Revoked'];
  if(ok.includes(s)) return 'ok';
  if(warn.includes(s)) return 'warn';
  if(neg.includes(s)) return 'neg';
  return '';
}

// ISO date helpers (timezone-safe: operate on YYYY-MM-DD strings, no Date parsing drift)
function formatDateISO(d){ if(!d) return ''; if(typeof d==='string') return d.slice(0,10); const x=new Date(d); const z=new Date(x.getTime()-x.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function isSameDayISO(a,b){ return a && b && formatDateISO(a)===formatDateISO(b); }
function isSameMonthISO(a,b){ return a && b && formatDateISO(a).slice(0,7)===formatDateISO(b).slice(0,7); }
function getMonthDays(year, month){ // month 0-11 -> array of YYYY-MM-DD for full weeks grid
  const first=new Date(Date.UTC(year,month,1)); const startDow=first.getUTCDay();
  const daysInMonth=new Date(Date.UTC(year,month+1,0)).getUTCDate();
  const cells=[]; for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++){ cells.push(`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`); }
  while(cells.length%7!==0) cells.push(null);
  return cells;
}
function getWeekDays(isoDate){ const [y,m,d]=isoDate.split('-').map(Number); const base=new Date(Date.UTC(y,m-1,d)); const dow=base.getUTCDay();
  const out=[]; for(let i=0;i<7;i++){ const dt=new Date(base.getTime()+(i-dow)*86400000); out.push(dt.toISOString().slice(0,10)); } return out; }
// Normalize an item from any source into the unified calendar shape.
function normalizeScheduledItem(raw, sourceType, db){
  const clientId = raw.clientId || (raw.projectId ? (byId(db.projects,raw.projectId)||{}).clientId : '') || '';
  const client = byId(db.clients, clientId);
  return {
    id: raw.id, sourceType,
    title: raw.title || raw.name || raw.deliverableTitle || '(untitled)',
    clientId, clientName: client ? (client.brandName||client.name||'') : (raw.clientName||''),
    brand: raw.brand || (client&&client.brand) || '',
    contentType: raw.contentType || raw.type || (sourceType==='task'?'Delivery':'Post'),
    platform: raw.platform || '',
    status: raw.status || 'Planned',
    approvalStatus: raw.approvalStatus || raw.approval || '',
    scheduledDate: formatDateISO(raw.scheduledDate || raw.schedulingDate || raw.publishingDate || raw.dueDate || raw.deadline || ''),
    scheduledTime: raw.scheduledTime || '',
    deadline: formatDateISO(raw.deadline || raw.dueDate || ''),
    assignedTo: raw.assignedTo || '',
    priority: raw.priority || 'Normal',
    caption: raw.caption || '', notes: raw.notes || '',
    assetUrl: raw.assetUrl || raw.previewLink || raw.deliveryLink || '',
    relatedTaskId: raw.relatedTaskId || (sourceType==='task'?raw.id:'') || raw.taskId || '',
    relatedDeliverableId: raw.relatedDeliverableId || (sourceType==='deliverable'?raw.id:'') || '',
    createdAt: raw.createdAt || '', updatedAt: raw.updatedAt || '',
  };
}
// Collect scheduled items from contentCalendar + deliverables + tasks + workflows.
function getScheduledContentItems(db){
  const out=[];
  (db.contentCalendar||[]).forEach(c=>{ if(c) out.push(normalizeScheduledItem(c,'content',db)); });
  (db.deliverables||[]).forEach(d=>{ const day=d.schedulingDate||d.publishingDate||d.dueDate; if(day) out.push(normalizeScheduledItem(d,'deliverable',db)); });
  (db.tasks||[]).forEach(tk=>{ if(tk.dueDate && (tk.taskType==='Reporting'||/post|reel|story|content|video|campaign|publish|shoot/i.test((tk.title||tk.name||'')+' '+(tk.taskType||'')))) out.push(normalizeScheduledItem(tk,'task',db)); });
  // workflows: surface a stage milestone as a calendar item when it carries a date
  (db.workflows||[]).forEach(w=>{ const day=w.scheduledDate||w.nextActionDate||w.dueDate||w.deadline; if(w && day){
    const stage=(typeof WORKFLOW_STAGES!=='undefined'&&WORKFLOW_STAGES[(w.stage||1)-1])||null;
    out.push(normalizeScheduledItem({ id:w.id, clientId:w.clientId, title:(stage?stage.name:'Workflow')+(w.clientId?' · '+((byId(db.clients,w.clientId)||{}).brandName||(byId(db.clients,w.clientId)||{}).name||''):''),
      contentType:'Delivery', status:'Planned', scheduledDate:day, deadline:w.deadline||w.dueDate||'', notes:stage?stage.action:'' },'workflow',db)); } });
  // de-dup by id+sourceType, keep items that actually have a scheduledDate
  const seen={}; return out.filter(i=>{ if(!i.scheduledDate) return false; const k=i.sourceType+':'+i.id; if(seen[k])return false; seen[k]=1; return true; });
}
function getCalendarItemsForDate(db, isoDate){ return getScheduledContentItems(db).filter(i=>i.scheduledDate===isoDate); }

/* HTML-escape any record/user-supplied value before it goes into a document
   HTML string. These docs are rendered via document.write()/innerHTML, so any
   raw field (e.g. a lead/brief note an anonymous visitor submitted) would
   otherwise execute as stored XSS. esc() is applied to every dynamic value in
   the builders below; numbers/dates/known labels (_money/fmtDate/PL) are safe. */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function _docHTML(type, rec, db){
  if(type==='invoice') return generateInvoiceHTML(rec,db);
  if(type==='receipt') return generateReceiptHTML(rec,db);
  if(type==='proposal') return generateProposalHTML(rec,db);
  if(type==='quotation') return generateQuotationHTML(rec,db);
  if(type==='contract') return generateContractHTML(rec,db);
  return '<div>Unknown document</div>';
}
function printDocument(type, rec, db){
  const w=window.open('','_blank','width=900,height=1000');
  if(!w){ alert('Allow pop-ups to print.'); return; }
  w.document.write(_docHTML(type,rec,db)); w.document.close();
  triggerWebhook('documentPrintedWebhook',{type,id:rec&&rec.id});
}
function copyDocumentText(type, rec, db){
  const tmp=document.createElement('div'); tmp.innerHTML=_docHTML(type,rec,db);
  const text=(tmp.textContent||'').replace(/\n{3,}/g,'\n\n').trim();
  if(navigator.clipboard) navigator.clipboard.writeText(text);
  return text;
}

function generateProjectSummary(db,id){

function generateAssetChecklist(db,id){

  return 'TEAM WORKLOAD\n'+(db.employees||[]).map(e=>{ const active=(db.tasks||[]).filter(t=>(t.assignedTo===e.id||t.assignedTo===e.name)&&!['Done','Delivered','Approved'].includes(t.status)).length;

const WEBHOOK_TYPES = ['newLeadWebhook','leadWonWebhook','newClientWebhook','newProjectWebhook','taskAssignedWebhook','taskDueWebhook','taskOverdueWebhook','deliverableClientReviewWebhook','deliverableApprovedWebhook','revisionRequestedWebhook','projectCompletedWebhook','clientRenewalWebhook','invoiceOverdueWebhook','monthlyReportWebhook',
